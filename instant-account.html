<style>
/* Nova Instant client account. Same palette as instant.html: deep forest,
   emerald, warm off-white. Separate from the NovaX merchant portal. */
:root{
  --forest:#0B2A20; --forest-2:#123a2d; --forest-line:#24503f; --forest-ink:#e9f4ee; --forest-muted:#9fbfb1;
  --emerald:#12C77C; --emerald-h:#19d688; --emerald-ink:#06301f; --emerald-deep:#0a7a4f;
  --paper:#F7F6F1; --card:#ffffff; --ink:#10221a; --ink-2:#3a4b42; --muted:#62736a;
  --line:#e3e8e2; --line-2:#cfd9d2; --mint:#e9f9f1; --lime:#d9ff74;
  --amber:#fff4da; --amber-ink:#7a5500; --red-bg:#fdecea; --red-ink:#9b1c13;
  --r:18px; --sa-b:env(safe-area-inset-bottom,0px);
  --display:Manrope,"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--emerald-deep);outline-offset:2px}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.hdr{position:sticky;top:0;z-index:50;background:var(--forest);color:var(--forest-ink)}
.hdr .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 10px 0 14px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:48px}
.brand img{width:28px;height:28px;border-radius:8px}
.brand b{font:800 17px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--emerald)}
.hdr .go{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--emerald);color:var(--emerald-ink);font-weight:800;font-size:14.5px;text-decoration:none;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(32px + var(--sa-b))}
h1{font:800 26px/1.15 var(--display);letter-spacing:-.025em;margin:6px 0 6px}
.lead{color:var(--muted);margin:0 0 16px;font-size:15.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:12px}
.eyebrow{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;gap:10px}
.fld{margin-top:14px}
.fld:first-child{margin-top:0}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.inp{width:100%;min-height:52px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--card);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--emerald-deep);box-shadow:0 0 0 3px rgba(18,199,124,.18)}
.inp::placeholder{color:#8d9c94}
.pw{position:relative}.pw .inp{padding-right:74px}
.pw button{position:absolute;right:4px;top:4px;min-height:44px;min-width:60px;border:0;background:none;font-weight:700;font-size:14px;color:var(--emerald-deep)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:16px;border:1.5px solid transparent;font-weight:700;font-size:16.5px;text-decoration:none;white-space:nowrap}
.btn.wide{width:100%}
.btn.sm{min-height:46px;font-size:15px;padding:8px 14px;border-radius:14px}
.btn-primary{background:var(--emerald);border-color:var(--emerald);color:var(--emerald-ink)}
.btn-dark{background:var(--forest);border-color:var(--forest);color:#fff}
.btn-plain{background:var(--card);border-color:var(--line-2);color:var(--ink)}
.btn-quiet{background:none;border-color:transparent;color:var(--muted);font-weight:600;font-size:15px}
.btn[disabled]{background:#dfe6e1;border-color:#dfe6e1;color:#7c8a83;cursor:default}
.msg{font-size:14.5px;margin-top:10px;color:var(--red-ink)}
.msg.ok{color:var(--emerald-deep)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:14px}
.seg button{min-height:46px;border:0;border-radius:10px;background:none;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--forest);color:#fff}
.fine{font-size:13.5px;color:var(--muted);line-height:1.5;margin:12px 2px 0}
.fine a{color:var(--emerald-deep);font-weight:700;display:inline-block;padding:12px 2px;margin:-12px -2px}
/* Wallet */
.bal{border-radius:22px;padding:20px 18px;background:var(--forest);color:var(--forest-ink);position:relative;overflow:hidden}
.bal::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(18,199,124,.28),transparent);pointer-events:none}
.bal small{display:block;font:700 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--forest-muted)}
.bal .amt{font:800 40px/1.1 var(--display);letter-spacing:-.03em;color:#fff;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.bal .amt span{font-size:18px;color:var(--emerald);margin-right:4px}
.bal .pend{font-size:14.5px;color:var(--forest-muted);margin:0}
.bal .pend b{color:var(--lime);font-weight:700}
.bal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative;z-index:1}
.bal .btn-plain{background:transparent;border-color:var(--forest-line);color:#fff}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{min-height:46px;border:0;background:none;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;font-size:15px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--emerald)}
.job{display:block;color:inherit;text-decoration:none;padding:13px 0;border-top:1px solid var(--line)}
.job:first-child{border-top:0;padding-top:0}
.job:last-child{padding-bottom:0}
.job .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.job b{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.job .st{font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--muted)}
.job .st.live{color:var(--emerald-deep)} .job .st.bad{color:var(--red-ink)}
.job small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.job .cod{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--amber);color:var(--amber-ink)}
.job .cod.ok{background:var(--mint);color:var(--emerald-deep)}
.ent{list-style:none;margin:0;padding:0}
.ent li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line)}
.ent li:first-child{border-top:0;padding-top:0}
.ent b{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.ent small{font-size:13px;color:var(--muted)}
.ent .a{font:800 15px/1.3 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.ent .a.plus{color:var(--emerald-deep)}
.ent i{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber);padding:1px 6px;border-radius:6px;margin-left:4px}
.req{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.req:first-child{border-top:0;padding-top:0}
.req i{font-style:normal;font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:99px;background:var(--paper);color:var(--ink-2);white-space:nowrap}
.req i.Paid{background:var(--mint);color:var(--emerald-deep)} .req i.Rejected{background:var(--red-bg);color:var(--red-ink)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15px}
.empty b{display:block;color:var(--ink);font:800 18px/1.3 var(--display);margin-bottom:4px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.45;background:var(--mint);color:var(--ink-2);margin-bottom:12px}
.note.warn{background:var(--amber);color:var(--amber-ink)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sa-b));transform:translateX(-50%);z-index:300;background:var(--forest);color:#fff;padding:11px 16px;border-radius:999px;font-size:14.5px;max-width:calc(100vw - 28px);text-align:center}
.two{display:grid;gap:14px}
@media (min-width:560px){ .two{grid-template-columns:1fr 1fr} }
@media (max-width:360px){ .hdr .go{padding:0 10px;font-size:14px} .bal .amt{font-size:34px} }
</style>
</head>
<body>
<header class="hdr"><div class="in">
  <a class="brand" href="instant.html" aria-label="Nova Instant"><img src="/assets/favicon.svg" alt="" width="28" height="28"><b>Nova <i>Instant</i></b></a>

</div></header>
<main id="main"><div class="empty">Loading&hellip;</div></main>
<div id="live" class="sr" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>

<script src="/assets/vendor/supabase-2.117.2.js"></script>
<script>
(function(){
  "use strict";
  var SB_URL="https://rhzunbzbdzicajqtohwp.supabase.co";
  var SB_KEY="sb_publishable_yH8i0Q43BAxXoExo95r0rQ_fCeRdHXA";
  var $=function(id){ return document.getElementById(id); };
  /* The Nova Instant sign-in has its own storage key, so it never signs
     anyone out of NovaX. Someone who signed in on the NovaX homepage with an
     Instant account is still let in through that sign-in. */
  var INST_KEY="nvi-instant-auth", sb=null, sbMain=null, sbInst=null;
  try{ sbMain=window.supabase.createClient(SB_URL,SB_KEY); sbInst=window.supabase.createClient(SB_URL,SB_KEY,{ auth:{ storageKey:INST_KEY } }); }catch(e){}
  sb=sbInst||sbMain;
  var S={ me:null, jobs:null, ledger:null, tab:"jobs", form:null, busy:false };

  /* supabase-js resolves with {error}; this turns it into a rejection. */
  function rpc(name,args){
    return Promise.resolve(sb.rpc(name,args||{})).then(function(r){ if(r&&r.error) throw new Error(r.error.message||"Request failed"); return r?r.data:null; });
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"'`]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c]; }); }
  function rs(n){ return "Rs "+Number(n||0).toLocaleString("en-PK"); }
  function toast(t){ var el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.appendChild(el); setTimeout(function(){ el.remove(); },3000); }
  function when(iso){ try{ return new Date(iso).toLocaleString("en-GB",{ timeZone:"Asia/Karachi", day:"numeric", month:"short", hour:"numeric", minute:"2-digit", hour12:true }); }catch(e){ return ""; } }
  function pkPhone(raw){
    var d=String(raw==null?"":raw).replace(/[^\d]/g,"");
    if(d.length===14&&d.slice(0,4)==="0092") d=d.slice(4); else if(d.length===13&&d.slice(0,3)==="092") d=d.slice(3);
    else if(d.length===12&&d.slice(0,2)==="92") d=d.slice(2); else if(d.length===11&&d.charAt(0)==="0") d=d.slice(1);
    return /^3\d{9}$/.test(d)?("0"+d):"";
  }
  function friendly(m){
    m=String(m||"");
    if(/Invalid login credentials/i.test(m)) return "Wrong email or password.";
    if(/already registered|already been registered/i.test(m)) return "This email already has an account. Sign in instead.";
    if(/Password should be/i.test(m)) return "Choose a password of at least 8 characters.";
    if(/fetch|network|Failed|Load failed/i.test(m)) return "No connection. Check your internet and try again.";
    return m||"Something went wrong. Try again.";
  }
  function sayMsg(el,t,ok){ if(!el) return; el.textContent=t; el.className="msg"+(ok?" ok":""); }
  function busyBtn(b,on,label){ if(!b) return; if(on){ b.dataset.l=b.textContent; b.disabled=true; b.textContent=label||"Working…"; } else { b.disabled=false; if(b.dataset.l) b.textContent=b.dataset.l; } }

  /* ───── start ───── */
  function boot(){
    if(!sb){ $("main").innerHTML='<div class="empty"><b>NovaX could not load</b>Check your internet and refresh.</div>'; return; }
    var join=/[?&]join=1/.test(location.search);
    Promise.resolve(sbInst.auth.getSession()).then(function(r){
      if(r&&r.data&&r.data.session){ sb=sbInst; return load(true); }
      /* No Instant sign-in here: a NovaX homepage sign-in that is an Instant account works too. */
      return Promise.resolve(sbMain.auth.getSession()).then(function(m){
        if(!(m&&m.data&&m.data.session)) return renderAuth(join?"join":"signin");
        return Promise.resolve(sbMain.rpc("nvi_client_me")).then(function(x){
          if(x&&!x.error&&x.data){ sb=sbMain; return load(true); }
          sb=sbInst; renderAuth(join?"join":"signin");
        });
      });
    }).catch(function(){ sb=sbInst; renderAuth("signin"); });
  }
  function load(first){
    return rpc("nvi_client_me").then(function(me){
      if(!me) return renderFinish();
      S.me=me;
      return Promise.all([rpc("nvi_client_jobs",{ p_limit:150 }), rpc("nvi_client_ledger",{ p_limit:120 })]).then(function(x){
        S.jobs=x[0]||[]; S.ledger=x[1]||[];
        if(!S.form&&!typing()) paint(); else if(first) paint();
        listen();
      });
    }).catch(function(e){
      $("main").innerHTML='<div class="empty"><b>Could not open your account</b>'+esc(friendly(e.message))+'<div style="margin-top:14px"><button class="btn btn-plain sm" type="button" data-act="reload">Try again</button></div></div>';
    });
  }
  function typing(){ var a=document.activeElement; return !!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); }
  /* A delivery moving, or the office paying out, updates this page by itself. */
  var ch=null, liveT=null;
  function listen(){
    if(ch) return;
    try{ ch=sb.channel("nvi").on("broadcast",{ event:"changed" },function(){ clearTimeout(liveT); liveT=setTimeout(function(){ if(!document.hidden&&S.me) load(false); },600); }).subscribe(); }catch(e){}
  }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&S.me&&!S.form) load(false); });

  /* ───── sign in / create account ───── */
  function renderAuth(view){
    S.me=null;
    $("main").innerHTML='<h1>Your Nova Instant account</h1><p class="lead">See every delivery you booked, and get your cash-on-delivery money in your wallet.</p>'+
      '<div class="seg" role="tablist"><button type="button" role="tab" data-auth="signin" aria-selected="'+(view==="signin")+'">Sign in</button><button type="button" role="tab" data-auth="join" aria-selected="'+(view==="join")+'">Create account</button></div>'+
      (view==="signin"?
        '<form class="card" id="fIn" novalidate><div class="fld"><label class="lbl" for="inEmail">Email</label><input class="inp" id="inEmail" type="email" inputmode="email" autocomplete="email" maxlength="254"></div>'+
        '<div class="fld"><label class="lbl" for="inPass">Password</label><div class="pw"><input class="inp" id="inPass" type="password" autocomplete="current-password" maxlength="72"><button type="button" data-show="inPass">Show</button></div></div>'+
        '<div class="fld"><button class="btn btn-dark wide" id="inBtn" type="submit">Sign in</button></div>'+
        '<button class="btn btn-quiet wide" type="button" id="forgot">Forgot your password?</button><div class="msg" id="inMsg" role="alert"></div></form>'
      :
        '<form class="card" id="fJoin" novalidate><div class="two"><div><label class="lbl" for="jName">Your name or shop name</label><input class="inp" id="jName" autocomplete="name" maxlength="80"></div>'+
        '<div><label class="lbl" for="jPhone">Mobile</label><input class="inp" id="jPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="03XX XXXXXXX"></div></div>'+
        '<div class="fld"><label class="lbl" for="jAddr">Your usual pickup address (optional)</label><input class="inp" id="jAddr" maxlength="300" autocomplete="street-address" placeholder="Shop or house number, area"></div>'+
        '<div class="fld"><label class="lbl" for="jEmail">Email</label><input class="inp" id="jEmail" type="email" inputmode="email" autocomplete="email" maxlength="254"></div>'+
        '<div class="fld"><label class="lbl" for="jPass">Choose a password (8 or more characters)</label><div class="pw"><input class="inp" id="jPass" type="password" autocomplete="new-password" maxlength="72"><button type="button" data-show="jPass">Show</button></div></div>'+
        '<div class="fld"><button class="btn btn-primary wide" id="jBtn" type="submit">Create my account</button></div><div class="msg" id="jMsg" role="alert"></div>'+
        '<p class="fine">Free. This is a Nova Instant account only, separate from NovaX merchant accounts. By creating it you agree to the <a href="instant-terms.html" target="_blank" rel="noopener">Nova Instant rules</a>.</p></form>');
  }
  function renderFinish(){
    $("main").innerHTML='<h1>One more step</h1><p class="lead">Add your name and mobile to finish your Nova Instant account.</p>'+
      '<form class="card" id="fFin" novalidate><div class="two"><div><label class="lbl" for="fName">Your name or shop name</label><input class="inp" id="fName" autocomplete="name" maxlength="80"></div>'+
      '<div><label class="lbl" for="fPhone">Mobile</label><input class="inp" id="fPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="03XX XXXXXXX"></div></div>'+
      '<div class="fld"><label class="lbl" for="fAddr">Your usual pickup address (optional)</label><input class="inp" id="fAddr" maxlength="300" placeholder="Shop or house number, area"></div>'+
      '<div class="fld"><button class="btn btn-primary wide" id="fBtn" type="submit">Finish</button></div><div class="msg" id="fMsg" role="alert"></div>'+
      '<button class="btn btn-quiet wide" type="button" data-act="signout">Sign out</button></form>';
  }
  var SAVE_SAY={ novax_login:"This email is a NovaX Logistics login. Use a different email for Nova Instant.", name:"Enter your name.", phone:"Enter a mobile like 0300 1234567.", signin:"Sign in again." };
  function saveClient(name,phone,addr,msg,btn){
    return rpc("nvi_client_save",{ p_name:name, p_phone:phone, p_address:addr||null }).then(function(r){
      if(r&&r.ok===false){
        busyBtn(btn,false); sayMsg(msg,SAVE_SAY[r.reason]||"That did not save.");
        if(r.reason==="novax_login") Promise.resolve(sb.auth.signOut()).catch(function(){});
        return false;
      }
      return load(true).then(function(){ return true; });
    });
  }
  function doJoin(e){
    e.preventDefault();
    var name=$("jName").value.trim(), phone=pkPhone($("jPhone").value), addr=$("jAddr").value.trim(), email=$("jEmail").value.trim().toLowerCase(), pass=$("jPass").value, msg=$("jMsg"), btn=$("jBtn");
    if(name.length<2) return sayMsg(msg,SAVE_SAY.name);
    if(!phone) return sayMsg(msg,SAVE_SAY.phone);
    if(!/^\S+@\S+\.\S+$/.test(email)) return sayMsg(msg,"Enter your email.");
    if(pass.length<8) return sayMsg(msg,"Choose a password of at least 8 characters.");
    busyBtn(btn,true,"Creating your account…");
    sb=sbInst;
    Promise.resolve(sb.auth.signUp({ email:email, password:pass, options:{ data:{ full_name:name, instant:true } } })).then(function(r){
      if(r.error) throw new Error(r.error.message);
      var u=r.data&&r.data.user;
      if(u&&Array.isArray(u.identities)&&u.identities.length===0) throw new Error("This email already has an account. Sign in instead.");
      if(!r.data.session){ busyBtn(btn,false); return sayMsg(msg,"Check your email to confirm it, then come back and sign in.",true); }
      return saveClient(name,phone,addr,msg,btn);
    }).catch(function(err){ busyBtn(btn,false); sayMsg(msg,friendly(err&&err.message)); });
  }
  function doSignIn(e){
    e.preventDefault();
    var email=$("inEmail").value.trim().toLowerCase(), pass=$("inPass").value, msg=$("inMsg"), btn=$("inBtn");
    if(!/^\S+@\S+\.\S+$/.test(email)||!pass) return sayMsg(msg,"Enter your email and password.");
    busyBtn(btn,true,"Signing in…");
    sb=sbInst;
    Promise.resolve(sb.auth.signInWithPassword({ email:email, password:pass })).then(function(r){
      if(r.error) throw new Error(r.error.message);
      return load(true);
    }).catch(function(err){ busyBtn(btn,false); sayMsg(msg,friendly(err&&err.message)); });
  }
  function doFinish(e){
    e.preventDefault();
    var name=$("fName").value.trim(), phone=pkPhone($("fPhone").value), msg=$("fMsg"), btn=$("fBtn");
    if(name.length<2) return sayMsg(msg,SAVE_SAY.name);
    if(!phone) return sayMsg(msg,SAVE_SAY.phone);
    busyBtn(btn,true,"Saving…");
    saveClient(name,phone,$("fAddr").value.trim(),msg,btn).catch(function(err){ busyBtn(btn,false); sayMsg(msg,friendly(err&&err.message)); });
  }
  function doForgot(){
    var email=($("inEmail").value||"").trim().toLowerCase(), msg=$("inMsg");
    if(!/^\S+@\S+\.\S+$/.test(email)){ $("inEmail").focus(); return sayMsg(msg,"Type your email above first, then press Forgot your password."); }
    Promise.resolve(sb.auth.resetPasswordForEmail(email,{ redirectTo:location.origin+"/new-password.html" })).catch(function(){}).then(function(){
      sayMsg(msg,"If "+email+" has an account, a reset link is on its way. Check your inbox and spam.",true);
    });
  }

  /* ───── the account ───── */
  var LIVE=["Awaiting confirmation","Booked","Rider assigned","Picked up","Failed delivery","Returning"];
  var STSAY={ "Awaiting confirmation":"NovaX will call", "Booked":"Finding a rider", "Rider assigned":"Rider on the way", "Picked up":"On the bike",
    "Failed delivery":"Not delivered yet", "Returning":"Coming back", "Returned":"Returned", "Delivered":"Delivered", "Cancelled":"Cancelled" };
  var KIND={ cod_delivered:"Cash on delivery collected", cod_release:"Cash on delivery ready", payout_requested:"Withdrawal asked for",
    payout_rejected:"Withdrawal returned", adjustment:"Correction by NovaX" };
  /* Withdraw is offered when enough is ready and no request is waiting. */
  function canW(){ var me=S.me||{}, av=Number((me.wallet||{}).available||0);
    return me.withdrawals_enabled!==false&&av>0&&av>=Number(me.min_withdraw||0)&&!(me.payouts||[]).some(function(p){ return p.status==="Requested"; }); }
  function short(t){ return String(t||"").split(",")[0].trim()||"Karachi"; }
  function paint(){
    var me=S.me, w=me.wallet||{}, av=Number(w.available||0), pe=Number(w.pending||0);
    var h='<h1>Hello, '+esc(String(me.client.name).split(" ")[0])+'</h1><p class="lead" style="margin-bottom:12px">Your deliveries and your cash-on-delivery money, in one place.</p>';
    if(me.client.status==="Blocked") h+='<div class="note warn"><span><b>Your account is on hold'+(me.client.block_reason?': '+esc(me.client.block_reason):'')+'.</b> New cash-on-delivery bookings are paused. You can still withdraw money that is ready. Call NovaX to sort it out.</span></div>';
    if(me.withdrawals_enabled===false) h+='<div class="note warn"><span>Withdrawals are paused at NovaX for now. Your money is safe in your wallet.</span></div>';
    h+='<section class="bal"><small>Ready to withdraw</small><div class="amt"><span>Rs</span>'+esc(av.toLocaleString("en-PK"))+'</div>'+
       '<p class="pend">'+(pe>0?'<b>'+esc(rs(pe))+'</b> more is on its way: collected by riders, not yet paid in to NovaX.':'Cash on delivery you collect lands here once the rider has paid it in to NovaX.')+'</p>'+
       '<div class="row">'+(canW()?'<button class="btn btn-primary sm" type="button" data-wd="1">Withdraw</button>':'')+'<button class="btn btn-plain sm" type="button" data-tab="wallet"'+(canW()?'':' style="grid-column:1 / -1"')+'>Wallet history</button></div></section>';
    h+='<div class="tabs" role="tablist">'+[["jobs","Deliveries"],["wallet","Wallet"],["profile","Profile"]].map(function(x){ return '<button type="button" role="tab" data-tab="'+x[0]+'" aria-selected="'+(S.tab===x[0])+'">'+x[1]+'</button>'; }).join("")+'</div>';
    if(S.tab==="jobs") h+=jobsHtml(); else if(S.tab==="wallet") h+=walletHtml(); else h+=profileHtml();
    $("main").innerHTML=h;
  }
  function jobsHtml(){
    var list=S.jobs||[];
    if(!list.length) return '<div class="card empty"><b>No deliveries yet</b>Book your first one: the fare shows before you book.<div style="margin-top:14px"><a class="btn btn-primary sm" href="instant.html">Book a delivery</a></div></div>';
    var live=list.filter(function(j){ return LIVE.indexOf(j.status)>-1; }), done=list.filter(function(j){ return LIVE.indexOf(j.status)<0; });
    function row(j){
      var st=j.status, cls=LIVE.indexOf(st)>-1?"live":(st==="Cancelled"||st==="Returned")?"bad":"";
      var cod=Number(j.cod)>0?(st==="Delivered"?(j.cod_released?'<span class="cod ok">COD '+esc(rs(j.cod))+' &middot; in your wallet</span>':'<span class="cod">COD '+esc(rs(j.cod))+' &middot; waiting for the rider to pay in</span>'):
        (st==="Cancelled"||st==="Returned")?'<span class="cod">COD '+esc(rs(j.cod))+' &middot; not collected</span>':'<span class="cod">COD '+esc(rs(j.cod))+' to collect</span>'):"";
      return '<a class="job" href="instant.html?t='+encodeURIComponent(j.token)+'"><span class="t"><b>'+esc(short(j.from))+' &rarr; '+esc(short(j.to))+'</b><span class="st '+cls+'">'+esc(STSAY[st]||st)+'</span></span>'+
        '<small>'+esc(j.code)+' &middot; '+esc(when(j.at))+' &middot; '+esc(rs(j.fare))+(j.receiver?' &middot; to '+esc(j.receiver):'')+'</small>'+cod+'</a>';
    }
    return (live.length?'<section class="card"><p class="eyebrow"><span>On the way</span><span>'+live.length+'</span></p>'+live.map(row).join("")+'</section>':'')+
           (done.length?'<section class="card"><p class="eyebrow"><span>Finished</span><span>'+done.length+'</span></p>'+done.map(row).join("")+'</section>':'')+
           '<p class="fine">Tap a delivery to open its tracking page. Each one keeps its own link.</p>';
  }
  function walletHtml(){
    var me=S.me, w=me.wallet||{}, av=Number(w.available||0), min=Number(me.min_withdraw||0), h='';
    var open=(me.payouts||[]).some(function(p){ return p.status==="Requested"; });
    if(S.form==="withdraw"){
      h+='<form class="card" id="fW" novalidate><p class="eyebrow"><span>Withdraw</span><span>'+esc(rs(av))+' ready</span></p>'+
        '<div class="fld"><label class="lbl" for="wAmt">Amount (Rs)</label><input class="inp" id="wAmt" inputmode="numeric" pattern="[0-9]*" maxlength="7" value="'+esc(av)+'"></div>'+
        '<div class="fld"><label class="lbl" for="wMethod">Send it to</label><select class="inp" id="wMethod"><option>JazzCash</option><option>Easypaisa</option><option value="Bank">Bank account</option></select></div>'+
        '<div class="two fld"><div><label class="lbl" for="wTitle">Account name</label><input class="inp" id="wTitle" maxlength="80" autocomplete="name" value="'+esc(me.client.name)+'"></div>'+
        '<div><label class="lbl" for="wNum">Mobile account number or IBAN</label><input class="inp" id="wNum" maxlength="34" autocomplete="off" value="'+esc(me.client.phone)+'"></div></div>'+
        (me.client.cnic?'':'<div class="fld"><label class="lbl" for="wCnic">Your CNIC number (once, for the first withdrawal)</label><input class="inp" id="wCnic" inputmode="numeric" maxlength="15" placeholder="42101-1234567-1" autocomplete="off"></div>')+
        '<div class="fld"><button class="btn btn-dark wide" id="wBtn" type="submit">Ask NovaX to send it</button></div><button class="btn btn-quiet wide" type="button" data-form="">Back</button><div class="msg" id="wMsg" role="alert"></div>'+
        '<p class="fine">NovaX sends it and marks it paid with the transaction ID. The smallest withdrawal is '+esc(rs(min))+'.</p></form>';
    } else {
      h+='<section class="card"><p class="eyebrow"><span>Withdraw</span></p>'+
        (me.withdrawals_enabled===false?'<p style="margin:0;color:var(--ink-2)">Withdrawals are paused at NovaX for now.</p>':
         open?'<p style="margin:0;color:var(--ink-2)">You have a withdrawal waiting. NovaX pays it, then you can ask for the next one.</p>':
         av>=min&&av>0?'<button class="btn btn-dark wide" type="button" data-form="withdraw">Withdraw '+esc(rs(av))+'</button>':
         '<p style="margin:0;color:var(--ink-2)">You can withdraw once '+esc(rs(min))+' or more is ready.</p>')+'</section>';
    }
    var reqs=me.payouts||[];
    if(reqs.length) h+='<section class="card"><p class="eyebrow"><span>Withdrawals</span></p>'+reqs.map(function(p){
      return '<div class="req"><span>'+esc(rs(p.amount))+' to '+esc(p.method)+' '+esc(p.number)+'<br><small style="color:var(--muted);font-size:13px">'+esc(when(p.at))+(p.ref?' &middot; '+esc(p.ref):'')+(p.note?' &middot; '+esc(p.note):'')+'</small></span><i class="'+esc(p.status)+'">'+esc(p.status==="Requested"?"Waiting":p.status)+'</i></div>'; }).join("")+'</section>';
    /* The release of COD writes two lines (out of pending, into ready); only the second is shown. */
    var ent=(S.ledger||[]).filter(function(x){ return !(x.kind==="cod_release"&&x.bucket==="pending"); });
    h+='<section class="card"><p class="eyebrow"><span>History</span><span>'+ent.length+'</span></p>'+(ent.length?'<ul class="ent">'+ent.map(function(x){
      var a=Number(x.amount);
      return '<li><b>'+esc(KIND[x.kind]||x.kind)+(x.code?' &middot; '+esc(x.code):'')+(x.bucket==="pending"?'<i>on its way</i>':'')+'</b><span class="a'+(a>0?' plus':'')+'">'+(a>0?'+':'−')+esc(rs(Math.abs(a)))+'</span>'+
        '<small>'+esc(when(x.at))+(x.kind==="cod_delivered"?' &middot; after the fare':'')+(x.note?' &middot; '+esc(x.note):'')+'</small></li>'; }).join("")+'</ul>':'<p style="margin:0;color:var(--muted)">Nothing yet. Cash on delivery you collect shows here.</p>')+'</section>';
    return h;
  }
  function profileHtml(){
    var c=S.me.client;
    if(S.form==="profile") return '<form class="card" id="fP" novalidate><div class="two"><div><label class="lbl" for="pName">Name or shop name</label><input class="inp" id="pName" maxlength="80" value="'+esc(c.name)+'"></div>'+
      '<div><label class="lbl" for="pPhone">Mobile</label><input class="inp" id="pPhone" type="tel" inputmode="tel" maxlength="20" value="'+esc(c.phone)+'"></div></div>'+
      '<div class="fld"><label class="lbl" for="pAddr">Usual pickup address</label><input class="inp" id="pAddr" maxlength="300" value="'+esc(c.address||"")+'"></div>'+
      '<div class="fld"><button class="btn btn-dark wide" id="pBtn" type="submit">Save</button></div><button class="btn btn-quiet wide" type="button" data-form="">Back</button><div class="msg" id="pMsg" role="alert"></div></form>';
    return '<section class="card"><dl class="kv"><dt>Name</dt><dd>'+esc(c.name)+'</dd><dt>Mobile</dt><dd>'+esc(c.phone)+'</dd><dt>Email</dt><dd>'+esc(c.email||"")+'</dd>'+
      '<dt>Pickup</dt><dd>'+esc(c.address||"Not added")+'</dd><dt>CNIC</dt><dd>'+esc(c.cnic||"Added at your first withdrawal")+'</dd><dt>Since</dt><dd>'+esc(when(c.since))+'</dd></dl>'+
      '<div class="fld"><button class="btn btn-plain wide sm" type="button" data-form="profile">Edit details</button></div></section>'+
      '<section class="card"><p class="eyebrow"><span>Help</span></p><div class="two"><a class="btn btn-plain sm" href="tel:+92'+esc(String(S.me.support||"03123922558").replace(/\D/g,"").replace(/^0/,""))+'">Call NovaX</a>'+
      '<a class="btn btn-plain sm" href="https://wa.me/92'+esc(String(S.me.support||"03123922558").replace(/\D/g,"").replace(/^0/,""))+'" target="_blank" rel="noopener">WhatsApp</a></div></section>'+
      '<button class="btn btn-quiet wide" type="button" data-act="signout" style="margin-top:8px">Sign out</button>';
  }
  var W_SAY={ min:"The smallest withdrawal is ", method:"Choose where to send it.", title:"Enter the account name.", number:"Enter a valid mobile account number or IBAN.",
    open:"You already have a withdrawal waiting.", withdrawals_off:"Withdrawals are paused at NovaX for now.", balance:"That is more than is ready to withdraw.", cnic:"Enter your 13-digit CNIC number.", signin:"Sign in again." };
  function doWithdraw(e){
    e.preventDefault();
    var amt=Number(($("wAmt").value||"").replace(/\D/g,"")), msg=$("wMsg"), btn=$("wBtn");
    if(!amt) return sayMsg(msg,"Enter the amount.");
    var cn=$("wCnic"); if(cn&&cn.value.replace(/\D/g,"").length!==13) return sayMsg(msg,W_SAY.cnic);
    busyBtn(btn,true,"Sending…");
    rpc("nvi_client_withdraw",{ p_amount:amt, p_method:$("wMethod").value, p_title:$("wTitle").value.trim(), p_number:$("wNum").value.trim(), p_cnic:cn?cn.value:null }).then(function(r){
      if(r&&r.ok===false){ busyBtn(btn,false); return sayMsg(msg,(W_SAY[r.reason]||"That did not work.")+(r.reason==="min"?rs(r.min)+".":"")); }
      S.form=null; toast("Asked. NovaX will send it and mark it paid."); return load(true);
    }).catch(function(err){ busyBtn(btn,false); sayMsg(msg,friendly(err&&err.message)); });
  }
  function doProfile(e){
    e.preventDefault();
    var name=$("pName").value.trim(), phone=pkPhone($("pPhone").value), msg=$("pMsg"), btn=$("pBtn");
    if(name.length<2) return sayMsg(msg,SAVE_SAY.name);
    if(!phone) return sayMsg(msg,SAVE_SAY.phone);
    busyBtn(btn,true,"Saving…");
    rpc("nvi_client_save",{ p_name:name, p_phone:phone, p_address:$("pAddr").value.trim()||null }).then(function(r){
      if(r&&r.ok===false){ busyBtn(btn,false); return sayMsg(msg,SAVE_SAY[r.reason]||"That did not save."); }
      S.form=null; toast("Saved."); return load(true);
    }).catch(function(err){ busyBtn(btn,false); sayMsg(msg,friendly(err&&err.message)); });
  }

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-auth],[data-tab],[data-wd],[data-form],[data-act],[data-show],#forgot"); if(!t) return;
    if(t.dataset.auth) return renderAuth(t.dataset.auth);
    if(t.hasAttribute("data-show")){ var i=$(t.getAttribute("data-show")); if(i){ var sh=i.type==="password"; i.type=sh?"text":"password"; t.textContent=sh?"Hide":"Show"; } return; }
    if(t.id==="forgot") return doForgot();
    if(t.dataset.tab){ S.tab=t.dataset.tab; S.form=null; paint(); return; }
    if(t.dataset.wd){ S.tab="wallet"; S.form="withdraw"; paint(); var wa=$("wAmt"); if(wa) try{ wa.focus(); }catch(e2){} return; }
    if(t.hasAttribute("data-form")){ S.form=t.getAttribute("data-form")||null; paint(); var f=document.querySelector("#main form .inp"); if(f&&S.form) try{ f.focus(); }catch(e2){} return; }
    if(t.dataset.act==="reload") return boot();
    if(t.dataset.act==="signout"){ Promise.resolve(sb.auth.signOut()).catch(function(){}).then(function(){ S.me=null; S.jobs=null; S.ledger=null; renderAuth("signin"); }); }
  });
  document.addEventListener("submit",function(e){
    var id=e.target.id;
    if(id==="fIn") return doSignIn(e);
    if(id==="fJoin") return doJoin(e);
    if(id==="fFin") return doFinish(e);
    if(id==="fW") return doWithdraw(e);
    if(id==="fP") return doProfile(e);
  });
  boot();
})();
</script>
</body>
</html>
