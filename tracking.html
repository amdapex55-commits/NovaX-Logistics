<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Opens the connection to the database while the page loads, so the
     first lookup does not pay for it. crossorigin: supabase-js fetches
     without credentials, which uses a separate connection pool. -->
<link rel="preconnect" href="https://rhzunbzbdzicajqtohwp.supabase.co" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track your parcel &middot; NovaX</title>
<link rel="icon" href="/assets/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NovaX Logistics">
<meta property="og:title" content="Track your parcel · NovaX Logistics">
<meta property="og:description" content="Live tracking for your NovaX parcel. Open the link to see where it is right now.">
<meta property="og:image" content="https://novaxlogistics.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Track your parcel · NovaX Logistics">
<meta name="twitter:description" content="Live tracking for your NovaX parcel.">
<meta name="twitter:image" content="https://novaxlogistics.com/assets/og-image.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e12">
<meta name="color-scheme" content="light dark">

<meta name="robots" content="noindex,nofollow">
<!-- AUDIT FIX: the tracking token lives in this page's URL. Without this,
     clicking the footer CTA sent the full URL (token included) to the
     destination's access logs and any analytics on it. rel="noopener"
     alone does NOT suppress the referrer. -->
<meta name="referrer" content="no-referrer">
<meta name="description" content="Track your NovaX parcel in real time.">
<style>
  /* NovaX public tracking (token link).
     Self-contained, no build step, mobile-first at 360px.
     This page is shown to the MERCHANT'S CUSTOMER, not the merchant, so it
     shows only what that customer needs: where the parcel is and how much
     cash to keep ready.

     9 Oct 2026: rebuilt in the portal's look. The colours below are the
     portal's own tokens (light and dark), copied here on purpose: a customer
     must never wait on a stylesheet the merchant portal owns. The theme
     follows the phone, because this visitor has no saved preference. */
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel-2:#f7f9fb; --line:#e5e9ee; --line-2:#d4dae1;
    --ink:#121821; --ink-2:#5b6875; --ink-3:#667380;
    --accent:#0c7c59; --accent-ink:#ffffff;
    --good-bg:#e6f6ee; --good-fg:#0c7c59; --good-ln:#b7e3ce;
    --warn-bg:#fff6e5; --warn-fg:#8a5a00; --warn-ln:#f0d9a8;
    --bad-bg:#fdecea;  --bad-fg:#b3261e;  --bad-ln:#f3c0ba;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px -14px rgba(16,24,40,.14);
    --r:16px;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0e12; --panel:#11151a; --panel-2:#161b21; --line:#1d232a; --line-2:#28303a;
      --ink:#e8eef4; --ink-2:#9aa7b4; --ink-3:#8793a0;
      --accent:#14c77b; --accent-ink:#04130d;
      --good-bg:rgba(20,199,123,.14); --good-fg:#5fe0a8; --good-ln:rgba(20,199,123,.32);
      --warn-bg:rgba(232,182,76,.14); --warn-fg:#e8b64c; --warn-ln:rgba(232,182,76,.3);
      --bad-bg:rgba(224,96,75,.15);   --bad-fg:#f0a396; --bad-ln:rgba(224,96,75,.34);
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 36px;min-width:0;}

  /* ── who it is from ──────────────────────────────────────────────────
     NovaX by default; the shop's own name, logo and colour on a token link
     when they have set them (applyBrand). Text takes the bar's colour, so
     a shop colour set from the script still reads. */
  .brandbar{
    display:flex;align-items:center;gap:11px;margin-bottom:12px;
    padding:11px 14px;border-radius:var(--r);
    background:var(--panel);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow);
  }
  .brandbar .logo{
    width:36px;height:36px;border-radius:10px;
    background:url(/assets/icon-192.png) center/contain no-repeat;flex:none;
  }
  .brandbar .t{min-width:0;flex:1;}
  .brandbar img.nv-shop-logo{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;padding:3px;box-sizing:border-box;flex:none;}
  .brandbar .nv-shop-initials{width:40px;height:40px;border-radius:10px;background:rgba(127,127,127,.2) none;
    display:grid;place-items:center;font-weight:850;font-size:15px;letter-spacing:.02em;flex:none;}
  .brandbar strong{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere;color:inherit;}
  .brandbar span{display:block;font-size:12.5px;color:inherit;opacity:.74;}
  .tk-live{display:inline-flex!important;align-items:center;gap:6px;flex:none;font-size:12.5px!important;font-weight:750;opacity:.9!important;}
  .tk-live[hidden]{display:none!important;}
  .tk-live i{width:8px;height:8px;border-radius:50%;background:#14c77b;box-shadow:0 0 0 3px rgba(20,199,123,.2);animation:tkPulse 1.8s ease-in-out infinite;}
  .brandbar[style] .tk-live i{background:currentColor;box-shadow:none;}
  @keyframes tkPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  /* ── the status, drawn like the portal's wallet card ─────────────────
     One dark green card in both themes, with the five stops inside it and
     the tracking number on a perforated stub, the way a label tears off. */
  .tk-hero{
    position:relative;overflow:hidden;margin-bottom:12px;padding:18px 16px 0;border-radius:20px;color:#fff;
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(31,143,99,.55) 0%, rgba(31,143,99,0) 55%),
      linear-gradient(135deg,#0b3a29 0%,#082418 60%,#06170f 100%);
    box-shadow:0 18px 40px -22px rgba(4,25,16,.6);
  }
  .tk-hero.is-bad{
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(190,70,55,.5) 0%, rgba(190,70,55,0) 55%),
      linear-gradient(135deg,#3b1613 0%,#27100e 60%,#180a09 100%);
  }
  .tk-hero.is-warn{
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(200,140,40,.45) 0%, rgba(200,140,40,0) 55%),
      linear-gradient(135deg,#3a2a0c 0%,#261b08 60%,#171005 100%);
  }
  .tk-hero.is-off{
    background:
      radial-gradient(120% 140% at 100% 0%, rgba(120,132,145,.4) 0%, rgba(120,132,145,0) 55%),
      linear-gradient(135deg,#232a32 0%,#181d23 60%,#101419 100%);
  }
  .tk-badge{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;}
  .tk-badge svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .tk-eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.74);padding-right:56px;}
  .status-head{margin:7px 0 5px;padding-right:56px;font-size:27px;line-height:1.15;font-weight:850;letter-spacing:-.02em;overflow-wrap:anywhere;}
  .status-urdu{margin:0;font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.86);overflow-wrap:anywhere;}
  .eta{margin:9px 0 0;font-size:14px;font-weight:750;color:#8ff0c7;}

  /* Five stops. Exception and return states never advance it: a refused
     parcel has not progressed, and painting it next to "Delivered" is a lie
     the customer can see through. */
  .prog{display:flex;align-items:flex-start;margin:18px 0 0;}
  .pstep{display:flex;flex-direction:column;align-items:center;gap:7px;flex:0 0 auto;min-width:0;}
  .pdot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.22);box-shadow:0 0 0 3px rgba(255,255,255,.06);}
  .pstep.on .pdot{background:#4ee6a5;box-shadow:0 0 0 3px rgba(78,230,165,.16);}
  .pstep.cur .pdot{box-shadow:0 0 0 5px rgba(78,230,165,.28);animation:tkPulse 1.8s ease-in-out infinite;}
  .pk{font-size:11.5px;color:rgba(255,255,255,.66);white-space:nowrap;}
  .pstep.on .pk{color:rgba(255,255,255,.92);}
  .pstep.cur .pk{color:#fff;font-weight:800;}
  .pbar{flex:1 1 auto;height:3px;border-radius:3px;background:rgba(255,255,255,.18);margin:5.5px 4px 0;min-width:6px;}
  .pbar.on{background:#4ee6a5;}
  .prog.trouble .pstep.cur .pdot{background:#ff9d8c;box-shadow:0 0 0 5px rgba(255,157,140,.26);}
  .prog.returning .pstep.cur .pdot{background:#f3cd72;box-shadow:0 0 0 5px rgba(243,205,114,.26);}
  .prog-note{margin:13px 0 0;font-size:13.5px;font-weight:650;line-height:1.45;}
  .prog-note.bad{color:#ffc4b8;} .prog-note.warn{color:#f6dc9c;}

  .tk-stub{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:18px -16px 0;padding:12px 16px;border-top:1.5px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.18);}
  .tk-stub::before,.tk-stub::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);}
  .tk-stub::before{left:-9px;} .tk-stub::after{right:-9px;}
  .tk-awb{min-width:0;font:800 17px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;overflow-wrap:anywhere;}
  .tk-awb small{display:block;margin-bottom:5px;font:800 10.5px/1 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.7);}
  .tk-copy{flex:none;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:750;line-height:1;
    color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);}
  .tk-copy:active{transform:scale(.98);}
  .tk-copy:focus-visible,.act:focus-visible,.tk-seller a:focus-visible,.nv-shop-wa:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* COD is the single highest-stakes number on this page -- the customer
     must have this cash ready when the rider knocks. */
  .cod{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;
    padding:14px 16px;border-radius:var(--r);background:var(--warn-bg);border:1px solid var(--warn-ln);}
  .cod>div:first-child{min-width:0;}
  .cod .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--warn-fg);}
  .cod .sub{font-size:13px;line-height:1.4;color:var(--ink-2);margin-top:3px;}
  .cod .amt{flex:none;font-size:28px;font-weight:900;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:16px;margin-bottom:12px;min-width:0;box-shadow:var(--shadow);}
  h2.sec{margin:0 0 14px;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
  .route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;}
  .route .lbl{display:block;margin-bottom:3px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);}
  .route .city{font-size:16px;font-weight:800;overflow-wrap:anywhere;min-width:0;color:var(--ink);}
  .route .city+.arrow+.city{text-align:right;}
  .route .arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);}
  .awbline{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .awbline:empty{display:none;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;min-width:0;overflow-wrap:anywhere;
    font-size:13px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);}
  .tk-note{margin:14px 0 0;padding:11px 13px;border-radius:12px;font-size:13.5px;line-height:1.5;
    background:var(--warn-bg);border:1px solid var(--warn-ln);color:var(--ink);overflow-wrap:anywhere;}

  .tl{list-style:none;margin:0;padding:0;}
  .tl li{position:relative;padding:0 0 18px 30px;min-width:0;}
  .tl li:last-child{padding-bottom:0;}
  .tl li:before{content:"";position:absolute;left:4px;top:3px;width:12px;height:12px;border-radius:50%;
    background:var(--panel);border:2px solid var(--line-2);}
  .tl li.done:before{background:var(--good-fg);border-color:var(--good-fg);}
  .tl li.now:before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--good-bg);}
  .tl li:after{content:"";position:absolute;left:9px;top:19px;bottom:1px;width:2px;background:var(--line);}
  .tl li:last-child:after{display:none;}
  .tl .s{font-size:14.5px;font-weight:750;color:var(--ink);overflow-wrap:anywhere;}
  .tl li.now .s{font-weight:850;}
  .tl .m{font-size:13px;color:var(--ink-2);margin-top:1px;overflow-wrap:anywhere;}
  .tl .d{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
  .hist-note{margin:14px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.45;}

  .acts{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;}
  .act{flex:1 1 46%;min-height:48px;padding:12px;border-radius:14px;cursor:pointer;
    font-family:inherit;font-size:14.5px;font-weight:750;line-height:1.2;color:var(--accent-ink);background:var(--accent);border:1px solid transparent;}
  .act:active{transform:scale(.985);}
  .act.ghost{background:var(--panel);color:var(--ink);border-color:var(--line-2);box-shadow:var(--shadow);}
  .nv-shop-wa{display:flex;align-items:center;justify-content:center;min-height:48px;margin:0 0 12px;padding:10px 14px;
    border-radius:14px;background:#25d366;color:#04140d;font-weight:800;font-size:14.5px;text-decoration:none;text-align:center;}

  .msg{text-align:center;padding:22px 8px;color:var(--ink-2);font-size:14.5px;line-height:1.5;overflow-wrap:anywhere;}
  .msg:before{content:"!";display:grid;place-items:center;width:44px;height:44px;margin:0 auto 12px;border-radius:50%;
    font-weight:900;font-size:20px;background:var(--warn-bg);border:1px solid var(--warn-ln);color:var(--warn-fg);}
  .msg strong{display:block;color:var(--ink);font-size:17px;font-weight:800;margin-bottom:6px;}
  .skel{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--panel-2),var(--line),var(--panel-2));
    background-size:200% 100%;animation:sh 1.2s infinite;margin:9px 0;}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* Whoever holds this link buys from an online seller, which makes them, or
     someone they know, a candidate. Quiet, and last on the page. */
  .tk-seller{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 0;padding:14px 16px;border-radius:var(--r);
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);}
  .tk-seller div{flex:1 1 200px;min-width:0;}
  .tk-seller b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);}
  .tk-seller span{display:block;margin-top:3px;font-size:13px;line-height:1.45;color:var(--ink-2);}
  .tk-seller a{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:13px;
    font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap;color:var(--accent-ink);background:var(--accent);}
  .tk-foot{margin:16px 0 0;text-align:center;font-size:12.5px;color:var(--ink-3);}

  @media (max-width:380px){
    .wrap{padding:12px 10px 30px;}
    .status-head{font-size:25px;}
    .cod .amt{font-size:25px;}
    .pk{font-size:11px;} .pbar{margin:5.5px 2px 0;}
  }
  @media (prefers-reduced-motion:reduce){ .tk-live i,.pstep.cur .pdot,.skel{animation:none;} }
</style>
</head>
<body>
<div class="wrap">
  <header class="brandbar">
    <div class="logo" role="img" aria-label="NovaX Logistics"></div>
    <div class="t">
      <strong>NovaX Logistics</strong>
      <span>Parcel tracking &middot; Live status</span>
    </div>
    <span class="tk-live" id="tkLive" hidden><i aria-hidden="true"></i>Live</span>
  </header>
  <main id="out">
    <div class="card">
      <div class="skel" style="width:60%"></div>
      <div class="skel" style="width:85%"></div>
      <div class="skel" style="width:40%"></div>
    </div>
  </main>
  <!-- These sit outside #out so a refresh that redraws the status cannot
       wipe them: the shop's WhatsApp button, the assistant, the seller note. -->
  <div id="tkWaSlot"></div>
  <div id="tkAiSlot"></div>
  <!-- Whoever is holding this link is a customer of an online seller, which
       makes them, or someone they know, a candidate. The link opens the
       signup anchor on the homepage, not its root, so signup actually opens. -->
  <aside class="tk-seller">
    <div><b>Are you a seller?</b><span>COD collected, and your money in your wallet the day it lands. Karachi &middot; Lahore &middot; Islamabad &middot; Rawalpindi.</span></div>
    <a href="https://novaxlogistics.com/#signup" target="_blank" rel="noopener noreferrer">Ship your parcels with NovaX</a>
  </aside>
  <p class="tk-foot">Delivered by NovaX Logistics</p>
</div>

<script src="/assets/vendor/supabase-2.117.2.js"></script>
<script>
/* NovaX public tracking page -- TOKEN version.
   Calls only public.public_track_parcel(p_token), which by definition can
   return nothing beyond: awb, status, origin/destination city, booked_at,
   updated_at, cod_amount, consignee FIRST name, rider FIRST name (only while
   out for delivery), exception note and the public step timeline. It cannot
   return the merchant's identity, wallet, fees, invoices, the consignee's
   phone or full address, or any internal id.

   The older AWB-based page (app/tracking.html -> track_parcel_public_v2) is
   left untouched and still works, because QR codes on labels already stuck to
   parcels in the field encode that AWB URL. */
(function(){
  var SB_URL="https://rhzunbzbdzicajqtohwp.supabase.co";
  var SB_KEY="sb_publishable_yH8i0Q43BAxXoExo95r0rQ_fCeRdHXA";
  var SITE="https://novaxlogistics.com";
  /* These are `var`s inside this IIFE, so they are local to it -- they were
     never on window. The AI widget lives in a SEPARATE script block further
     down, in its own IIFE, and could not see them, so its typeof guards
     both fell through: it
     built a bare relative URL, sent an empty Bearer token, hit this static
     site's own 404 page, failed to parse the HTML as JSON, and showed
     "I could not reach the tracking service" -- every time, for every
     visitor, since launch. Publishing them deliberately is the fix. */
  window.__nvTrackCfg = { url: SB_URL, key: SB_KEY };

  /* Everything a consignee sees is Pakistan time, whatever their phone is set
     to. The page previously printed a raw sliced ISO string ("2026-08-20T07:19"),
     which is both ugly and in UTC. */
  function pktTime(v){
    if(!v) return "";
    try{
      var d=new Date(String(v).indexOf("T")>-1?v:String(v).replace(" ","T")+"+05:00");
      if(isNaN(d)) return String(v).slice(0,16).replace("T"," ");
      return d.toLocaleString("en-GB",{ timeZone:"Asia/Karachi", day:"numeric", month:"short",
                                        hour:"2-digit", minute:"2-digit", hour12:true })+" PKT";
    }catch(e){ return String(v).slice(0,16).replace("T"," "); }
  }

  var FLOW=["New booked","Collected by rider","Arrived at warehouse","Parcel now in transit","Parcel received at destination","Parcel out for delivery","Delivered"];

  /* Plain-language English + Roman Urdu for every status the transition
     guard can produce. Roman Urdu matters: a large share of consignees in
     Pakistan read it far more comfortably than English. */
  var SAY={
    "New booked":              ["Booked","Aapka parcel book ho gaya hai."],
    "Collected by rider":      ["Picked up","Rider ne parcel utha liya hai."],
    "Arrived at warehouse":    ["At our hub","Parcel NovaX hub par pohnch gaya hai."],
    /* "On the way" is courier shorthand for "a rider is bringing it today", so
       both the seller and the consignee read an inter-city transit scan as an
       imminent delivery and waited in for it. This status means the parcel is
       moving BETWEEN cities and has not reached the destination hub yet, so the
       wording now says that and explicitly rules today out. */
    "Parcel now in transit":   ["In transit","Parcel abhi doosray shehar se aapke shehar aa raha hai. Aaj delivery nahi hogi."],
    "Parcel received at destination":["In your city","Parcel aapke shehar pohnch gaya hai."],
    "Parcel out for delivery": ["Out for delivery","Aaj aapka parcel pohnch raha hai — cash tayyar rakhein."],
    "Delivered":               ["Delivered","Parcel deliver ho chuka hai. Shukriya!"],
    "Refused":                 ["Delivery refused","Delivery se inkaar kiya gaya tha."],
    "Consignee not available": ["You were not available","Aap available nahi thay — dobara koshish hogi."],
    "Reattempt":               ["Re-attempt scheduled","Dobara delivery ki koshish ki jayegi."],
    "Reassigned":              ["Reassigned to a rider","Naye rider ko assign kiya gaya hai."],
    "Out of service area":     ["Out of service area","Yeh ilaqa filhaal service area se bahar hai."],
    "Ready for return":        ["Being returned","Parcel wapas bhaija ja raha hai."],
    "Return in transit":       ["Return in transit","Wapsi doosray shehar se wapas aa rahi hai. Aaj delivery nahi hogi."],
    "Return received at origin":["Return received","Wapsi origin par mosool ho gayi."],
    "Return out for delivery": ["Return out for delivery","Wapsi delivery ke liye nikli hai."],
    "Return to shipper":["Returned","Parcel wapas kar diya gaya hai."],
    "Cancelled by client":["Cancelled by the sender","Bhejnay walay ne cancel kar diya hai."]
  };
  var STEP_NOTE={
    "New booked":"Booked and waiting for pickup.",
    "Collected by rider":"Picked up by a NovaX rider.",
    "Arrived at warehouse":"Checked in at a NovaX sorting hub.",
    "Parcel now in transit":"In transit to the destination city.",
    "Parcel received at destination":"Arrived at the destination city.",
    "Parcel out for delivery":"Out for delivery.",
    "Delivered":"Delivered."
  };

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  /* admin, client and rider all render "Rs 1,234" via a shared
     Intl.NumberFormat. This page -- the only one a customer actually sees,
     and the one with no login -- was the odd one out at "₨ 1,234".
     Same value, different face, on the highest-traffic surface. */
  function money(n){
    var v=Number(n||0);
    if(!isFinite(v)) v=0;
    return "Rs "+v.toLocaleString("en-PK",{maximumFractionDigits:0});
  }
  /* BUG: this passed no timeZone, so every time on the page rendered in the
     VIEWER's zone. A parcel scanned 14:26 UTC showed as "7:26 am" to anyone
     sitting at UTC-7 -- wrong by twelve hours and the wrong meridiem -- while
     pktTime() two functions up correctly pinned Asia/Karachi. The parcel was
     scanned at a moment in Pakistan; that is the only zone this page should
     ever speak in, whoever is looking and whatever their phone is set to.
     hour12 is stated rather than inferred from the locale, because en-PK
     resolves to 24-hour on some engines and 12-hour on others. */
  function when(x){
    if(!x) return "";
    try{
      var d=new Date(x);
      if(isNaN(d.getTime())) return "";
      return d.toLocaleString("en-GB",{ timeZone:"Asia/Karachi",
        day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", hour12:true });
    }catch(e){ return ""; }
  }
  /* NovaX status rename: "Parcel returned to consignee" is a STORED value in
     parcels.status, so rows written before the migration (or by an
     un-upgraded rider app) still carry the old text. Normalising here means
     the public tracking page shows the right label either way. */
  var NV_STATUS_ALIASES={"Parcel returned to consignee":"Return to shipper"};
  function nvStatus(s){ s=String(s==null?"":s); return NV_STATUS_ALIASES[s]||s; }
  function tone(st){
    if(st==="Delivered") return "good";
    if(st==="Cancelled by client") return "";
    if(st==="Refused"||st==="Out of service area"||st==="Return to shipper") return "bad";
    if(st==="Consignee not available"||st==="Reattempt"||st==="Ready for return"||st==="Return in transit") return "warn";
    return "";
  }
  function param(k){
    try{ return new URLSearchParams(window.location.search).get(k)||""; }
    catch(e){ return ""; }
  }
  function show(html){ document.getElementById("out").innerHTML=html; }
  function fail(title,sub){
    show('<div class="card"><div class="msg"><strong>'+esc(title)+'</strong>'+esc(sub)+'</div></div>');
    var live=document.getElementById("tkLive"); if(live) live.hidden=true;
  }
  /* The journey, from nv_parcel_status_log -- a real scan history with a
     timestamp on every line, which is what TCS, Leopards and M&P all show
     from a bare tracking number and this page did not.

     The log trigger was added on 20 Aug 2026. Parcels booked before that have
     no rows, so an empty journey is not an error and must never render as an
     empty timeline: it falls through to the derived view below, which shows
     the forward flow up to the current status without inventing times. */
  function journeyRows(row){
    var j=row&&row.journey;
    try{ if(typeof j==="string") j=JSON.parse(j||"[]"); }catch(e){ j=null; }
    if(!Array.isArray(j)) return [];
    return j.map(function(e){
      if(!e||typeof e!=="object") return null;
      var st=nvStatus(e.status||"");
      if(!st) return null;
      return { status:st, at:e.at||null, note:e.note||STEP_NOTE[st]||"" };
    }).filter(Boolean);
  }

  function timelineHtml(row){
    var real=journeyRows(row);
    var html="", i;

    if(real.length){
      /* Newest first. A customer opening this wants the latest scan at the
         top, not to scroll to the bottom of a long history to find it. */
      for(i=real.length-1;i>=0;i--){
        var e=real[i], isNow=(i===real.length-1);
        /* A Delivered step followed by anything else was reversed by NovaX
           (the log only records changes). Say so, rather than showing
           "Delivered. Thank you." beneath a refusal. */
        var reversed=(e.status==="Delivered" && !isNow);
        html+='<li class="'+(isNow?"now":"done")+'">'+
              '<div class="s">'+esc(reversed?"Delivery update corrected":((SAY[e.status]&&SAY[e.status][0])||e.status))+'</div>'+
              (reversed?'<div class="m">This was recorded as delivered, then corrected by NovaX.</div>':(e.note?'<div class="m">'+esc(e.note)+'</div>':""))+
              (e.at?'<div class="d">'+esc(when(e.at))+'</div>':"")+
              '</li>';
      }
      return '<div class="card"><h2 class="sec">Journey</h2><ul class="tl">'+html+'</ul></div>';
    }

    /* ---- no logged history (parcel predates the log) ---- */
    var steps=[];
    try{
      if(Array.isArray(row.steps)) steps=row.steps;
      else if(typeof row.steps==="string") steps=JSON.parse(row.steps||"[]");
    }catch(e2){ steps=[]; }
    /* meta.steps is an array of PLAIN STRINGS in this codebase -- every
       writer confirms it (admin.html `parcel.steps.push(status)`, rider.html,
       the order-intake edge functions). Reading s.status off a string yields
       undefined and renders blank rows. */
    var norm=steps.map(function(x){
      return nvStatus((typeof x==="string")?x:((x&&(x.status||x.name))||""));
    }).filter(function(st){ return st&&SAY[st]; });

    var list=[];
    if(norm.length){ list=norm; }
    else{
      var idx=FLOW.indexOf(nvStatus(row.status));
      list = idx<0 ? [nvStatus(row.status)] : FLOW.slice(0,idx+1);
    }
    /* Only ever stamp a time we can stand behind. updated_at is when the ROW
       was last written, not when the step happened -- N4820014 was delivered
       12 Aug and its row was edited again on 27 Aug, so using updated_at here
       told the customer their parcel arrived a fortnight after it did.
       delivered_at is a real event time; everything else on this path has no
       recorded time and gets none. */
    var lastAt = (nvStatus(row.status)==="Delivered") ? (row.delivered_at||null) : null;
    for(i=list.length-1;i>=0;i--){
      var st2=list[i], last=(i===list.length-1);
      html+='<li class="'+(last?"now":"done")+'">'+
            '<div class="s">'+esc((SAY[st2]&&SAY[st2][0])||st2||"Status unavailable")+'</div>'+
            (STEP_NOTE[st2]?'<div class="m">'+esc(STEP_NOTE[st2])+'</div>':"")+
            (last&&lastAt&&when(lastAt)?'<div class="d">'+esc(when(lastAt))+'</div>':"")+
            '</li>';
    }
    return '<div class="card"><h2 class="sec">Journey</h2><ul class="tl">'+html+'</ul>'+
      '<p class="hist-note">Step-by-step times are recorded for parcels booked from 20 August 2026 onward.</p>'+
      '</div>';
  }

  /* A five-stop progress bar. Exception and return states deliberately do NOT
     advance it -- a refused parcel has not progressed, and showing it near
     "Delivered" would be a lie the customer can see through. */
  var PROGRESS=[
    {k:"Booked",    at:["New booked"]},
    {k:"Picked up", at:["Collected by rider","Arrived at warehouse"]},
    {k:"In transit",at:["Parcel now in transit","Parcel received at destination"]},
    {k:"Out",       at:["Parcel out for delivery"]},
    {k:"Delivered", at:["Delivered"]}
  ];
  function progressHtml(row){
    var st=nvStatus(row.status), reached=-1, i, j;
    for(i=0;i<PROGRESS.length;i++){
      for(j=0;j<PROGRESS[i].at.length;j++) if(PROGRESS[i].at[j]===st) reached=i;
    }
    var isReturn=/^Return|^Ready for return/.test(st);
    var isTrouble=["Refused","Consignee not available","Out of service area","Reattempt","Reassigned","Cancelled by client"].indexOf(st)>-1;
    if(reached<0 && !isReturn && !isTrouble) return "";
    if(reached<0){
      /* Off the forward flow: show how far it did get, from the log. */
      var real=journeyRows(row);
      for(i=0;i<real.length;i++)
        for(j=0;j<PROGRESS.length;j++)
          /* A failed parcel never reached Delivered, even if the log holds a
             Delivered step that was later reversed; stop at Out. */
          if(PROGRESS[j].at.indexOf(real[i].status)>-1 && j>reached && !(isTrouble && PROGRESS[j].k==="Delivered")) reached=j;
    }
    var cls=isTrouble?"trouble":isReturn?"returning":"";
    var out='<div class="prog '+cls+'">';
    for(i=0;i<PROGRESS.length;i++){
      out+='<div class="pstep'+(i<=reached?" on":"")+(i===reached?" cur":"")+'">'+
             '<span class="pdot"></span><span class="pk">'+esc(PROGRESS[i].k)+'</span>'+
           '</div>';
      if(i<PROGRESS.length-1) out+='<span class="pbar'+(i<reached?" on":"")+'"></span>';
    }
    out+='</div>';
    /* One line that is true for THIS status. A cancelled parcel does not
       "need attention", and one already returned is not "on its way back". */
    if(st==="Cancelled by client")    out+='<p class="prog-note warn">The seller cancelled this parcel.</p>';
    else if(isTrouble)                out+='<p class="prog-note bad">This parcel needs attention &mdash; see the journey below.</p>';
    if(st==="Return to shipper")      out+='<p class="prog-note warn">This parcel was returned to the seller.</p>';
    else if(isReturn)                 out+='<p class="prog-note warn">This parcel is on its way back to the seller.</p>';
    return out;
  }

  /* Copy and share, the two things a customer actually does with a tracking
     number. Share falls back to copy where the Web Share API is absent. */
  function actionsHtml(row){
    var awb=esc(row.awb||"");
    return '<div class="acts">'+
      '<button type="button" class="act ghost" onclick="nvShare(this)" data-awb="'+awb+'">Share this tracking</button>'+
      '</div>';
  }
  window.nvCopyAwb=function(btn){
    var v=btn.getAttribute("data-awb")||"";
    var done=function(){ var t=btn.textContent; btn.textContent="Copied"; setTimeout(function(){btn.textContent=t;},1400); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(done,function(){}); return; }
    try{
      var ta=document.createElement("textarea"); ta.value=v; ta.setAttribute("readonly","");
      ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); document.body.removeChild(ta); done();
    }catch(e){}
  };
  window.nvShare=function(btn){
    var v=btn.getAttribute("data-awb")||"";
    /* Share the AWB link, never location.href -- on a ?t= link that would
       hand the tokenised URL, and everything behind it, to whoever it is
       forwarded to. */
    var url=SITE+"/tracking.html?awb="+encodeURIComponent(v);
    function copyLink(){
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(function(){
          var t=btn.textContent; btn.textContent="Link copied"; setTimeout(function(){btn.textContent=t;},1400);
        },function(){btn.textContent="Could not copy link";});
      }else btn.textContent="Sharing unavailable";
    }
    if(navigator.share){ navigator.share({title:"NovaX parcel "+v, text:"Track NovaX parcel "+v, url:url}).catch(function(e){if(!e||e.name!=="AbortError") copyLink();}); return; }
    copyLink();
  };

  /* Statuses where the parcel is still moving between cities. Naming the
     destination removes the last bit of ambiguity: "In transit to Lahore"
     cannot be mistaken for a rider at the door. */
  var TRANSIT_TO_CITY = { "Parcel now in transit": 1, "Return in transit": 1 };

  /* ── Merchant brand on the tracking page (28 Sep 2026) ── */
  function nvLum(hex){
    var m=/^#([0-9a-f]{6})$/i.exec(hex||""); if(!m) return null;
    var n=parseInt(m[1],16), c=[(n>>16)&255,(n>>8)&255,n&255].map(function(v){
      v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); });
    return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
  }
  function nvContrast(a,b){ var x=Math.max(a,b), y=Math.min(a,b); return (x+0.05)/(y+0.05); }
  function applyBrand(b, awb){
    var bar=document.querySelector(".brandbar"); if(!bar) return;
    var name=String(b.display_name||"").trim(); if(!name) return;
    var accent=/^#[0-9a-f]{6}$/i.test(b.accent_hex||"")?b.accent_hex:null;
    var logo=bar.querySelector(".logo");
    if(logo){
      if(b.logo_url && /^https:\/\/rhzunbzbdzicajqtohwp\.supabase\.co\/storage\/v1\/object\/public\/merchant-logos\//.test(b.logo_url)){
        var img=document.createElement("img");
        img.className="logo nv-shop-logo"; img.alt=name+" logo"; img.src=b.logo_url;
        img.onerror=function(){ img.replaceWith(initials()); };
        logo.replaceWith(img);
      } else logo.replaceWith(initials());
    }
    function initials(){
      var d=document.createElement("div"); d.className="logo nv-shop-initials"; d.setAttribute("aria-hidden","true");
      d.textContent=name.split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0); }).join("").toUpperCase();
      return d;
    }
    var t=bar.querySelector(".t");
    if(t) t.innerHTML='<strong></strong><span>Your order &middot; delivered by NovaX Logistics</span>';
    if(t) t.querySelector("strong").textContent=name;
    /* A shop that has set a name but no colour gets NovaX green, which is
       what its Profile preview in the portal shows it. */
    if(!accent) accent="#0c7c59";
    if(accent){
      var L=nvLum(accent);
      /* White text if it reads on the colour, dark text otherwise. */
      var ink=nvContrast(L,1)>=4.5?"#ffffff":(nvContrast(L,nvLum("#0b1512"))>=4.5?"#0b1512":null);
      if(ink){ bar.style.background=accent; bar.style.color=ink; }
    }
    try{ document.title=name+" \u2014 track your order"; }catch(e){}
    if(b.support_whatsapp && /^923[0-9]{9}$/.test(b.support_whatsapp) && !document.getElementById("nvShopWa")){
      var a=document.createElement("a");
      a.id="nvShopWa"; a.className="nv-shop-wa"; a.target="_blank"; a.rel="noopener";
      a.href="https://wa.me/"+b.support_whatsapp+"?text="+encodeURIComponent("Hi "+name+", about my order "+(awb||""));
      a.textContent="Message "+name+" on WhatsApp";
      if(accent){ var L2=nvLum(accent); var ink2=nvContrast(L2,1)>=4.5?"#ffffff":"#0b1512";
        if(nvContrast(L2,nvLum(ink2))>=4.5){ a.style.background=accent; a.style.color=ink2; } }
      var slot=document.getElementById("tkWaSlot");
      if(slot) slot.appendChild(a); else bar.insertAdjacentElement("afterend",a);
    }
  }
  function render(row){
    var st=nvStatus(row.status)||"";
    var say=SAY[st]||[st||"Tracking",""];
    say = [say[0], say[1]];
    if (TRANSIT_TO_CITY[st]) {
      var destCity = String(row.destination_city || row.city || "").trim();
      if (destCity) say[0] = say[0] + " to " + destCity;
    }
    var t=tone(st);
    var cod=Number(row.cod_amount||0);
    /* "Keep this cash ready" only while the parcel is still coming. It was
       also shown on a refused parcel and on one travelling back to the
       seller, where nobody is going to collect it. A refusal that gets a
       second attempt becomes "Reattempt", and the amount shows again. */
    var showCod=cod>0 && ["Delivered","Refused","Out of service area","Cancelled by client"].indexOf(st)<0 && !/^Return|^Ready for return/.test(st);

    /* One icon for where the parcel is. Drawn here so the page needs no
       icon file; aria-hidden, because the headline already says it. */
    var ICON={
      box:'<path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="M3.5 8 12 12.5 20.5 8M12 12.5v8"/>',
      move:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
      done:'<circle cx="12" cy="12" r="8.5"/><path d="m8 12.3 2.7 2.7L16 9.6"/>',
      alert:'<path d="M12 4 21 19.5H3z"/><path d="M12 10v4.5M12 17v.4"/>',
      back:'<path d="M9 7 4 12l5 5"/><path d="M4 12h10a5 5 0 0 1 5 5v1"/>',
      off:'<circle cx="12" cy="12" r="8.5"/><path d="m8.5 8.5 7 7M15.5 8.5l-7 7"/>'
    };
    var isReturn=/^Return|^Ready for return/.test(st);
    var kind = st==="Delivered" ? "done" : st==="Cancelled by client" ? "off" : isReturn ? "back"
             : (t==="bad"||t==="warn") ? "alert" : (st==="New booked" ? "box" : "move");
    var heroCls = st==="Cancelled by client" ? " is-off" : t==="bad" ? " is-bad" : t==="warn" ? " is-warn" : "";
    /* Delivered parcels get the one fact a customer looks for after the
       fact -- when. Everything else gets no promise: we do not have a
       committed SLA per parcel, and inventing "arrives Tuesday" is how a
       tracking page loses trust the first time it is wrong.
       Only a parcel that IS delivered has a delivery time. N7810135 was
       marked Delivered in error, put back to Refused, and still printed
       "Delivered 22 Sept" under "Delivery refused". */
    var d=(st==="Delivered")?(row.delivered_at||row.updated_at):null;

    var head='<section class="tk-hero'+heroCls+'">'+
      '<span class="tk-badge" aria-hidden="true"><svg viewBox="0 0 24 24">'+ICON[kind]+'</svg></span>'+
      '<div class="tk-eyebrow">'+(row.consignee_first?'For '+esc(row.consignee_first):'Your parcel')+'</div>'+
      '<h1 class="status-head">'+esc(say[0])+'</h1>'+
      (say[1]?'<p class="status-urdu">'+esc(say[1])+'</p>':"")+
      (d&&when(d)?'<p class="eta">Delivered '+esc(when(d))+'</p>':"")+
      progressHtml(row)+
      '<div class="tk-stub">'+
        '<div class="tk-awb"><small>Tracking number</small>'+esc(row.awb||"")+'</div>'+
        '<button type="button" class="tk-copy" onclick="nvCopyAwb(this)" data-awb="'+esc(row.awb||"")+'">Copy</button>'+
      '</div>'+
    '</section>';

    var codHtml = showCod ?
      '<section class="cod">'+
        '<div><div class="lbl">Cash on delivery</div>'+
        '<div class="sub">Please keep this amount ready — yeh raqam tayyar rakhein.</div></div>'+
        '<div class="amt">'+esc(money(cod))+'</div>'+
      '</section>' : "";

    /* REMOVED long ago, and still out: "Updated <updated_at>". updated_at is
       when the ROW was last written, not when anything happened to the
       parcel -- the same reason the journey refuses to stamp steps with it. */
    var details='<section class="card">'+
      '<h2 class="sec">Delivery</h2>'+
      '<div class="route">'+
        '<div class="city"><span class="lbl">From</span>'+esc(row.origin_city||"—")+'</div>'+
        '<div class="arrow" aria-hidden="true">&rarr;</div>'+
        '<div class="city"><span class="lbl">To</span>'+esc(row.destination_city||"—")+'</div>'+
      '</div>'+
      '<div class="awbline">'+
        (row.rider_first?'<span class="pill">Rider: '+esc(row.rider_first)+'</span>':"")+
      '</div>'+
      (row.exception_note?'<p class="tk-note">'+esc(row.exception_note)+'</p>':"")+
    '</section>';

    show(head+codHtml+details+timelineHtml(row)+actionsHtml(row));
    var live=document.getElementById("tkLive"); if(live) live.hidden=nvIsFinal(st);
    try{ document.title=say[0]+" · "+(row.awb||"")+" · NovaX"; }catch(e){}
  }

  /* AWB fallback path. Uses track_parcel_public() — the public, limited RPC
     the homepage tracker already exposes — so no extra data becomes reachable
     by guessing an AWB. Shows current status; the full step-by-step journey
     still requires the tokenised link the seller sends. */
  /* AWB path. Now calls public_track_awb(), which returns the same journey,
     route and timestamps as the tokenised link but none of the personal
     fields -- no consignee name, no COD amount, no rider. So a guessed AWB
     reveals exactly what every other courier already publishes from a bare
     tracking number, and nothing that identifies anybody.

     It renders through render(), the same function the token path uses; the
     personal blocks simply do not appear because the columns are absent. */
  /* Shown only while background refreshes are failing, and kept outside #out
     so a re-render cannot wipe it. Says how old the status on screen is
     instead of letting it pass for live. */
  var NV_LAST_OK=Date.now();
  function nvRefreshTrouble(on){
    var el=document.getElementById("nvRefreshNote");
    if(!on){ NV_LAST_OK=Date.now(); if(el) el.hidden=true; return; }
    if(!el){
      el=document.createElement("div"); el.id="nvRefreshNote"; el.setAttribute("role","status");
      el.style.cssText="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:10px 14px;border-radius:10px;background:#3a2a06;color:#ffe3a3;font:600 13px/1.4 system-ui,-apple-system,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:50;text-align:center";
      document.body.appendChild(el);
    }
    var mins=Math.max(1,Math.round((Date.now()-NV_LAST_OK)/60000));
    el.textContent="Couldn\u2019t refresh just now \u2014 this status is from about "+mins+" min ago. We\u2019ll keep trying.";
    el.hidden=false;
  }
  function bootByAwb(sb, awb){
    sb.rpc("public_track_awb",{ p_awb: awb }).then(function(r){
      if(r&&r.error){ fail("Tracking is temporarily unavailable","Please try again in a moment."); return; }
      var row=(r&&r.data&&r.data[0])||null;
      if(!row){ fail("Parcel not found","We couldn't find a parcel with that tracking ID. Please check it and try again."); return; }
      render(row);
      if(nvIsFinal(row.status)) return;
      nvStartRefresh(function(){
        sb.rpc("public_track_awb",{ p_awb: awb }).then(function(r2){
          var n=(r2&&!r2.error&&r2.data&&r2.data[0])||null;
          /* A failed refresh used to do nothing at all, so a customer could
             watch a status that had stopped updating and never know. */
          if(!n){ nvRefreshTrouble(true); return; }
          nvRefreshTrouble(false);
          if(n.updated_at!==row.updated_at){ row=n; render(n); }
          if(nvIsFinal(n.status)) nvStopRefresh();
        }).catch(function(){ nvRefreshTrouble(true); });
      });
    }).catch(function(){
      fail("Cannot reach NovaX right now","Please check your internet connection and try again.");
    });
  }

  /* Quiet refresh while the page is open. A customer watching an out-for-
     delivery parcel should not have to pull to reload. Paused when the tab is
     hidden so a forgotten tab is not polling all night, and stopped entirely
     once the parcel reaches a state that cannot change on its own. */
  var NV_TIMER=null;
  /* States that cannot change on their own. Once a parcel reaches one there
     is nothing left to poll for, so the timer stops rather than hitting the
     database every minute for a page nobody will see change. */
  var NV_FINAL=["Delivered","Return to shipper","Cancelled by client"];
  function nvIsFinal(st){ return NV_FINAL.indexOf(nvStatus(st||""))>-1; }

  function nvStartRefresh(fn){
    if(NV_TIMER) return;
    NV_TIMER=setInterval(function(){ if(!document.hidden) fn(); },60000);
    document.addEventListener("visibilitychange",function(){
      if(!document.hidden) fn();
    });
  }
  function nvStopRefresh(){ if(NV_TIMER){ clearInterval(NV_TIMER); NV_TIMER=null; } }

  function boot(){
    var token=param("t");
    /* NovaX fix (dead "View full journey" link): the homepage and the client
       portal both link here as tracking.html?awb=..., but this page only ever
       read ?t=<token>, so every one of those links landed on "No tracking
       link" — a dead end for the customer.

       The token is NOT abandoned: ?t= still uses public_track_parcel(), which
       returns the full journey. An ?awb= link falls back to
       track_parcel_public(), the same limited, public RPC the homepage
       tracker already calls, so this exposes nothing that was not already
       public. Status summary instead of full timeline, rather than a dead end. */
    var awb=(param("awb")||param("track")||"").trim().toUpperCase();

    if(!token && !awb){
      fail("No tracking link","Please use the tracking link your seller sent you.");
      return;
    }
    if(!window.supabase||!window.supabase.createClient){
      fail("Cannot reach NovaX right now","Please check your internet connection and refresh.");
      return;
    }
    var sb;
    try{ sb=window.supabase.createClient(SB_URL,SB_KEY); }
    catch(e){
      fail("Cannot reach NovaX right now","Please refresh and try again.");
      return;
    }

    if(!token && awb){ bootByAwb(sb,awb); return; }

    sb.rpc("public_track_parcel",{ p_token: token }).then(function(r){
      if(r&&r.error){
        fail("Tracking is temporarily unavailable","Please try again in a moment.");
        return;
      }
      var row=(r&&r.data&&r.data[0])||null;
      if(!row){
        fail("Parcel not found","This tracking link is not valid. Please ask your seller for the correct link.");
        return;
      }
      render(row);
      /* The shop's own brand, if they set one. Token links only -- the ?awb=
         path never names the merchant (AWBs are sequential). A failure here
         leaves the NovaX header exactly as it was. */
      sb.rpc("public_track_brand",{ p_token: token }).then(function(br){
        var b=br&&!br.error&&br.data&&br.data[0];
        if(b) applyBrand(b, row.awb);
      }).catch(function(){});
    }).catch(function(){
      fail("Tracking is temporarily unavailable","Please try again in a moment.");
    });
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
  else boot();
})();
</script>
<style id="nvTrkAiStyles">
/* NovaX AI on the public tracking page. Self-contained: it uses this page's
   own colour tokens, and a consignee should never wait on a stylesheet the
   merchant portal owns. */
.nvtai{margin:0 0 12px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.nvtai-head{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line)}
.nvtai-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  color:var(--accent-ink);background:var(--accent);flex:none}
.nvtai-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.nvtai-t b{font-size:15px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.nvtai-t span{font-size:12.5px;color:var(--ink-2)}
.nvtai-stream{padding:16px;display:flex;flex-direction:column;gap:14px;max-height:340px;overflow-y:auto}
/* The turn slides in but never starts invisible: a page opened in a
   background tab does not run animations, and an answer must not wait on one. */
.nvtai-turn{animation:nvtaiIn .28s cubic-bezier(.2,.9,.2,1)}
@keyframes nvtaiIn{from{transform:translateY(6px)}to{transform:none}}
/* overflow-wrap:anywhere, because this assistant answers with tracking
   links and AWB runs. white-space:pre-wrap keeps the newlines the model
   sends, but on its own it will not break a long unbroken token: a full
   tracking URL rendered as one 549px line inside a 353px column on a
   375px phone, so the answer ran off the side and the reader had to
   scroll the chat sideways to finish reading it. */
.nvtai-ai{font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;
  overflow-wrap:anywhere;padding-left:14px;position:relative}
.nvtai-ai::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:2px;background:var(--accent)}
.nvtai-me{align-self:flex-end;max-width:80%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  overflow-wrap:anywhere;
  padding:9px 14px;border-radius:15px 15px 4px 15px;font-size:14px;margin-left:auto}
.nvtai-chips{display:flex;gap:8px;padding:0 16px 4px;flex-wrap:wrap}
.nvtai-chips:empty{display:none}
.nvtai-chip{display:inline-flex;align-items:center;min-height:40px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;border:1px solid var(--line-2);background:transparent;color:var(--ink);
  font:inherit;font-size:13px;font-weight:650;padding:0 14px;border-radius:99px;cursor:pointer}
.nvtai-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.nvtai-bar input{flex:1;min-width:0;border-radius:13px;border:1px solid var(--line-2);
  background:var(--panel-2);padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.nvtai-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--good-bg)}
.nvtai-bar input::placeholder{color:var(--ink-3)}
.nvtai-bar button{padding:0 18px;border-radius:13px;border:0;cursor:pointer;font:inherit;
  font-weight:800;font-size:14px;color:var(--accent-ink);background:var(--accent)}
.nvtai-bar button:disabled{opacity:.5;cursor:not-allowed}
.nvtai-dots{display:flex;gap:5px;align-items:center;padding-left:14px}
.nvtai-dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:nvtaiP 1.15s ease-in-out infinite}
.nvtai-dots i:nth-child(2){animation-delay:.16s}.nvtai-dots i:nth-child(3){animation-delay:.32s}
@keyframes nvtaiP{0%,80%,100%{opacity:.35;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (max-width:640px){
  .nvtai-stream{padding:14px;max-height:46vh}
  .nvtai-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
  .nvtai-chips::-webkit-scrollbar{display:none}
  .nvtai-chip{flex:0 0 auto;max-width:74vw}
}
@media (prefers-reduced-motion:reduce){.nvtai-turn{animation:none}.nvtai-dots i{animation:none;opacity:.7}}

/* The ask-a-question controls are 46px. This page is the merchant's CUSTOMER
   asking where their parcel is -- on a phone, usually already annoyed -- and
   it is the one place a mis-tap costs NovaX a support call rather than
   costing the customer a second try. */
.nvtai-bar input,.nvtai-bar button,#nvTrkInput,#nvTrkSend{height:46px;min-height:46px}
#nvTrkSend{min-width:64px}
</style>
<script>
/* NovaX AI — public tracking assistant.
   Scoped by the tracking token in this page's URL. It can see exactly one
   parcel and has no path to the merchant's account. */
(function(){
  "use strict";
  function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function tokenFromUrl(){
    try{
      var q=new URLSearchParams(location.search);
      return (q.get("t")||q.get("awb")||q.get("tracking")||"").trim();
    }catch(e){ return ""; }
  }

  function mount(){
    var host=document.getElementById("out");
    var token=tokenFromUrl();
    if(!host||!token||document.getElementById("nvTrkAi")) return;

    var wrap=document.createElement("div");
    wrap.className="nvtai"; wrap.id="nvTrkAi";
    wrap.innerHTML=
      '<div class="nvtai-head">'+
        '<span class="nvtai-mark" aria-hidden="true">'+
          '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+
          '<path d="M12 3l2.1 5.6L20 10.5l-5.9 1.9L12 18l-2.1-5.6L4 10.5l5.9-1.9z"/></svg>'+
        '</span>'+
        '<span class="nvtai-t"><b>Ask NovaX AI</b><span>About this parcel</span></span>'+
      '</div>'+
      '<div class="nvtai-stream" id="nvTrkStream" role="log" aria-live="polite"></div>'+
      '<div class="nvtai-chips" id="nvTrkChips"></div>'+
      '<div class="nvtai-bar">'+
        '<input id="nvTrkInput" placeholder="Where is my parcel?" aria-label="Ask about this parcel">'+
        '<button id="nvTrkSend" type="button">Ask</button>'+
      '</div>';
    var slot=document.getElementById("tkAiSlot");
    if(slot) slot.appendChild(wrap); else host.parentNode.insertBefore(wrap, host.nextSibling);

    var STREAM=document.getElementById("nvTrkStream"),
        CHIPS=document.getElementById("nvTrkChips"),
        INPUT=document.getElementById("nvTrkInput"),
        SEND=document.getElementById("nvTrkSend"),
        busy=false;

    function turn(role,text){
      var d=document.createElement("div");
      d.className="nvtai-turn "+(role==="me"?"nvtai-me":"nvtai-ai");
      d.textContent=String(text||"");
      STREAM.appendChild(d); STREAM.scrollTop=STREAM.scrollHeight;
      return d;
    }
    function dots(){
      var d=document.createElement("div");
      d.className="nvtai-turn nvtai-dots";
      d.innerHTML="<i></i><i></i><i></i>";
      STREAM.appendChild(d); STREAM.scrollTop=STREAM.scrollHeight;
      return d;
    }
    function chips(list){
      CHIPS.innerHTML="";
      (Array.isArray(list)?list:[]).slice(0,3).forEach(function(t,i){
        if(!t) return;
        var b=document.createElement("button");
        b.type="button"; b.className="nvtai-chip"; b.textContent=String(t);
        b.style.animationDelay=(i*60)+"ms";
        b.addEventListener("click",function(){ ask(String(t)); });
        CHIPS.appendChild(b);
      });
    }
    function cfg(){ return (window.__nvTrackCfg||{}); }
    function endpoint(){
      var base=cfg().url||"";
      return String(base).replace(/\/+$/,"")+"/functions/v1/novax-ai";
    }
    function anonKey(){ return cfg().key||""; }
    /* Never call the endpoint without real config -- a bare relative path is
       what produced the permanent failure this fix removes. */
    function configured(){ return !!(cfg().url && cfg().key); }

    function ask(text){
      if(busy) return;
      if(!configured()){
        turn("ai","The assistant is not available on this page right now. Your tracking details above are still accurate.");
        return;
      }
      busy=true; SEND.disabled=true;
      if(text){ turn("me",text); INPUT.value=""; }
      chips([]);
      var d=dots();
      fetch(endpoint(),{
        method:"POST",
        headers:{ "Content-Type":"application/json",
                  "Authorization":"Bearer "+anonKey(), "apikey":anonKey() },
        body:JSON.stringify({ mode:"track", token:token, message:text||"" })
      }).then(function(r){ return r.json(); })
        .then(function(j){
          d.remove();
          turn("ai", j.answer || "I could not read that just now.");
          chips(j.suggestions);
        })
        .catch(function(){
          d.remove();
          turn("ai","I could not reach the tracking service. Please refresh and try again.");
        })
        .then(function(){ busy=false; SEND.disabled=false; });
    }

    SEND.addEventListener("click",function(){ ask(INPUT.value.trim()); });
    INPUT.addEventListener("keydown",function(e){
      if(e.key==="Enter"){ e.preventDefault(); ask(INPUT.value.trim()); }
    });

    /* Deliberately NOT auto-firing. This used to run ask("") on mount, so
       every single visitor to a tracking link triggered a paid model call
       before typing anything. While the widget was broken that cost nothing;
       now that it works, an unprompted call on every page view is real money
       for a question nobody asked. The greeting is static and the first real
       call happens only when the visitor actually asks something. */
    turn("ai","Ask me anything about this parcel \u2014 where it is, when it should arrive, or what a status means.");
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",function(){ setTimeout(mount,900); });
  else setTimeout(mount,900);
})();
</script>
</body>
