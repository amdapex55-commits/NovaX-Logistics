     on to other sites. A tracking link itself is marked noindex in script. -->

<style>
/* Nova Instant: its own product inside NovaX. Deep forest, emerald, warm
   off-white; lime only as a small highlight. Calm, few borders, wide soft
   shadows, one primary button per screen. */
:root{
  --forest:#0B2A20; --forest-2:#123a2d; --forest-line:#24503f; --forest-ink:#e9f4ee; --forest-muted:#9fbfb1;
  --emerald:#12C77C; --emerald-h:#19d688; --emerald-ink:#06301f; --emerald-deep:#0a7a4f;
  --paper:#F7F6F1; --card:#ffffff; --ink:#10221a; --ink-2:#3a4b42; --muted:#62736a;
  --line:#e3e8e2; --line-2:#cfd9d2; --mint:#e9f9f1; --lime:#d9ff74;
  --amber:#fff4da; --amber-ink:#7a5500; --red-bg:#fdecea; --red-ink:#9b1c13;
  --r:18px; --shadow:0 18px 50px rgba(11,42,32,.10), 0 2px 8px rgba(11,42,32,.05);
  --hdr:56px; --sa-b:env(safe-area-inset-bottom,0px);
  --display:Manrope,"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--emerald-deep);outline-offset:2px}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Header */
.hdr{position:fixed;inset:0 0 auto 0;height:var(--hdr);z-index:60;background:var(--forest);color:var(--forest-ink);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.hdr a.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:48px}
.hdr .brand img{width:28px;height:28px;border-radius:8px}
.hdr .brand b{font:800 17px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
@media (max-width:400px){ #helpBtn{font-size:0;gap:0;padding:0 8px} #histBtn{font-size:14px;padding:0 6px} .hdr{padding-left:10px;gap:4px} }
a.hbtn{text-decoration:none;color:inherit}
@media (max-width:480px){ #acctBtn,#histBtn{font-size:0;gap:0;padding:0 10px;min-width:44px} }
.codacct{margin-top:12px;padding:14px;border-radius:14px;background:var(--mint);border:1px solid #cdeedd}
.codacct b{display:block;font-size:15.5px}
.codacct span{display:block;font-size:14px;color:var(--ink-2);line-height:1.45;margin-top:4px}
.codacct .row2{margin-top:12px}
.codnote{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--amber);color:var(--amber-ink);font-size:14.5px;line-height:1.45}
.codnote b{color:inherit}
/* The smallest phones: both header buttons become icons, so Help never falls off the edge. */
@media (max-width:340px){ #histBtn{font-size:0;gap:0;padding:0 10px;min-width:44px} }
.hdr .brand b i{font-style:normal;color:var(--emerald)}
.hbtn{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:48px;min-height:48px;padding:0 10px;white-space:nowrap;border:0;background:none;color:var(--forest-ink);font-weight:700;font-size:15px}

/* Map: the stage everything else sits on */
/* On a phone the map is the strip above the sheet (plus a little that the
   sheet's rounded corners overlap), so a route always fits what is visible. */
body{--peek:38vh}
body[data-step="1"][data-ready]{--peek:24vh}   /* both places set: room for the fare without scrolling */
body[data-step="2"],body[data-step="3"],body[data-step="4"]{--peek:15vh}
body[data-view="track"]{--peek:24vh}
.mapwrap{position:fixed;top:var(--hdr);left:0;right:0;height:calc(var(--peek) + 26px);z-index:1;background:#e8ede9;transition:height .26s cubic-bezier(.2,.8,.2,1)}
#map{position:absolute;inset:0}
.leaflet-container{font:inherit;background:#e8ede9}
.leaflet-control-attribution{font-size:12px;line-height:1.5}
.leaflet-top.leaflet-left{top:8px;left:6px}
.pm{width:32px;height:32px;display:grid;place-items:center;font:800 13px/1 var(--display);border:2.5px solid #fff;box-shadow:0 6px 16px rgba(11,42,32,.35)}
.pm.a{background:var(--emerald);color:var(--emerald-ink);border-radius:50%}
.pm.b{background:var(--forest);color:#fff;border-radius:10px 10px 10px 3px}
.pm.drop{animation:drop .32s cubic-bezier(.2,.9,.3,1.25)}
@keyframes drop{from{transform:translateY(-22px)}to{transform:none}}
.cross{display:none;position:absolute;left:50%;top:50%;z-index:600;width:38px;height:48px;margin:-48px 0 0 -19px;pointer-events:none}
.pinbar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:650;background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:16px 16px calc(16px + var(--sa-b))}
.pinbar p{margin:0 0 12px;font-size:15px;color:var(--ink-2);min-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinbar p b{color:var(--ink)}
.pinbar div{display:flex;gap:10px}
body.pinning{overflow:hidden}
body.pinning .mapwrap{z-index:80;top:0;left:0;height:100dvh;transition:none}
body.pinning .cross,body.pinning .pinbar{display:block}
body.pinning .leaflet-bottom{bottom:124px}

/* The sheet */
.stage{position:relative;z-index:10;pointer-events:none;padding-top:calc(var(--hdr) + var(--peek));transition:padding-top .26s cubic-bezier(.2,.8,.2,1);min-height:100dvh;display:flex;flex-direction:column}
.sheet{pointer-events:auto;flex:1;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -14px 40px rgba(11,42,32,.14);padding:10px 16px 0;display:flex;flex-direction:column}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 12px}
/* Entrances move, they never fade from nothing: content is readable even
   if an animation is paused or never runs. */
.pane.enter{animation:pane .24s ease-out}
@keyframes pane{from{transform:translateY(12px)}to{transform:none}}
@media (min-width:920px){
  .mapwrap{left:460px;height:calc(100dvh - var(--hdr));transition:none}
  .stage{padding-top:var(--hdr)!important;width:460px;min-height:100dvh}
  .sheet{border-radius:0;box-shadow:8px 0 40px rgba(11,42,32,.08);padding:22px 28px 0}
  .grab{display:none}
}
@media (prefers-reduced-motion:reduce){ .stage,.mapwrap{transition:none} .pane.enter,.pm.drop,.panel{animation:none} }

.steps{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.back{width:48px;height:48px;margin:-6px 0 -6px -12px;border:0;background:none;display:grid;place-items:center;color:var(--ink);border-radius:50%}
.bars{display:flex;gap:5px;flex:1}
.bars i{height:4px;flex:1;border-radius:99px;background:var(--line-2)}
.bars i.on{background:var(--emerald)}
.stepn{font:700 12px/1 var(--mono);letter-spacing:.08em;color:var(--muted);white-space:nowrap}
h1,h2{font-family:var(--display);letter-spacing:-.02em;margin:0}
h1{font-size:24px;line-height:1.15;font-weight:800}
h2{font-size:22px;line-height:1.2;font-weight:800}
.lead{margin:6px 0 16px;color:var(--muted);font-size:15px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card,.card + .note,.note + .card{margin-top:12px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.eyebrow{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.note svg{margin-top:1px}
.note.info{background:var(--mint);color:var(--emerald-deep)}
.note.warn{background:var(--amber);color:var(--amber-ink)}
.note.bad{background:var(--red-bg);color:var(--red-ink)}
.fine{font-size:13px;color:var(--muted);line-height:1.5;margin:12px 2px 0}
.fine a,.agree a,.linkish{color:var(--emerald-deep);font-weight:700}
/* A link inside a sentence gets a larger invisible hit area; the line keeps its height. */
.fine a,.agree a,.agree .linkish{display:inline-block;padding:14px 4px!important;margin:-14px -4px}
.linkish{background:none;border:0;padding:0;min-height:48px;display:inline-flex;align-items:center;gap:6px;font-size:14.5px;text-decoration:underline;text-underline-offset:3px}

/* Route rows */
.route{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.loc{position:relative;width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) 20px;gap:12px;align-items:center;min-height:64px;padding:10px 14px;border:0;background:none;text-align:left}
.loc + .loc{border-top:1px solid var(--line)}
.loc .dot{width:14px;height:14px;border-radius:50%;background:var(--emerald);justify-self:center;box-shadow:0 0 0 4px var(--mint)}
.loc .sq{width:13px;height:13px;border-radius:3px;background:var(--forest);justify-self:center;box-shadow:0 0 0 4px #e3e9e5}
.loc small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.loc b{display:block;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc.empty b{color:var(--muted);font-weight:500}
.loc svg{color:var(--line-2)}

/* Fare summary */
.farecard{margin-top:12px;background:var(--forest);color:var(--forest-ink);border-radius:var(--r);padding:16px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.farecard .k{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--forest-muted)}
.farecard .amt{font:800 38px/1 var(--display);letter-spacing:-.03em;color:#fff;margin-top:8px;font-variant-numeric:tabular-nums}
.farecard .amt small{font:700 17px/1 var(--display);color:var(--emerald);margin-right:4px;letter-spacing:0}
.farecard .meta{text-align:right;font-size:13.5px;color:var(--forest-muted);line-height:1.45}
.farecard .meta b{display:block;font:800 18px/1.1 var(--display);color:#fff;font-variant-numeric:tabular-nums}
.sk{display:inline-block;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.08) 75%);background-size:200% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){ .sk{animation:none} }
.avail{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:14px;color:var(--ink-2)}
.avail i{width:9px;height:9px;border-radius:50%;background:var(--emerald);flex:none}
.avail.none i{background:var(--line-2)}

/* Fields */
.fld{margin-top:14px}
.fld:first-child{margin-top:0}
.inp{width:100%;min-height:52px;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:14px;background:var(--card);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.inp::placeholder{color:#8d9c94}
.inp:focus{border-color:var(--emerald-deep);box-shadow:0 0 0 3px rgba(18,199,124,.18)}
.gbad{border-radius:16px;box-shadow:0 0 0 2px #c0392b,0 0 0 6px rgba(192,57,43,.12)}
.inp.bad,.agree.bad{border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.12)}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.two{display:grid;gap:12px}
@media (min-width:420px){ .two{grid-template-columns:1fr 1fr} }
.rs{position:relative}
.rs span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.rs .inp{padding-left:44px}

.place{display:flex;align-items:flex-start;gap:8px;margin:0 0 8px;font-size:14.5px;line-height:1.4;color:var(--ink-2)}
.place svg{color:var(--emerald-deep);margin-top:1px}
.place span{flex:1;min-width:0;overflow-wrap:anywhere}
.place .linkish{min-height:0;padding:14px 4px;margin:-14px -4px;font-size:14px}
.ferr{color:var(--red-ink)}
/* Parcel type tiles */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.type{min-height:84px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14px;color:var(--ink-2);padding:8px 4px;text-align:center;line-height:1.15;transition:transform .08s}
.type svg{width:26px;height:26px;color:var(--emerald-deep)}
.type[aria-pressed="true"]{border-color:var(--emerald-deep);background:var(--mint);color:var(--ink)}
.type:active,.btn:active,.seg button:active{transform:scale(.98)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.seg button{min-height:48px;border:0;border-radius:10px;background:none;font-weight:700;font-size:14.5px;color:var(--muted);padding:4px 6px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--forest);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;width:100%;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left}
.tog b{display:block;font-size:15px}
.tog small{display:block;font-size:13px;color:var(--muted)}
.tog i{width:46px;height:28px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.tog[aria-checked="true"] i{background:var(--emerald)}
.tog[aria-checked="true"] i::after{transform:translateX(18px)}
.limit{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--mint);color:var(--emerald-deep);font-size:14px;line-height:1.4}
.limit svg{width:44px;height:44px;flex:none}

/* People */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:48px;padding:6px 14px;border:1px solid var(--line-2);border-radius:99px;background:var(--card);font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.who{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.who .dot{width:12px;height:12px;border-radius:50%;background:var(--emerald)}
.who .sq{width:11px;height:11px;border-radius:3px;background:var(--forest)}
.who b{font:800 16px/1 var(--display)}

/* Review */
.rv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;margin:0;font-size:15px}
.rv dt{color:var(--muted)}
.rv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.rv dd small{display:block;color:var(--muted);font-weight:400;font-size:13.5px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2);font-weight:700}
.total b{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums}
.calc{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin-top:6px}
.agree{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start;margin-top:12px;padding:14px;border:1.5px solid var(--line-2);border-radius:14px;font-size:14.5px;line-height:1.45;color:var(--ink-2);background:var(--card);cursor:pointer}
.agree input{width:24px;height:24px;margin:0;accent-color:var(--emerald-deep)}

/* Buttons and the CTA bar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 18px;border-radius:16px;border:1.5px solid transparent;font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap;transition:transform .08s,background .15s}
.btn-primary{background:var(--emerald);border-color:var(--emerald);color:var(--emerald-ink)}
.btn-primary:hover{background:var(--emerald-h)}
.btn-plain{background:var(--card);border-color:var(--line-2);color:var(--ink)}
.btn-dark{background:var(--forest);border-color:var(--forest);color:#fff}
.btn-danger{background:var(--card);border-color:#e7c4bf;color:var(--red-ink)}
.btn[disabled]{background:#dfe6e1;border-color:#dfe6e1;color:#7c8a83;cursor:default}
.btn.wide{width:100%}
.btn.sm{min-height:48px;font-size:15px;padding:8px 14px;border-radius:14px}
.cta{position:sticky;bottom:0;margin:auto -16px 0;padding:14px 16px calc(14px + var(--sa-b));background:linear-gradient(to bottom,rgba(247,246,241,0),var(--paper) 26%);z-index:5}
@media (min-width:920px){ .cta{margin:auto -28px 0;padding:18px 28px 22px} }
.cta .msg{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--red-bg);color:var(--red-ink);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Full-screen panels: place picker, help, prohibited list */
.panel{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;flex-direction:column;animation:pane .22s ease-out}
.panel header{display:flex;align-items:center;gap:6px;min-height:56px;padding:0 10px 0 4px;background:var(--card);border-bottom:1px solid var(--line)}
.panel header b{font:800 17px/1 var(--display)}
.panel .x{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
.panel .body{flex:1;overflow:auto;padding:14px 16px calc(24px + var(--sa-b))}
@media (min-width:920px){ .panel{right:auto;width:460px;box-shadow:8px 0 40px rgba(11,42,32,.12)} }
.opt{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;min-height:60px;padding:8px 6px;border:0;background:none;text-align:left;border-radius:14px}
.opt:hover,.opt[aria-selected="true"]{background:var(--mint)}
.opt .ico{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--emerald-deep)}
.opt b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt[disabled]{opacity:.55}
.empty{padding:18px 6px;color:var(--muted);font-size:14.5px}
.ban{margin:0;padding:0 0 0 20px;font-size:15px;line-height:1.55;color:var(--ink-2)}
.ban li{margin-bottom:6px}

/* My deliveries */
.hcard{margin-top:12px}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.hrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:60px;padding:8px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.hhead + .hrow,.hcard > .hrow:first-child{border-top:0}

  /* ───── cash on delivery ─────

  function codNum(){ return Number(String(S.cod||"").replace(/[^\d]/g,""))||0; }

  function step4(){

    }
    if(t.id==="tCancel"){
      if(t.dataset.sure!=="1"){ t.dataset.sure="1"; t.textContent="Press again to cancel the booking"; setTimeout(function(){ if(t.isConnected){ t.dataset.sure="0"; t.textContent="Cancel this booking"; } },5000); return; }
      t.disabled=true; var mine=store("nvi_mine")||{}, mg=(mine[T.token]&&mine[T.token].m)||null;
      rpc("nvi_cancel",{ p_token:T.token, p_manage:mg }).then(function(r){
        t.dataset.sure="0";
        if(r.error||!r.data){ t.disabled=false; t.textContent="Cancel this booking"; toast("Could not cancel. Check your connection and try again."); return; }
        if(!r.data.ok) toast(r.data.reason==="too_late"?"The rider already has the parcel, so it can no longer be cancelled.":"Could not cancel this booking.");
        loadTrack(false);
      });
    }
  });
  window.addEventListener("popstate",function(e){
    if(S.skipPop){ S.skipPop=false; return; }
    if(S.ov){ S.ov=false; closePanelDom(); if(S.pinFor) leavePin(true); return; }
    var st=e.state;
    if(st&&st.nvi==="view"){ applyView(st.view,st.tk); return; }
    if(!st&&BOOT.view!=="book"){ applyView(BOOT.view,BOOT.tk); return; }
    /* A booking step, or the first screen. Coming back to it from tracking,
       the list or the account changes the sheet; the page is not loaded again. */
    var n=(st&&st.nvi==="step")?st.step:1;
    if(view()!=="book"){ stopTrack(); if(S.done) resetBooking(); setView("book"); }
    if(n>1&&!(S.quote&&S.quote.bookable!==false)) n=1;
    S.msg=""; S.step=n; render(true);
  });
  /* What the customer has typed survives a reload, a closed tab or a trip to
     WhatsApp and back, for 45 minutes, on this phone only. It comes back on
     the step they were on, with the fare checked again. Never kept: the rules
     tick, the "I am human" answer, PINs or tracking links. */
  var draftT=null;
  var DRAFT=["p","d","type","item","weight","fragile","value","note","sName","sPhone","pDet","rName","rPhone","dDet","payer","cod","step"];
  function saveDraft(){
    clearTimeout(draftT);
    draftT=setTimeout(function(){ try{ var o={ at:Date.now() }; DRAFT.forEach(function(k){ o[k]=S[k]; }); localStorage.setItem("nvi_draft",JSON.stringify(o)); }catch(e){} },300);
  }
  function dropDraft(){ clearTimeout(draftT); try{ localStorage.removeItem("nvi_draft"); sessionStorage.removeItem("nvi_draft"); }catch(e){} }
  function restoreDraft(){
    try{
      var o=JSON.parse(localStorage.getItem("nvi_draft")||sessionStorage.getItem("nvi_draft")||"null");
      if(!o||Date.now()-o.at>45*60000||!o.p||!o.d){ if(o) dropDraft(); return false; }
      DRAFT.forEach(function(k){ if(k!=="step"&&o[k]!==undefined) S[k]=o[k]; });
      S.resume=Math.min(Number(o.step)||1,4); S.step=1;
      return true;
    }catch(e){ return false; }
  }

  /* ───────── boot ───────── */
  /* Asked again by itself (2 s, 5 s, 12 s) if it does not answer, then left to the "Try again" link. */
  S.hint=(function(){ var o=store("nvi_st"); return o&&Date.now()-o.at<30*60000?o:null; })();
  function loadStatus(tries){
    S.statusErr=false;
    Promise.resolve(rpc("nvi_status")).catch(function(){ return null; }).then(function(r){
      var s=(r&&!r.error&&r.data&&typeof r.data==="object")?r.data:null;
      if(s){ S.status=s; store("nvi_st",{ open:!!s.open, hours_open:!!s.hours_open, riders_on:s.riders_on, open_hour:s.open_hour, close_hour:s.close_hour, at:Date.now() });
        if(s.mapbox&&!tilesOn) MAPBOX=String(s.mapbox); if(s.support) S.support=s.support; if(s.turnstile) loadCaptcha(String(s.turnstile)); }
      else if(!S.status){ if(tries<3) setTimeout(function(){ if(!S.status) loadStatus(tries+1); },[2000,5000,12000][tries]); else S.statusErr=true; }
      setTiles();
      if(document.body.getAttribute("data-view")==="book"&&!panel&&!S.pinFor) render();
    });
  }
  loadStatus(0);
  paintHistBtn();
  /* Signed in to a Nova Instant account? Fills the sender and allows COD. */
  loadClient().then(function(c){ if(c&&document.body.getAttribute("data-view")==="book"&&S.step===3&&!panel) render(); });
  var q0=new URLSearchParams(location.search), token=q0.get("t"), v0=q0.get("view");
  if(token) BOOT={ view:"track", tk:token }; else if(v0==="account") BOOT={ view:"acct", tk:null }; else if(v0==="deliveries") BOOT={ view:"list", tk:null };
  if(!token) histRefresh(function(){ if(document.body.getAttribute("data-view")==="book"&&S.step===1&&!(S.p&&S.d)&&!panel&&!S.pinFor) render(); });
  if(token) startTrack(token,false);
  else if(BOOT.view!=="book"){ restoreDraft(); S.resume=0; if(BOOT.view==="acct") showAcct(q0.get("join")?"join=1":""); else showList(); }
  else if(restoreDraft()){ render(); setTimeout(function(){ if(map){ map.invalidateSize(); paintMap(S.p,S.d,null); } },200); quote(); toast("We kept the details you had typed."); }
  else render();
})();
</script>
