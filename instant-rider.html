<style>

  --green:#0fbf78; --green-h:#14cf86; --green-2:#087c55; --green-3:#06603f;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:0;z-index:50}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:28px;height:28px;border-radius:8px;flex:none}
.brand b{font:800 15px/1.15 var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--navy-green);margin-top:3px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.linkbtn{background:none;border:0;color:var(--navy-muted);font-size:14px;min-height:44px;padding:0 6px;white-space:nowrap}
/* Online switch: the one control a rider uses most */
.sw{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 10px;border-radius:999px;border:1px solid var(--navy-line);background:none;color:var(--navy-ink);font-weight:700;font-size:14px}

.note.warn{background:var(--amber);color:var(--amber-ink)}
.note.bad{background:var(--red-bg);color:var(--red-ink)}

.empty b{display:block;color:var(--ink);font:800 18px/1.3 var(--display);margin-bottom:4px}

.mk.b{background:var(--navy);color:#fff;border-radius:8px 8px 8px 2px}

.step p{margin:0;font-size:14.5px;color:var(--navy-muted)}
.cash{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(123,232,180,.12);border:1px solid var(--navy-line);font-size:14.5px;color:var(--navy-ink)}

.step.warn{background:#4a3200}
.step.warn .k{color:#ffd98a}

.btn[disabled]{opacity:.6;cursor:default}
.wide{width:100%}
.big{min-height:58px;font-size:18px}
.fld{margin-top:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.inp{width:100%;min-height:48px;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;font-size:16px;outline:none}

.pinin{font:800 28px/1 var(--mono);letter-spacing:.4em;text-align:center;padding-left:.4em}
.msg{font-size:14px;margin-top:10px;color:var(--red-ink)}
.lbl2{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}

.state.on .beacon{background:var(--green);color:#04170e}
.state.on .beacon::before,.state.on .beacon::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--green);animation:ring 2.4s ease-out infinite}
.state.on .beacon::after{animation-delay:1.2s}

.chk{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--green-3)}
.chk i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.chk.late{color:var(--amber-ink)}
.chk.late i{background:#d99a00}
.sect{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:20px 2px 8px;display:flex;justify-content:space-between;gap:10px}
.card.job{border-left:4px solid var(--green)}
.card.job.fresh{box-shadow:0 0 0 3px rgba(15,191,120,.16)}
.newtag{font:700 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--lime);color:#243300;border-radius:6px;padding:4px 6px;margin-left:6px}
/* two steps, drawn */
.prog{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.prog i{height:5px;border-radius:99px;background:var(--navy-line)}
.prog i.on{background:var(--navy-green)}
.prog i.now{background:var(--lime)}

.acts.three{grid-template-columns:1fr 1fr}

.acts .btn{white-space:nowrap}
.acts.three .btn:not(:first-child){font-size:15px;padding:11px 6px;gap:6px}
.btn svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn .wa{stroke:none;fill:currentColor}
/* today's finished jobs */
.done{list-style:none;margin:0;padding:0}
.done li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.done li:first-child{border-top:0;padding-top:0}

.ent{list-style:none;margin:0;padding:0}

.ent b{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.ent small{font-size:13px;color:var(--muted)}
.ent .amt{font:800 15px/1.3 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.ent .plus{color:var(--green-3)}
.req{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}

@media (prefers-reduced-motion:reduce){ .state.on .beacon::before,.state.on .beacon::after{animation:none;opacity:0} }

        (j.rider_note?'<div class="chips"><span class="chip">Note: '+esc(j.rider_note)+'</span></div>':'')+
        '<div class="acts three"><a class="btn btn-dark" href="'+esc(mapsUrl(j.p))+'" target="_blank" rel="noopener">'+IC.nav+'Open the pickup in Maps</a>'+
        '<a class="btn btn-plain" href="tel:'+esc(j.sender_phone)+'">'+IC.tel+'Call sender</a><a class="btn btn-plain" href="'+esc(waUrl(j.sender_phone))+'" target="_blank" rel="noopener">'+IC.wa+'WhatsApp</a></div></div>';
      h+='<div class="card">'+(due>0?tickHtml(due,"sender"):'')+
         '<button class="btn btn-primary wide big" type="button" id="pickBtn"'+(due>0&&!S.cashOk?" disabled":"")+'>I have the parcel <span class="ur" style="color:inherit;opacity:.75">Parcel le liya</span></button>'+
         '<button class="btn btn-quiet wide" type="button" data-sheet="release">I cannot do this job</button>'+sheetHtml(j)+'</div>';
    } else if(st==="Picked up"){
      h='<div class="step"><div class="k">'+esc(j.code)+' &middot; step 2 of 2'+(Number(j.attempts)>1?' &middot; try '+esc(j.attempts):'')+'</div><h2>Deliver the parcel</h2>'+
        '<p>Hand over: '+esc(j.item)+' <span class="ur" style="color:inherit;opacity:.8">Parcel pohnchayein</span></p>'+
        '<div class="cash">'+(due>0?(Number(j.cod)>0?'Cash on delivery: collect <b>'+esc(rs(due))+'</b> from the receiver. No cash, no parcel.':'Collect <b>'+esc(rs(due))+'</b> in cash from the receiver. No cash, no parcel.'):'No cash here. The sender already paid.')+'</div><div class="prog" aria-hidden="true"><i class="on"></i><i class="now"></i></div></div>';
      h+='<div class="card">'+jobLegs(j,true,"a")+
        (j.rider_note?'<div class="chips"><span class="chip">Note: '+esc(j.rider_note)+'</span></div>':'')+
        '<div class="acts three"><a class="btn btn-dark" href="'+esc(mapsUrl(j.d))+'" target="_blank" rel="noopener">'+IC.nav+'Open the delivery in Maps</a>'+
        '<a class="btn btn-plain" href="tel:'+esc(j.receiver_phone)+'">'+IC.tel+'Call receiver</a><a class="btn btn-plain" href="'+esc(waUrl(j.receiver_phone))+'" target="_blank" rel="noopener">'+IC.wa+'WhatsApp</a></div>'+
        '<div class="acts" style="grid-template-columns:1fr"><a class="btn btn-quiet" href="tel:'+esc(j.sender_phone)+'">Call the sender ('+esc(j.sender_name)+')</a></div></div>';
      h+='<div class="card">'+pinHtml('Delivery PIN from the receiver <span class="ur">Receiver se 4 number ka PIN lein</span>',locked)+
         '<div class="fld">'+(due>0?tickHtml(due,"receiver"):'')+
         '<button class="btn btn-primary wide big" type="button" id="dropBtn"'+(locked?" disabled":"")+'>Delivered <span class="ur" style="color:inherit;opacity:.75">Parcel de diya</span></button></div>'+
         '<div class="msg" id="pinMsg" role="alert">'+(locked?"The PIN is locked after five wrong tries. Call the NovaX office to close this job.":"")+'</div>'+
         '<button class="btn btn-danger wide" type="button" data-sheet="failed" style="margin-top:8px">Could not deliver <span class="ur" style="color:inherit;opacity:.75">Delivery nahi hui</span></button>'+
         (due>0?'<button class="btn btn-quiet wide" type="button" data-sheet="short">Handed over, but paid less than '+esc(rs(due))+'</button>':'')+
         '<button class="btn btn-quiet wide" type="button" data-sheet="problem">Tell the office something</button>'+sheetHtml(j)+'</div>';
    } else if(st==="Failed delivery"){
      h='<div class="step warn"><div class="k">'+esc(j.code)+' &middot; not delivered</div><h2>Keep the parcel with you</h2>'+
        '<p>'+esc(FAILED[j.fail_reason]||"Delivery not made")+(j.fail_note?': '+esc(j.fail_note):'')+'. The NovaX office will call you. <span class="ur" style="color:inherit;opacity:.8">Parcel apne paas rakhein, office call karega.</span></p></div>';
      h+='<div class="card">'+jobLegs(j,true)+
        '<div class="acts"><a class="btn btn-plain" href="tel:'+esc(j.receiver_phone)+'">'+IC.tel+'Call receiver</a><a class="btn btn-plain" href="tel:'+esc(j.sender_phone)+'">'+IC.tel+'Call sender</a></div>'+
        '<div class="acts" style="grid-template-columns:1fr">'+office+'</div></div>';
      h+='<div class="card"><button class="btn btn-primary wide big" type="button" id="retryBtn">Try the delivery again <span class="ur" style="color:inherit;opacity:.75">Dobara koshish</span></button>'+
         '<button class="btn btn-dark wide" type="button" id="returnBtn" style="margin-top:10px">Take it back to the sender <span class="ur" style="color:inherit;opacity:.75">Wapas le jayein</span></button>'+
         '<button class="btn btn-quiet wide" type="button" data-sheet="problem">Tell the office something</button>'+sheetHtml(j)+'</div>';
    } else {
      h='<div class="step warn"><div class="k">'+esc(j.code)+' &middot; return</div><h2>Take the parcel back to the sender</h2>'+
        '<p>Hand back: '+esc(j.item)+' <span class="ur" style="color:inherit;opacity:.8">Parcel sender ko wapas dein</span></p>'+
        '<div class="cash">'+(due>0?'Collect <b>'+esc(rs(due))+'</b> in cash from the sender when you hand it back.':'No cash to collect.')+'</div></div>';
      h+='<div class="card">'+jobLegs(j,true,"b")+
        '<div class="acts three"><a class="btn btn-dark" href="'+esc(mapsUrl(j.p))+'" target="_blank" rel="noopener">'+IC.nav+'Open the sender in Maps</a>'+
        '<a class="btn btn-plain" href="tel:'+esc(j.sender_phone)+'">'+IC.tel+'Call sender</a><a class="btn btn-plain" href="'+esc(waUrl(j.sender_phone))+'" target="_blank" rel="noopener">'+IC.wa+'WhatsApp</a></div>'+
        '<div class="acts" style="grid-template-columns:1fr">'+office+'</div></div>';
      h+='<div class="card">'+pinHtml('PIN from the sender\'s booking page <span class="ur">Sender se 4 number ka PIN lein</span>',locked)+
         '<div class="fld">'+(due>0?tickHtml(due,"sender"):'')+
         '<button class="btn btn-primary wide big" type="button" id="backBtn"'+(locked?" disabled":"")+'>Returned to the sender <span class="ur" style="color:inherit;opacity:.75">Wapas de diya</span></button></div>'+
         '<div class="msg" id="pinMsg" role="alert">'+(locked?"The PIN is locked after five wrong tries. Call the NovaX office to close this job.":"")+'</div>'+
         (due>0?'<button class="btn btn-quiet wide" type="button" data-sheet="short">Handed back, but paid less than '+esc(rs(due))+'</button>':'')+
         '<button class="btn btn-quiet wide" type="button" data-sheet="problem">Tell the office something</button>'+sheetHtml(j)+'</div>';
    }
    if(j.problem_note) h+='<div class="note warn" style="margin-top:12px">You told the office: '+esc(j.problem_note)+'</div>';
    return h;
  }
  var RELEASE=["Bike problem","Too far from me","Sender not answering","Sender did not pay","Sender cancelled","Other"];
  var PROBLEM=["Receiver has no PIN","Sender has no PIN","Bike problem, I need another rider","Accident or emergency","Other"];
  function sheetHtml(j){
    var k=S.sheet; if(!k) return "";
    var back='<button class="btn btn-plain" type="button" data-sheet="">Back</button>';
    if(k==="short"){
      var due=Number(j.due_now||0);
      return '<div class="sheet"><h3>Paid less than '+esc(rs(due))+'</h3><p class="sub" style="margin:0">Only if the parcel is already handed over. If they will not pay, keep the parcel and press Could not deliver. Type the PIN above first.</p>'+
        '<div class="fld"><label for="shAmt">Cash you actually received (Rs)</label><input class="inp" id="shAmt" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="0"></div>'+
        '<div class="fld"><label for="shNote">What happened?</label><input class="inp" id="shNote" maxlength="200" placeholder="e.g. receiver only had Rs 200"></div>'+
        '<div class="acts">'+back+'<button class="btn btn-dark" type="button" id="shGo">Send to office</button></div></div>';
    }
    var rel=k==="release", fail=k==="failed";
    var opts = fail ? Object.keys(FAILED).map(function(c){ return '<option value="'+esc(c)+'">'+esc(FAILED[c])+'</option>'; }).join("")
                    : (rel?RELEASE:PROBLEM).map(function(x){ return '<option>'+esc(x)+'</option>'; }).join("");
    return '<div class="sheet"><h3>'+(rel?"Give this job back":fail?"Could not deliver":"Tell the office")+'</h3><p class="sub" style="margin:0">'+
      (rel?"It goes back to the list for another rider.":fail?"You keep the parcel. The office calls the receiver and the sender, then you try again or take it back.":"The job stays with you. The office will call you.")+'</p>'+
      '<div class="fld"><label for="shWhy">What happened?</label><select class="inp" id="shWhy">'+opts+'</select></div>'+
      '<div class="fld"><label for="shNote">More detail (optional)</label><input class="inp" id="shNote" maxlength="200"></div>'+
      '<div class="acts">'+back+'<button class="btn '+(rel||fail?"btn-danger":"btn-dark")+'" type="button" id="shGo">'+(rel?"Give it back":fail?"Mark not delivered":"Send to office")+'</button></div></div>';
  }

  var SAY={ offline:"Go online first.", busy:"Finish the job you have first.", taken:"Another rider took that job.",
    not_yours:"This job is no longer with you.", need_reason:"Choose a reason.", need_note:"Say what happened.",
    wrong_pin:"That PIN is not right.", pin_locked:"The PIN is locked after five wrong tries. Call the NovaX office.",
    has_job:"Finish the job you have before going offline.", docs:"Add your CNIC photo, home bill photo and emergency contact first.", docs_unchecked:"NovaX is still checking your documents. You can go online once they are checked.",
    cash_limit:"You are holding too much cash. Pay what you owe (open your wallet) before taking more cash-on-delivery jobs.", cash_needed:"Take the cash first, then tick the cash line.",
    cash_mismatch:"That amount is not right. It cannot be more than the fare.", short_note:"Say why the cash is short." };
  function netFail(e){ return /fetch|network|Failed|timeout|Load failed/i.test(String((e&&e.message)||e)); }
  /* Every rider step answers "already done" when it is sent twice, so a press
     lost on a weak connection is simply sent again, up to three times. */
  function act(name,args,okText,tries){
    tries=tries||0;
    if(S.busy&&!tries) return Promise.resolve(false);
    S.busy=true;
    return rpc(name,args).then(function(r){
      S.busy=false;
      if(r&&r.ok===false){ toast(SAY[r.reason]||"That did not work. Try again."); return refresh(false).then(function(){ return r; }); }
      if(okText) toast(okText);
      S.sheet=null; S.cashOk=false;
      return refresh(true).then(function(){ return r||{ ok:true }; });
    }).catch(function(e){
      if(netFail(e)&&tries<3){
        toast("Weak connection. Sending again…");
        return new Promise(function(res){ setTimeout(res,1500*(tries+1)); }).then(function(){ return act(name,args,okText,tries+1); });
      }
      S.busy=false; S.sheet=null; paint();
      toast(netFail(e)?"No connection. Nothing is lost: press again when you have signal.":friendly(e.message));
      return false;
    });
  }
  /* Two presses: a pocket tap must not move a parcel. */
  function sure(t){
    if(t.dataset.sure==="1") return true;
    t.dataset.sure="1"; t.textContent="Press again to confirm";
    setTimeout(function(){ if(t.isConnected&&!S.busy){ t.dataset.sure="0"; paint(); } },4000);
    return false;
  }

  document.addEventListener("change",function(e){
    if(e.target.id!=="cashOk") return;
    S.cashOk=e.target.checked;
    var pb=$("pickBtn"); if(pb) pb.disabled=!S.cashOk;
    if($("pinMsg")&&S.cashOk) say($("pinMsg"),"");
  });
  document.addEventListener("click",function(e){
    unlockSound();
    var t=e.target.closest("[data-auth],[data-act],[data-accept],[data-sheet],[data-show],[data-wsheet],#wGo,#forgot,#pickBtn,#dropBtn,#backBtn,#retryBtn,#returnBtn,#shGo,#onSw,#goOn,#signOut,#signOut2,#pushOn,#pushTest,#install");
    if(!t) return;
    if(t.dataset.auth) return renderAuth(t.dataset.auth);
    if(t.dataset.act==="reload") return boot();
    if(t.dataset.act==="wallet"){ S.wsheet=null; return renderWallet(); }
    if(t.dataset.act==="home"){ S.view=null; S.wsheet=null; try{ scrollTo(0,0); }catch(e){} return paint(); }
    if(t.hasAttribute("data-wsheet")){ S.wsheet=t.getAttribute("data-wsheet")||null; if(S.wsheet==="deposit") S.depKey=null; paintWallet(); var f1=$("wAmt"); if(f1) try{ f1.focus(); }catch(e){} return; }
    if(t.id==="wGo") return walletGo(t);
    if(t.id==="forgot") return doForgot();
    if(t.hasAttribute("data-show")){ var pi=$(t.getAttribute("data-show")); if(pi){ var sh=pi.type==="password"; pi.type=sh?"text":"password"; t.textContent=sh?"Hide":"Show"; t.setAttribute("aria-pressed",String(sh)); } return; }
    if(t.id==="signOut2"){
      if(S.feed&&S.feed.active){ toast("Finish the job you have before signing out."); return; }
      if(t.dataset.sure!=="1"){ t.dataset.sure="1"; t.textContent="Press again to sign out"; setTimeout(function(){ if(t.isConnected){ t.dataset.sure="0"; t.textContent="Sign out"; } },4000); return; }
    }
    if(t.id==="pushOn") return pushOn(t);
    if(t.id==="pushTest") return pushTest(t);
    if(t.id==="install"){ var ev=installEvt; if(ev){ ev.prompt(); Promise.resolve(ev.userChoice).catch(function(){}).then(function(){ installEvt=null; paint(); }); } return; }
    if(t.id==="signOut"||t.id==="signOut2"){ stop(); return pushOff().then(function(){ return sb.auth.signOut(); }).catch(function(){}).then(function(){ S.me=null; S.feed=null; renderAuth("signin"); }); }
    if(t.id==="goOn"){ t.disabled=true; try{ navigator.vibrate&&navigator.vibrate(40); }catch(e2){} return act("nvi_rider_online",{ p_on:true },"You are online."); }
    if(t.id==="onSw"){
      var on=t.getAttribute("aria-checked")!=="true";
      try{ navigator.vibrate&&navigator.vibrate(40); }catch(e3){}
      if(!on&&S.feed&&S.feed.active){ toast(SAY.has_job); return; }
      return act("nvi_rider_online",{ p_on:on },on?"You are online.":"You are offline.");
    }
    if(t.dataset.accept){ t.disabled=true; return act("nvi_rider_accept",{ p_job:t.dataset.accept },"Job accepted. Go to the pickup."); }
    if(t.hasAttribute("data-sheet")){ S.sheet=t.dataset.sheet||null; return paint(); }
    var j=S.feed&&S.feed.active; if(!j) return;
    var due=Number(j.due_now||0);
    if(t.id==="pickBtn"){
      if(due>0&&!S.cashOk){ toast(SAY.cash_needed); return; }
      if(!sure(t)) return;
      t.disabled=true; return act("nvi_rider_picked",{ p_job:j.id, p_cash:due>0?due:null },"Picked up. Now deliver it.");
    }
    if(t.id==="dropBtn"||t.id==="backBtn"){
      var back=t.id==="backBtn", pin=($("pin").value||"").replace(/\D/g,"");
      if(pin.length!==4){ say($("pinMsg"),"Type the 4-digit PIN the "+(back?"sender":"receiver")+" shows you."); $("pin").focus(); return; }
      if(due>0&&!S.cashOk){ say($("pinMsg"),"Take "+rs(due)+" in cash, then tick the cash line above."); return; }
      t.disabled=true;
      return act(back?"nvi_rider_returned":"nvi_rider_delivered",{ p_job:j.id, p_pin:pin, p_cash:due>0?due:null },back?"Returned. Thank you.":"Delivered. Well done.").then(function(r){
        if(r&&r.ok===false&&r.reason==="wrong_pin"&&$("pinMsg")) say($("pinMsg"),"That PIN is not right. "+r.left+" "+(r.left===1?"try":"tries")+" left. Ask the "+(back?"sender":"receiver")+" to open their tracking link.");
      });
    }
    if(t.id==="retryBtn"){ t.disabled=true; return act("nvi_rider_retry",{ p_job:j.id },"Go to the delivery address again."); }
    if(t.id==="returnBtn"){ if(!sure(t)) return; t.disabled=true; return act("nvi_rider_return",{ p_job:j.id },"Take the parcel back to the sender."); }
    if(t.id==="shGo"){
      var note=($("shNote").value||"").trim();
      if(S.sheet==="short"){
        var pin2=(($("pin")&&$("pin").value)||"").replace(/\D/g,""), amt=($("shAmt").value||"").replace(/\D/g,"");
        if(pin2.length!==4){ toast("Type the 4-digit PIN above first."); return; }
        if(amt===""||Number(amt)>=due){ toast("Enter the cash you received. It must be less than "+rs(due)+"."); $("shAmt").focus(); return; }
        if(note.length<3){ toast(SAY.short_note); $("shNote").focus(); return; }
        t.disabled=true;
        return act(j.status==="Returning"?"nvi_rider_returned":"nvi_rider_delivered",{ p_job:j.id, p_pin:pin2, p_cash:Number(amt), p_note:note },"Sent. The office will settle the cash.");
      }
      var why=$("shWhy").value;
      t.disabled=true;
      if(S.sheet==="failed") return act("nvi_rider_failed",{ p_job:j.id, p_reason:why, p_note:note||null },"Marked not delivered. Keep the parcel safe.");
      var text=why+(note?": "+note:"");
      if(S.sheet==="release") return act("nvi_rider_release",{ p_job:j.id, p_reason:text },"Job given back.");
      return act("nvi_rider_problem",{ p_job:j.id, p_note:text },"Sent to the office.");
    }
  });
  document.addEventListener("submit",function(e){
    if(e.target.id==="fIn") return doSignIn(e);
    if(e.target.id==="fJoin") return doJoin(e);
    if(e.target.id==="fDocs") return doDocs(e);
  });

  boot();
})();
</script>
</body>
</html>
