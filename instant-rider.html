<html lang="en">

<style>
:root{
  --ink:#10221a; --ink-2:#33463c; --muted:#5d6e65;
  --green:#0fbf78; --green-h:#14cf86; --green-2:#087c55; --green-3:#06603f;
  --mint:#eafbf3; --mint-line:#c6ebd8; --lime:#d9ff74;
  --paper:#fbfcf8; --paper-2:#f3f5ee; --card:#ffffff;
  --line:#dce7df; --line-2:#c4d6ca;
  --navy:#0d2920; --navy-line:#2a5242; --navy-ink:#e8f5ee; --navy-muted:#a9c5b8; --navy-green:#7be8b4;
  --amber:#fff4da; --amber-ink:#7a5500; --red-bg:#fdecea; --red-ink:#9b1c13;
  --sa-b:env(safe-area-inset-bottom,0px);
  --display:Manrope,"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:0;z-index:50}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:28px;height:28px;border-radius:8px;flex:none}
.brand b{font:800 15px/1.15 var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--navy-green);margin-top:3px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.linkbtn{background:none;border:0;color:var(--navy-muted);font-size:14px;min-height:44px;padding:0 6px;white-space:nowrap}
/* Online switch: the one control a rider uses most */
.sw{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 10px;border-radius:999px;border:1px solid var(--navy-line);background:none;color:var(--navy-ink);font-weight:700;font-size:14px}
.sw i{width:38px;height:24px;border-radius:999px;background:var(--navy-line);position:relative;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{border-color:var(--navy-green)}
.sw[aria-checked="true"] i{background:var(--green)}
.sw[aria-checked="true"] i::after{transform:translateX(14px)}
@media (prefers-reduced-motion:reduce){ .sw i::after{transition:none} }

main{padding:14px 0 calc(28px + var(--sa-b))}
h1.page{font:800 24px/1.15 var(--display);letter-spacing:-.02em;margin:10px 0 6px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.ur{color:var(--muted);font-weight:400;font-size:max(12px,.86em)}   /* Roman Urdu helper line */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card + .card{margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.stat b{font:800 19px/1.2 var(--display);font-variant-numeric:tabular-nums}
.note{padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.45;margin-bottom:12px}
.note.warn{background:var(--amber);color:var(--amber-ink)}
.note.bad{background:var(--red-bg);color:var(--red-ink)}
.empty{text-align:center;color:var(--muted);padding:34px 14px;font-size:15px}
.empty b{display:block;color:var(--ink);font:800 18px/1.3 var(--display);margin-bottom:4px}

/* A job */
.job-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.code{font:700 13px/1 var(--mono);letter-spacing:.1em;color:var(--muted)}
.fare{font:800 24px/1 var(--display);font-variant-numeric:tabular-nums}
.fare small{font:700 13px/1 var(--display);color:var(--green-2);margin-right:3px}
.leg{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding-bottom:12px}
.leg + .leg{padding-bottom:0}
.leg::before{content:"";position:absolute;left:12px;top:28px;bottom:0;border-left:2px dashed var(--line-2)}
.leg + .leg::before{display:none}
.mk{width:26px;height:26px;display:grid;place-items:center;font:800 12px/1 var(--display);margin-top:1px}
.mk.a{background:var(--green);color:#04170e;border-radius:50%}
.mk.b{background:var(--navy);color:#fff;border-radius:8px 8px 8px 2px}
.leg p{margin:0;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.leg p small{display:block;color:var(--muted);font-size:13px}
.leg.dim p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.chip{font-size:13px;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;color:var(--ink-2);background:#fff}
.chip.pay{background:var(--mint);border-color:var(--mint-line);color:var(--green-3);font-weight:700}
.step{background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:16px;margin-bottom:12px}
.step .k{font:700 12px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--navy-green)}
.step h2{font:800 22px/1.15 var(--display);letter-spacing:-.02em;margin:8px 0 4px;color:#fff}
.step p{margin:0;font-size:14.5px;color:var(--navy-muted)}
.cash{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(123,232,180,.12);border:1px solid var(--navy-line);font-size:14.5px;color:var(--navy-ink)}
.cash b{color:var(--lime)}
.step.warn{background:#4a3200}
.step.warn .k{color:#ffd98a}
.step.warn p{color:#f1e2bd}
/* The line a rider ticks to say the cash is in their hand */
.tick{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:12px;border:1.5px solid var(--green-2);background:var(--mint);border-radius:12px;font-size:15.5px;line-height:1.35;cursor:pointer;margin-bottom:12px}
.tick input{width:26px;height:26px;margin:0;accent-color:var(--green-2)}
.tick b{font-weight:800}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:11px 14px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:16px;text-decoration:none;text-align:center;line-height:1.2}
.btn-primary{background:var(--green);border-color:var(--green);color:#04170e}
.btn-plain{background:#fff;border-color:var(--line-2);color:var(--ink)}
.btn-dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-quiet{background:none;border-color:transparent;color:var(--muted);font-weight:500;font-size:14.5px;min-height:44px}
.btn-danger{background:#fff;border-color:#e5b9b3;color:var(--red-ink)}
.btn[disabled]{opacity:.6;cursor:default}
.wide{width:100%}
.big{min-height:58px;font-size:18px}
.fld{margin-top:12px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.inp{width:100%;min-height:48px;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--green-2);box-shadow:0 0 0 3px rgba(15,191,120,.18)}
.pinin{font:800 28px/1 var(--mono);letter-spacing:.4em;text-align:center;padding-left:.4em}
.msg{font-size:14px;margin-top:10px;color:var(--red-ink)}
.lbl2{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.docpick{position:relative}
.docstate{font-size:13.5px;color:var(--muted);margin-top:6px;min-height:0;display:flex;align-items:center;gap:10px}
.docstate img{width:64px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.docstate.ok{color:var(--green-3)}
.docstate.bad{color:var(--red-ink)}
.msg.ok{color:var(--green-3)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border:1px solid var(--line-2);border-radius:12px;margin-bottom:12px}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--navy);color:#fff}
.sheet{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--paper-2)}
.sheet h3{font:800 16px/1.2 var(--display);margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sa-b));transform:translateX(-50%);z-index:300;background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100vw - 28px);text-align:center}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><img src="/assets/favicon.svg" alt="" width="28" height="28"><div><b id="whoName">Nova Instant</b><small>Rider</small></div></div>
    <div class="top-r">
      <button class="sw" id="onSw" type="button" role="switch" aria-checked="false" hidden><span id="onLbl">Offline</span><i aria-hidden="true"></i></button>

<main><div class="wrap" id="main"><div class="empty">Loading&hellip;</div></div></main>

<script src="/assets/vendor/supabase-2.117.2.js"></script>
<script>
(function(){
  "use strict";
  var SB_URL="https://rhzunbzbdzicajqtohwp.supabase.co";
  var SB_KEY="sb_publishable_yH8i0Q43BAxXoExo95r0rQ_fCeRdHXA";
  var $=function(id){ return document.getElementById(id); };
  var sb=null;
  try{ sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){}
  var S={ me:null, feed:null, busy:false, sheet:null, timer:null, openCount:0, key:"", cashOk:false };

  /* supabase-js resolves with {error}; this turns it into a rejection. */
  function rpc(name,args){
    return Promise.resolve(sb.rpc(name,args||{})).then(function(r){
      if(r&&r.error) throw new Error(r.error.message||"Request failed");
      return r?r.data:null;
    });
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"'`]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c]; }); }
  function rs(n){ return "Rs "+Number(n||0).toLocaleString("en-PK"); }
  function toast(t){ var el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.appendChild(el); setTimeout(function(){ el.remove(); },2800); }
  function ago(iso){
    var m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
    return m<1?"just now":m<60?m+" min ago":Math.floor(m/60)+" h "+(m%60)+" min ago";
  }
  function friendly(m){
    m=String(m||"");
    if(/Invalid login credentials/i.test(m)) return "Wrong email or password.";
    if(/Email not confirmed/i.test(m)) return "Confirm your email first: open the link NovaX emailed you.";
    if(/already belongs to a NovaX account/i.test(m)) return m;
    if(/fetch|network|Failed/i.test(m)) return "No connection. Check your internet and try again.";
    return m||"Something went wrong. Try again.";
  }
  function mapsUrl(pt){ return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+pt[0]+","+pt[1]; }
  function hourLabel(h){ return (h%12||12)+(h<12?" am":" pm"); }

  /* ───── boot ───── */
  function boot(){
    if(!sb){ $("main").innerHTML='<div class="empty"><b>NovaX could not load</b>Check your internet and refresh.</div>'; return; }
    sb.auth.getSession().then(function(r){
      if(!(r&&r.data&&r.data.session)) return renderAuth("signin");
      return loadMe();
    }).catch(function(){ renderAuth("signin"); });
  }
  function loadMe(){
    return rpc("nvi_rider_me").then(function(me){
      S.me=me||{};
      $("signOut").hidden=false;
      var r=S.me.rider;
      if(r&&r.status==="Active"){
        $("whoName").textContent=r.full_name;
        /* First time: CNIC photo, home bill photo and an emergency contact, before any job. */
        if(!r.docs) return renderDocs();
        return start();
      }
      renderNotRider();
    }).catch(function(e){
      $("main").innerHTML='<div class="empty"><b>Could not open</b>'+esc(friendly(e.message))+'<div style="margin-top:14px"><button class="btn btn-plain" type="button" data-act="reload">Try again</button></div></div>';
    });
  }
  /* ───── first time: documents and emergency contact ───── */
  var D={ cnic:null, bill:null };
  function renderDocs(){
    stop(); $("onSw").hidden=true; D={ cnic:null, bill:null };
    $("main").innerHTML=
      '<h1 class="page">One step before your first job</h1>'+
      '<p class="sub">NovaX needs these once. Only the NovaX office can see them. <span class="ur">Yeh sirf aik dafa. Sirf NovaX office dekh sakta hai.</span></p>'+
      '<form id="fDocs" class="card" novalidate>'+
        docPick("cnic","Photo of your CNIC (front side)","Shanakhti card ki tasveer")+
        docPick("bill","Photo of a home electricity or gas bill","Ghar ke bijli ya gas bill ki tasveer")+
        '<div class="fld"><label for="emName">Emergency contact: name <span class="ur">Emergency mein kis ko call karein</span></label><input class="inp" id="emName" maxlength="80" autocomplete="off" placeholder="e.g. your father, brother or wife"></div>'+
        '<div class="fld"><label for="emPhone">Emergency contact: mobile</label><input class="inp" id="emPhone" type="tel" inputmode="tel" maxlength="20" autocomplete="off" placeholder="03XX XXXXXXX"></div>'+
        '<div class="fld"><button class="btn btn-primary wide" id="dBtn" type="submit">Save and continue</button></div>'+
        '<div class="msg" id="dMsg" role="alert"></div></form>';
  }
  function docPick(k,label,ur){
    return '<div class="fld docpick" data-k="'+k+'"><span class="lbl2">'+label+' <span class="ur">'+ur+'</span></span>'+
      '<label class="btn btn-plain wide" for="f_'+k+'">Take or choose a photo</label>'+
      '<input type="file" id="f_'+k+'" data-doc="'+k+'" accept="image/jpeg,image/png,image/*" style="position:absolute;width:1px;height:1px;opacity:0">'+
      '<div class="docstate" id="st_'+k+'"></div></div>';
  }
  /* A phone photo is redrawn smaller (about 200 KB): quicker to send on mobile
     data, and it drops the location a phone hides inside a photo. */
  function shrinkPhoto(file){
    return new Promise(function(resolve,reject){
      if(!file) return reject(new Error("Choose a photo."));
      if(file.size>25*1024*1024) return reject(new Error("That photo is too large. Take a new one with the camera."));
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){
        var w=img.naturalWidth, h=img.naturalHeight, long=Math.max(w,h);
        if(long<500){ URL.revokeObjectURL(url); return reject(new Error("That photo is too small to read. Take a closer one.")); }
        var k=Math.min(1,1600/long), c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
        var g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){
          if(!b) return reject(new Error("That photo could not be read. Try another."));
          if(b.size>2.8*1024*1024) return c.toBlob(function(b2){ b2&&b2.size<=2.9*1024*1024?resolve({ blob:b2, thumb:c.toDataURL("image/jpeg",0.4) }):reject(new Error("That photo is too large. Take it from a little further away.")); },"image/jpeg",0.6);
          resolve({ blob:b, thumb:c.toDataURL("image/jpeg",0.4) });
        },"image/jpeg",0.82);
      };
      img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("This photo format cannot be opened here. Use the camera, or choose a JPG.")); };
      img.src=url;
    });
  }
  function hex8(){ var a=new Uint8Array(4); crypto.getRandomValues(a); return Array.prototype.map.call(a,function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); }
  function pkPhone(raw){
    var d=String(raw==null?"":raw).replace(/[^\d]/g,"");
    if(d.length===14&&d.slice(0,4)==="0092") d=d.slice(4); else if(d.length===13&&d.slice(0,3)==="092") d=d.slice(3);
    else if(d.length===12&&d.slice(0,2)==="92") d=d.slice(2); else if(d.length===11&&d.charAt(0)==="0") d=d.slice(1);
    return /^3\d{9}$/.test(d)?("0"+d):"";
  }
  document.addEventListener("change",function(e){
    var k=e.target.getAttribute&&e.target.getAttribute("data-doc"); if(!k) return;
    var st=$("st_"+k), f=e.target.files&&e.target.files[0]; if(!f) return;
    st.className="docstate"; st.textContent="Preparing the photo\u2026";
    shrinkPhoto(f).then(function(ph){
      D[k]=ph; st.className="docstate ok";
      st.innerHTML='<img alt="" src="'+ph.thumb+'"><span>Photo ready. Tap the button to change it.</span>';
      $("dMsg").textContent="";
    }).catch(function(err){ D[k]=null; st.className="docstate bad"; st.textContent=err.message; });
  });
  var DOC_SAY={ em_name:"Enter the emergency contact's name.", em_phone:"Enter the emergency contact's mobile like 0300 1234567.",
    em_same:"The emergency contact must be a different number from your own.", cnic:"The CNIC photo did not arrive. Choose it again.", bill:"The bill photo did not arrive. Choose it again." };
  function doDocs(e){
    e.preventDefault();
    var msg=$("dMsg"), btn=$("dBtn"), name=$("emName").value.trim(), ph=pkPhone($("emPhone").value);
    if(!D.cnic) return say(msg,"Add a photo of your CNIC.");
    if(!D.bill) return say(msg,"Add a photo of a home electricity or gas bill.");
    if(name.length<2) return say(msg,DOC_SAY.em_name);
    if(!ph) return say(msg,DOC_SAY.em_phone);
    busyBtn(btn,true,"Sending the photos\u2026");
    Promise.resolve(sb.auth.getUser()).then(function(u){
      var uid=u&&u.data&&u.data.user&&u.data.user.id; if(!uid) throw new Error("Sign in again.");
      var ms=Date.now(), pc=uid+"/cnic-"+ms+"-"+hex8()+".jpg", pb=uid+"/bill-"+ms+"-"+hex8()+".jpg";
      var up=function(path,blob){ return Promise.resolve(sb.storage.from("nvi-rider-docs").upload(path,blob,{ contentType:"image/jpeg", upsert:false })).then(function(r){ if(r&&r.error) throw new Error(r.error.message||"Upload failed"); }); };
      return up(pc,D.cnic.blob).then(function(){ return up(pb,D.bill.blob); }).then(function(){
        return rpc("nvi_rider_docs",{ p_cnic:pc, p_bill:pb, p_em_name:name, p_em_phone:ph });
      });
    }).then(function(r){
      busyBtn(btn,false);
      if(r&&r.ok===false) return say(msg,DOC_SAY[r.reason]||"That did not save. Try again.");
      toast("Saved. You can go online now."); return loadMe();
    }).catch(function(err){ busyBtn(btn,false); say(msg,friendly(err&&err.message)); });
  }
  function renderNotRider(){
    stop(); $("onSw").hidden=true;
    var r=S.me.rider, st=r&&r.status;
    $("main").innerHTML='<h1 class="page">'+(st==="Blocked"?"Your access is on hold":st==="Removed"?"Access closed":"Not a Nova Instant rider yet")+'</h1><p class="sub">'+
      (st==="Blocked"?"NovaX has paused this rider login. Call the NovaX office.":
       st==="Removed"?"This rider login has been closed. Call the NovaX office if that is a mistake.":
       "You are signed in as <b>"+esc(S.me.email||"")+"</b>, but NovaX has not added this email as a Nova Instant rider. Ask NovaX to add it, then sign in again.")+"</p>";
  }

  /* ───── sign in / join ───── */
  function renderAuth(view){
    stop(); $("onSw").hidden=true; $("signOut").hidden=true; $("whoName").textContent="Nova Instant";
    $("main").innerHTML=
      '<h1 class="page">Nova Instant rider</h1><p class="sub">For NovaX bike riders. <span class="ur">NovaX ke bike riders ke liye.</span></p>'+
      '<div class="seg" role="tablist"><button type="button" role="tab" data-auth="signin" aria-selected="'+(view==="signin")+'">Sign in</button>'+
      '<button type="button" role="tab" data-auth="join" aria-selected="'+(view==="join")+'">First time</button></div>'+
      (view==="signin"?
        '<form id="fIn" class="card" novalidate><div class="fld" style="margin-top:0"><label for="inEmail">Email</label><input class="inp" id="inEmail" type="email" autocomplete="email" inputmode="email" maxlength="254"></div>'+
        '<div class="fld"><label for="inPass">Password</label><input class="inp" id="inPass" type="password" autocomplete="current-password" maxlength="72"></div>'+

  function say(el,text,ok){ el.textContent=text; el.className="msg"+(ok?" ok":""); }

  function doSignIn(e){
    e.preventDefault();
    var email=$("inEmail").value.trim().toLowerCase(), pass=$("inPass").value, btn=$("inBtn"), msg=$("inMsg");
    if(!/^\S+@\S+\.\S+$/.test(email)||!pass) return say(msg,"Enter your email and password.");
    busyBtn(btn,true,"Signing in…");
    sb.auth.signInWithPassword({ email:email, password:pass }).then(function(r){
      busyBtn(btn,false);
      if(r.error) return say(msg,friendly(r.error.message));
      loadMe();
    }).catch(function(err){ busyBtn(btn,false); say(msg,friendly(err&&err.message)); });
  }
  function doForgot(){
    var email=($("inEmail").value||"").trim().toLowerCase(), msg=$("inMsg");
    if(!/^\S+@\S+\.\S+$/.test(email)){ $("inEmail").focus(); return say(msg,"Type your email above first, then press Forgot your password."); }
    Promise.resolve(sb.auth.resetPasswordForEmail(email,{ redirectTo:location.origin+"/new-password.html" })).catch(function(){}).then(function(){
      say(msg,"If "+email+" has a login, a reset link is on its way. Check your inbox and spam.",true);
    });

  function doJoin(e){
    e.preventDefault();
    var name=$("jName").value.trim(), email=$("jEmail").value.trim().toLowerCase(), p1=$("jPass").value, p2=$("jPass2").value, btn=$("jBtn"), msg=$("jMsg");
    if(name.length<2) return say(msg,"Enter your full name.");
    if(!/^\S+@\S+\.\S+$/.test(email)) return say(msg,"Enter the email NovaX has for you.");
    if(p1.length<8) return say(msg,"Your password needs at least 8 characters.");
    if(p1!==p2) return say(msg,"The two passwords do not match.");
    busyBtn(btn,true,"Creating your login…");
    sb.auth.signUp({ email:email, password:p1, options:{ data:{ role:"instant", full_name:name } } }).then(function(r){
      if(r.error) throw new Error(r.error.message);
      var u=r.data&&r.data.user;
      if(u&&Array.isArray(u.identities)&&u.identities.length===0) throw new Error("This email already has a login. Sign in instead.");
      busyBtn(btn,false);
      if(!r.data.session) return say(msg,"Check your email to confirm it, then come back and sign in.",true);
      return loadMe();

  /* ───── the rider's day ───── */
  function start(){
    $("onSw").hidden=false;
    refresh(true);
    stop();
    /* The feed is asked every 12 s while this screen is showing. That is also
       what tells NovaX the rider is really online: a switch left on in a
       closed app stops counting after a minute. */
    S.timer=setInterval(function(){ if(!document.hidden&&!S.busy) refresh(false); },12000);
    /* Live: a new booking, or ops changing a job, arrives at once instead of
       at the next 12-second check. The signal carries no data. */
    if(!S.ch){ try{
      var liveT=null;
      S.ch=sb.channel("nvi").on("broadcast",{ event:"changed" },function(){
        clearTimeout(liveT); liveT=setTimeout(function(){ if(S.timer&&!document.hidden&&!S.busy&&!typing()) refresh(false); },350);
      }).subscribe();
    }catch(e){} }
  }
  function stop(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } keepAwake(false); }
  /* Typing, or between the two presses of a confirm button. */
  function typing(){ var a=document.activeElement; return !!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))||!!document.querySelector('[data-sure="1"]'); }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&S.timer&&!S.busy) refresh(false); });

  /* While the rider is online or on a job the screen stays on, so the page
     keeps asking for jobs. Phones drop this when the page is hidden; it is
     asked for again each time the feed is painted. */
  var wake=null;
  function keepAwake(on){
    try{
      if(on&&!wake&&navigator.wakeLock&&!document.hidden){
        navigator.wakeLock.request("screen").then(function(w){ wake=w; w.addEventListener("release",function(){ if(wake===w) wake=null; }); }).catch(function(){});
      } else if(!on&&wake){ wake.release().catch(function(){}); wake=null; }
    }catch(e){}
  }
  /* A sound for a new job. Browsers only allow it after the rider has
     touched the page, so the first tap unlocks it. */
  var actx=null;
  function unlockSound(){ try{ if(!actx){ var C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){} }
  function beep(){
    try{
      if(!actx||actx.state!=="running") return;
      [0,.24,.48].forEach(function(d){ var o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; g.gain.value=.3; o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+.16); });
    }catch(e){}
  }

  function refresh(first){
    return rpc("nvi_rider_feed").then(function(f){
      var before=S.openCount;
      S.feed=f||{}; S.openCount=(S.feed.open||[]).length;
      var a=S.feed.active, key=a?a.id+"|"+a.status:"";
      if(key!==S.key){ S.key=key; S.cashOk=false; S.sheet=null; }
      /* A new job arrived while the rider was waiting. */
      if(!first&&S.openCount>before&&!a){ beep(); try{ navigator.vibrate&&navigator.vibrate([180,90,180,90,180]); }catch(e){} }
      /* Never repaint under the rider's thumb: not while a sheet is open, and
         not while they are typing the PIN. The switch is still kept right. */
      if(first||(!S.sheet&&!typing())) paint(); else paintSwitch();
    }).catch(function(e){
      if(/not an active Nova Instant rider/i.test(e.message||"")) return loadMe();
      if(first) $("main").innerHTML='<div class="empty"><b>Could not load your jobs</b>'+esc(friendly(e.message))+'<div style="margin-top:14px"><button class="btn btn-plain" type="button" data-act="reload">Try again</button></div></div>';
    });
  }

    var on=!!(S.feed&&S.feed.rider&&S.feed.rider.online);
    $("onSw").setAttribute("aria-checked",String(on)); $("onLbl").textContent=on?"Online":"Offline";
    keepAwake(on||!!(S.feed&&S.feed.active));

  var SAY={ offline:"Go online first.", busy:"Finish the job you have first.", taken:"Another rider took that job.",
    not_yours:"This job is no longer with you.", need_reason:"Choose a reason.", need_note:"Say what happened.",
    wrong_pin:"That PIN is not right.", pin_locked:"The PIN is locked after five wrong tries. Call the NovaX office.",
    has_job:"Finish the job you have before going offline.", docs:"Add your CNIC photo, home bill photo and emergency contact first.", cash_needed:"Take the cash first, then tick the cash line.",
    cash_mismatch:"That amount is not right. It cannot be more than the fare.", short_note:"Say why the cash is short." };
  function netFail(e){ return /fetch|network|Failed|timeout|Load failed/i.test(String((e&&e.message)||e)); }
  /* Every rider step answers "already done" when it is sent twice, so a press
     lost on a weak connection is simply sent again, up to three times. */
  function act(name,args,okText,tries){
    tries=tries||0;
    if(S.busy&&!tries) return Promise.resolve(false);
    S.busy=true;
    return rpc(name,args).then(function(r){
      S.busy=false;
      if(r&&r.ok===false){ toast(SAY[r.reason]||"That did not work. Try again."); return refresh(false).then(function(){ return r; }); }
      if(okText) toast(okText);
      S.sheet=null; S.cashOk=false;
      return refresh(true).then(function(){ return r||{ ok:true }; });
    }).catch(function(e){
      if(netFail(e)&&tries<3){
        toast("Weak connection. Sending again…");
        return new Promise(function(res){ setTimeout(res,1500*(tries+1)); }).then(function(){ return act(name,args,okText,tries+1); });
      }
      S.busy=false; S.sheet=null; paint();
      toast(netFail(e)?"No connection. Nothing is lost: press again when you have signal.":friendly(e.message));
      return false;
    });
  }
  /* Two presses: a pocket tap must not move a parcel. */
  function sure(t){
    if(t.dataset.sure==="1") return true;
    t.dataset.sure="1"; t.textContent="Press again to confirm";
    setTimeout(function(){ if(t.isConnected&&!S.busy){ t.dataset.sure="0"; paint(); } },4000);
    return false;
  }

  document.addEventListener("change",function(e){
    if(e.target.id!=="cashOk") return;
    S.cashOk=e.target.checked;
    var pb=$("pickBtn"); if(pb) pb.disabled=!S.cashOk;
    if($("pinMsg")&&S.cashOk) say($("pinMsg"),"");
  });
  document.addEventListener("click",function(e){
    unlockSound();
    var t=e.target.closest("[data-auth],[data-act],[data-accept],[data-sheet],#forgot,#pickBtn,#dropBtn,#backBtn,#retryBtn,#returnBtn,#shGo,#onSw,#signOut");
    if(!t) return;
    if(t.dataset.auth) return renderAuth(t.dataset.auth);
    if(t.dataset.act==="reload") return boot();
    if(t.id==="forgot") return doForgot();
    if(t.id==="signOut"){ stop(); return Promise.resolve(sb.auth.signOut()).catch(function(){}).then(function(){ S.me=null; S.feed=null; renderAuth("signin"); }); }
    if(t.id==="onSw"){
      var on=t.getAttribute("aria-checked")!=="true";
      if(!on&&S.feed&&S.feed.active){ toast(SAY.has_job); return; }
      return act("nvi_rider_online",{ p_on:on },on?"You are online.":"You are offline.");
    }
    if(t.dataset.accept){ t.disabled=true; return act("nvi_rider_accept",{ p_job:t.dataset.accept },"Job accepted. Go to the pickup."); }
    if(t.hasAttribute("data-sheet")){ S.sheet=t.dataset.sheet||null; return paint(); }
    var j=S.feed&&S.feed.active; if(!j) return;
    var due=Number(j.due_now||0);
    if(t.id==="pickBtn"){
      if(due>0&&!S.cashOk){ toast(SAY.cash_needed); return; }
      if(!sure(t)) return;
      t.disabled=true; return act("nvi_rider_picked",{ p_job:j.id, p_cash:due>0?due:null },"Picked up. Now deliver it.");
    }
    if(t.id==="dropBtn"||t.id==="backBtn"){
      var back=t.id==="backBtn", pin=($("pin").value||"").replace(/\D/g,"");
      if(pin.length!==4){ say($("pinMsg"),"Type the 4-digit PIN the "+(back?"sender":"receiver")+" shows you."); $("pin").focus(); return; }
      if(due>0&&!S.cashOk){ say($("pinMsg"),"Take "+rs(due)+" in cash, then tick the cash line above."); return; }
      t.disabled=true;
      return act(back?"nvi_rider_returned":"nvi_rider_delivered",{ p_job:j.id, p_pin:pin, p_cash:due>0?due:null },back?"Returned. Thank you.":"Delivered. Well done.").then(function(r){
        if(r&&r.ok===false&&r.reason==="wrong_pin"&&$("pinMsg")) say($("pinMsg"),"That PIN is not right. "+r.left+" "+(r.left===1?"try":"tries")+" left. Ask the "+(back?"sender":"receiver")+" to open their tracking link.");
      });
    }
    if(t.id==="retryBtn"){ t.disabled=true; return act("nvi_rider_retry",{ p_job:j.id },"Go to the delivery address again."); }
    if(t.id==="returnBtn"){ if(!sure(t)) return; t.disabled=true; return act("nvi_rider_return",{ p_job:j.id },"Take the parcel back to the sender."); }
    if(t.id==="shGo"){
      var note=($("shNote").value||"").trim();
      if(S.sheet==="short"){
        var pin2=(($("pin")&&$("pin").value)||"").replace(/\D/g,""), amt=($("shAmt").value||"").replace(/\D/g,"");
        if(pin2.length!==4){ toast("Type the 4-digit PIN above first."); return; }
        if(amt===""||Number(amt)>=due){ toast("Enter the cash you received. It must be less than "+rs(due)+"."); $("shAmt").focus(); return; }
        if(note.length<3){ toast(SAY.short_note); $("shNote").focus(); return; }
        t.disabled=true;
        return act(j.status==="Returning"?"nvi_rider_returned":"nvi_rider_delivered",{ p_job:j.id, p_pin:pin2, p_cash:Number(amt), p_note:note },"Sent. The office will settle the cash.");
      }
      var why=$("shWhy").value;
      t.disabled=true;
      if(S.sheet==="failed") return act("nvi_rider_failed",{ p_job:j.id, p_reason:why, p_note:note||null },"Marked not delivered. Keep the parcel safe.");
      var text=why+(note?": "+note:"");
      if(S.sheet==="release") return act("nvi_rider_release",{ p_job:j.id, p_reason:text },"Job given back.");
      return act("nvi_rider_problem",{ p_job:j.id, p_note:text },"Sent to the office.");
    }
  });
  document.addEventListener("submit",function(e){
    if(e.target.id==="fIn") return doSignIn(e);
    if(e.target.id==="fJoin") return doJoin(e);
    if(e.target.id==="fDocs") return doDocs(e);
  });

  boot();
})();
</script>
</body>
</html>
