<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NovaX - Set a New Password</title>
<link rel="icon" href="/assets/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<style>
  /* 8 Oct 2026: the same card, colours and type as offline.html and the
     portal, in light and dark, so the pages around sign-in read as one
     product. Ids and the script's flow are unchanged. */
  :root{--bg:#f4f8f5;--panel:#fff;--field:#fbfdfc;--ink:#10201b;--muted:#60726b;--line:#d9e4df;--green:#0c7c59;--green-2:#14c77b;--btn-ink:#fff;--bad:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#07100d;--panel:#101815;--field:#0b1410;--ink:#edf8f2;--muted:#9db2a9;--line:#23342d;--green:#1fd18e;--green-2:#4ee6a5;--btn-ink:#04140d;--bad:#ff9d94}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px;
    box-shadow:0 18px 50px rgba(0,0,0,.08)}
  .mark{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-.01em}
  .mark img{width:34px;height:34px;border-radius:9px}
  h1{margin:20px 0 6px;font-size:22px;line-height:1.25;font-weight:800;text-align:center;letter-spacing:-.015em}
  p.sub{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--muted);text-align:center}
  label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
  input{width:100%;min-height:48px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;
    font:inherit;font-size:16px;margin-bottom:14px;background:var(--field);color:var(--ink)}
  input::placeholder{color:var(--muted)}
  input:focus{outline:2px solid var(--green-2);outline-offset:1px;border-color:transparent}
  button{width:100%;min-height:48px;padding:0 14px;border:0;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700;color:var(--btn-ink);background:var(--green)}
  button:focus-visible{outline:3px solid var(--green-2);outline-offset:3px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:14px;font-size:14px;line-height:1.5;display:none;text-align:center;color:var(--bad)}
  .msg[data-tone="ok"]{color:var(--green)}
  .hint{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}
  .hint a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px}
  .hint a:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
  a{color:var(--green)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><img src="/assets/favicon.svg" alt="" onerror="this.remove()"><span>NovaX Logistics</span></div>
    <h1>Set a new password</h1>
    <p class="sub" id="sub">Choose a new password for your NovaX account.</p>

    <div id="form">
      <label for="pw1">New password</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Type it again">
      <button id="go" type="button">Update password</button>
    </div>

    <div class="msg" id="msg" role="alert"></div>
    <div class="hint">Trouble? <a href="/index.html#signin">Back to sign in</a></div>
  </div>

<script src="/assets/vendor/supabase-2.117.2.js"></script>
<script>
(function(){
  var SB_URL="https://rhzunbzbdzicajqtohwp.supabase.co";
  var SB_KEY="sb_publishable_yH8i0Q43BAxXoExo95r0rQ_fCeRdHXA";
  var sb=null;
  try{ if(window.supabase&&window.supabase.createClient) sb=window.supabase.createClient(SB_URL,SB_KEY); }catch(e){}

  var pw1=document.getElementById("pw1"), pw2=document.getElementById("pw2"),
      go=document.getElementById("go"), msg=document.getElementById("msg"),
      form=document.getElementById("form"), sub=document.getElementById("sub");

  function say(t,good){
    /* The colour comes from the stylesheet, so it is readable in dark mode too. */
    msg.textContent=t; msg.setAttribute("data-tone",good?"ok":"err"); msg.style.display="block";
  }

  if(!sb){
    form.style.display="none";
    say("Could not load the password service. Please refresh, or contact NovaX support.",false);
    return;
  }

  /* Supabase puts the recovery token in the URL fragment and the JS client
     turns it into a temporary session. Without that session updateUser()
     would fail with a confusing auth error, so check for it up front and say
     something a person can act on instead. */
  function haveRecovery(){
    var h=String(location.hash||"");
    return h.indexOf("access_token")>-1 || h.indexOf("type=recovery")>-1;
  }

  sb.auth.getSession().then(function(r){
    var session=r&&r.data&&r.data.session;
    if(!session && !haveRecovery()){
      form.style.display="none";
      sub.textContent="";
      say("This link is missing or has expired. Request a new reset link from the sign-in page.",false);
    }
  }).catch(function(){});

  go.addEventListener("click", function(){
    var a=pw1.value||"", b=pw2.value||"";
    if(a.length<8){ say("Use at least 8 characters.",false); pw1.focus(); return; }
    if(a!==b){ say("Those two passwords do not match.",false); pw2.focus(); return; }

    go.disabled=true; var old=go.textContent; go.textContent="Updating…";
    Promise.resolve(sb.auth.updateUser({ password:a }))
      .catch(function(e){ return { error:e }; })
      .then(function(res){
        go.disabled=false; go.textContent=old;
        if(res&&res.error){
          var m=String((res.error&&res.error.message)||res.error);
          if(/session|jwt|token|expired|not authenticated/i.test(m)){
            say("This reset link has expired. Request a new one from the sign-in page.",false);
          } else {
            say("Could not update your password: "+m,false);
          }
          return;
        }
        form.style.display="none";
        sub.textContent="";
        say("Password updated. Redirecting you to sign in…",true);
        /* Said "Redirecting you to sign in" and landed on the homepage with
           nothing open. #signin opens the sign-in dialog on arrival. */
        setTimeout(function(){ location.href="/index.html#signin"; },1800);
      });
  });

  [pw1,pw2].forEach(function(el){
    el.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); go.click(); } });
  });
})();
</script>
</body>
</html>
