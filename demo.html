<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NovaX Logistics — Demo Portal</title>
<!-- WHY THIS FILE EXISTS
     The demo was shared as novaxlogistics.com/client.html?demo=1. WhatsApp and
     other chat clients linkify bare domains unreliably once a query string is
     involved -- a merchant tapped it and Safari opened just "novaxlogistics.com"
     with the path and ?demo=1 stripped. A clean path with no "?" cannot be
     truncated that way, so the link we send is now /demo.html and this hands
     off to the real portal. -->
<link rel="canonical" href="https://novaxlogistics.com/client.html?demo=1">
<meta http-equiv="refresh" content="0; url=/client.html?demo=1">
<script>location.replace("/client.html?demo=1" + location.hash);</script>
<style>
  html,body{margin:0;height:100%;background:#0F1512;color:#EAF2EC;
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:grid;place-items:center;text-align:center;padding:24px}
  a{color:#14c77b;font-weight:700}
  .d{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
    border:3px solid rgba(20,199,123,.25);border-top-color:#14c77b;
    animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.d{animation:none}}
</style>
</head>
<body>
  <div>
    <div class="d" aria-hidden="true"></div>
    <p>Opening the NovaX demo portal&hellip;</p>
    <p><a href="/client.html?demo=1">Tap here if it does not open</a></p>
  </div>
</body>
</html>
