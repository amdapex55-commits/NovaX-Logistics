<style>
/* NovaX Sales (2 Oct 2026). One page for commission sales reps and for the
   admins who watch them. Every number and every action goes through a
   database function that checks who is asking; this page only draws. */
:root{
  --ink:#10221a; --ink-2:#33463c; --muted:#5d6e65; --green:#0fbf78; --green-h:#14cf86; --green-2:#087c55; --green-3:#06603f;
  --mint:#eafbf3; --mint-line:#c6ebd8; --lime:#d9ff74; --paper:#fbfcf8; --paper-2:#f3f5ee; --card:#fff;
  --line:#dce7df; --line-2:#c4d6ca; --amber:#fff4da; --amber-ink:#7a5500; --blue:#eaf3ff; --blue-ink:#235c93;
  --red-bg:#fdecea; --red-ink:#9b1c13; --navy:#0d2920;
  --sa-b:env(safe-area-inset-bottom,0px); --sa-t:env(safe-area-inset-top,0px);
  --display:Manrope,"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
a{color:var(--green-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green-2);outline-offset:2px}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 16px}
@media (min-width:700px){.wrap{padding:0 24px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid transparent;
  font:700 15.5px/1.2 var(--body);text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s}
.btn[disabled]{opacity:.6;cursor:default}
.btn-primary{background:var(--green);border-color:var(--green);color:#04170e}
.btn-primary:hover:not([disabled]){background:var(--green-h);border-color:var(--green-h)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-plain{background:var(--card);border-color:var(--line-2);color:var(--ink)}
.btn-plain:hover:not([disabled]){border-color:var(--ink-2)}
.btn-danger{background:var(--card);border-color:#e7b1ab;color:var(--red-ink)}
.btn-sm{min-height:40px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn-block{width:100%}

/* forms */
.fld{margin-bottom:12px}
.fld label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{width:100%;min-height:48px;padding:0 13px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;font:500 16px var(--body)}
.fld textarea{min-height:84px;padding:11px 13px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--green-2);box-shadow:0 0 0 3px rgba(15,191,120,.18)}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.msg{display:none;margin-top:10px;padding:11px 13px;border-radius:11px;font-size:14px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.msg.err{display:block;background:var(--red-bg);color:var(--red-ink);border:1px solid #f0c4bf}
.msg.ok{display:block;background:var(--mint);color:var(--green-3);border:1px solid var(--mint-line)}

/* header and tabs */
.top{position:sticky;top:0;z-index:30;background:rgba(251,252,248,.98);border-bottom:1px solid var(--line);padding-top:var(--sa-t)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.brand img{width:32px;height:32px;border-radius:9px}
.brand b{font:800 16px/1 var(--display)}
.brand small{display:block;font:700 9px/1 var(--mono);letter-spacing:.18em;color:var(--green-2);margin-top:3px}
.who{margin-left:auto;text-align:right;font-size:13px;line-height:1.3;min-width:0;overflow:hidden}
.who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.who span{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:46px;padding:0 14px;border:0;background:none;font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
/* reps: thumb tabs at the bottom on phones */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sa-b)}
.bnav button{min-height:58px;border:0;background:none;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bnav button i{font-style:normal;font-size:18px;line-height:1}
.bnav button[aria-selected="true"]{color:var(--green-2)}
.has-bnav main{padding-bottom:calc(84px + var(--sa-b))}
@media (min-width:900px){.bnav{display:none}.has-bnav main{padding-bottom:40px}}
@media (max-width:899px){.rep .tabs{display:none}}

main{padding:18px 0 40px}
h1.page{font:800 clamp(24px,5vw,30px)/1.15 var(--display);letter-spacing:-.02em;margin-bottom:4px}
.sub{color:var(--muted);font-size:15px}
.sec{margin-top:22px}
.sec>h2{font:800 18px/1.25 var(--display);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.stat small{display:block;font:700 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:800 26px/1.1 var(--display);margin-top:5px;font-variant-numeric:tabular-nums}
.stat.go{background:var(--mint);border-color:var(--mint-line)}
.chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--paper-2);color:var(--ink-2)}
.chip.good{background:var(--mint);color:var(--green-3)}
.chip.warn{background:var(--amber);color:var(--amber-ink)}
.chip.info{background:var(--blue);color:var(--blue-ink)}
.chip.bad{background:var(--red-bg);color:var(--red-ink)}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-height:64px}
button.item:hover{border-color:var(--line-2)}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span.meta{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line-2);border-radius:14px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin:12px 0 10px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:40px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;font-size:13.5px;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line-2);border-radius:12px;background:#fff;font-size:16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.copybox{display:flex;gap:8px;align-items:stretch}
.copybox input{flex:1;min-width:0;min-height:48px;padding:0 12px;border:1.5px solid var(--line-2);border-radius:12px;font:600 14px var(--mono);background:var(--paper-2)}
.tpl{white-space:pre-wrap;font-size:14.5px;line-height:1.5;background:var(--paper-2);border-radius:12px;padding:12px;margin:8px 0}

/* lead sheet: bottom sheet on phones, side panel on desktop */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(13,41,32,.45)}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:#fff;
  border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--sa-b));box-shadow:0 -20px 60px rgba(13,41,32,.25)}
@media (min-width:900px){.sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:0;padding:22px}}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-head h2{font:800 20px/1.25 var(--display);flex:1;min-width:0}
.x{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2);font-size:22px;line-height:1}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:12px 0}
.outcomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.outcomes button{min-height:48px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;font-size:14.5px}
.outcomes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.quick button{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}

/* tables (admin, desktop) collapse into cards on phones */
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:700 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--paper-2)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:759px){
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl{border:0;background:none}
  .tbl tr{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:6px 0}
  .tbl td{border:0;padding:5px 14px;display:flex;justify-content:space-between;gap:12px}
  .tbl td::before{content:attr(data-l);font:700 10.5px/1.6 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .tbl td.num{text-align:right}
}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sa-b));transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);
  background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none}
@media (min-width:900px){.toast{bottom:28px}}
.auth{max-width:440px;margin:28px auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper-2);border-radius:12px;padding:4px;margin:16px 0}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pre{font:500 12.5px/1.5 var(--mono);background:var(--navy);color:#e8f5ee;border-radius:12px;padding:14px;overflow:auto;max-height:340px;white-space:pre}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.split>*,.list>*{min-width:0}
@media (min-width:900px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.check{width:22px;height:22px}

/* joining: form, documents, signature */
.join{max-width:760px;margin:0 auto}
.jsteps{display:flex;gap:8px;list-style:none;margin:4px 0 14px;padding:0;font-size:13px;font-weight:700;color:var(--muted)}
.jsteps li{display:flex;align-items:center;gap:6px}
.jsteps li+li::before{content:"";width:18px;height:2px;background:var(--line-2);margin-right:2px}
.jsteps b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper-2);border:1.5px solid var(--line-2);font-size:12px}
.jsteps .now{color:var(--ink)}.jsteps .now b{background:var(--green);border-color:var(--green);color:#04170e}
.jsteps .done b{background:var(--mint);border-color:var(--mint-line);color:var(--green-3)}
.jh{font:800 17px/1.3 var(--display);margin:6px 0 10px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:600;cursor:pointer}
.agree .check{flex:none;margin-top:1px}
.pad{position:relative;height:170px;border:1.5px dashed var(--line-2);border-radius:12px;background:#fff;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padph{position:absolute;inset:auto 0 14px;text-align:center;color:var(--muted);font-size:13.5px;pointer-events:none}
.pad::after{content:"";position:absolute;left:18px;right:18px;bottom:40px;border-bottom:1px solid var(--line);pointer-events:none}
.dtabs{display:flex;gap:4px;background:var(--paper-2);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:1 0 auto;min-height:42px;padding:0 12px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14px;color:var(--muted)}
.dtabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dview{margin-top:10px;max-height:62vh;max-height:62dvh;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:14px;background:var(--paper-2);padding:10px}
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:22px 18px;font:400 14.5px/1.6 var(--body);overflow-wrap:anywhere}
@media (min-width:700px){.doc{padding:34px 40px}}
.doc p,.doc ul,.doc ol{margin:0 0 10px}
.doc ul,.doc ol{padding-left:22px}.doc li{margin-bottom:5px}
.doc h3{font:800 14.5px/1.3 var(--display);margin:16px 0 6px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--green);margin-bottom:16px}
.dlogo{display:flex;gap:10px;align-items:center;min-width:0}
.dlogo img{width:40px;height:40px;border-radius:10px;flex:none}
.dlogo b{display:block;font:800 17px/1.2 var(--display)}
.dlogo small{display:block;font-size:11px;color:#555;line-height:1.35}
.dref{font:600 11.5px/1.4 var(--mono);color:#555}
.dtitle{font:800 21px/1.2 var(--display);text-align:center;margin:4px 0 16px;letter-spacing:.01em}
.dsigs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:22px}
.dsig{font-size:12.5px;line-height:1.4;min-width:0}
.dsig b{display:block;font-size:13.5px;margin-top:6px}
.dsig span{display:block;color:#555}
.dsigbox{height:72px;border-bottom:1.5px solid #222;display:flex;align-items:flex-end}
.dsigbox img{max-height:70px;max-width:100%}
.dsigph{font-size:11.5px;color:#999;padding-bottom:4px}
.dseal span,.dissued span{display:inline-grid;place-items:center;width:66px;height:66px;margin-bottom:3px;border:2px solid var(--green-2);border-radius:50%;color:var(--green-2);font:800 9.5px/1.15 var(--display);text-align:center;letter-spacing:.06em;transform:rotate(-8deg)}
.dissued span{border-color:#555;color:#555;font-weight:700;letter-spacing:0;font-size:9px}
.dcert{text-align:center;border:3px double var(--green-2)}
.dcert .dhead{text-align:left}
.dc1{font-size:15px;color:#333}.dc2{font:800 clamp(22px,5vw,30px)/1.2 var(--display);margin:6px 0 2px!important}.dc3{font:600 13px var(--mono);color:#555}
.dc4{font:800 20px/1.3 var(--display);color:var(--green-3)}
.dcert .dsigs{text-align:left}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body.printing>*:not(#printRoot){display:none!important}

  body.printing{background:#fff}

  #printRoot .dcert{border:3px double #087c55;padding:28px}
  #printRoot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

  var p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Karachi", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  var d = new Date(p + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + (add || 0));

/* Plain words, never a database message. */
function friendly(m){
  var s = String(m || "");
  if (/invalid login credentials/i.test(s)) return "Wrong email or password.";
  if (/already (been )?registered|already exists/i.test(s)) return "This email already has a login. Sign in instead, then enter your rep code.";
  if (/rate limit|too many requests|over_email/i.test(s)) return "Too many tries. Wait a minute and try again.";
  if (/password should|weak password/i.test(s)) return "Choose a stronger password: at least 8 characters.";
  if (/failed to fetch|networkerror|load failed|abort|timed? ?out/i.test(s)) return "We couldn't reach NovaX. Check your internet and try again.";
  if (/jwt|pgrst|\bfunction\b|\brelation\b|\bcolumn\b|violates|syntax error|permission denied for/i.test(s)) { console.warn("NovaX Sales:", s); return "Something went wrong on our side. Try again, or tell NovaX on WhatsApp."; }
  return s;
}
function rpc(name, args){
  if (!sb) return Promise.reject(new Error("We couldn't reach NovaX. Refresh the page."));
  return Promise.resolve(sb.rpc(name, args || {})).then(function(r){
    if (r && r.error) throw new Error(friendly(r.error.message));
    return r ? r.data : null;

}

  var done = function(){ toast("Copied"); };

function setupPad(){
  var c = $("pad"), ctx, drawing = false, last = null, ink = 0, lastW = 0;
  function size(){
    var r = c.getBoundingClientRect(); if (Math.round(r.width) === lastW) return; lastW = Math.round(r.width);   /* phones fire resize when the address bar moves */
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var keep = ink ? c.toDataURL() : null;
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#10221a";
    if (keep) { var im = new Image(); im.onload = function(){ ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = keep; }
  }
  function pt(e){ var r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  c.addEventListener("pointerdown", function(e){ e.preventDefault(); drawing = true; last = pt(e); try { c.setPointerCapture(e.pointerId); } catch (_) {}
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI * 2); ctx.fillStyle = "#10221a"; ctx.fill(); $("padPh").hidden = true; });
  c.addEventListener("pointermove", function(e){ if (!drawing) return; e.preventDefault(); var p = pt(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ink += Math.hypot(p.x - last.x, p.y - last.y); last = p; });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function(t){ c.addEventListener(t, function(){ drawing = false; }); });
  $("padClear").addEventListener("click", function(){ ink = 0; ctx.clearRect(0, 0, c.width, c.height); $("padPh").hidden = false; });
  S.join.resize = size;
  if (!window.__nvPadResize) { window.__nvPadResize = true; window.addEventListener("resize", function(){ if (S.join && S.join.resize && document.getElementById("pad")) S.join.resize(); }); }
  size();
  S.join.pad = { ink: function(){ return ink; }, png: function(){
    var o = document.createElement("canvas"); o.width = 600; o.height = 200;
    o.getContext("2d").drawImage(c, 0, 0, o.width, o.height); return o.toDataURL("image/png"); } };
}
function sha256(text){
  if (!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.reject(new Error("This browser cannot sign documents. Open the page in Chrome."));
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b), function(x){ return ("0" + x.toString(16)).slice(-2); }).join(""); });
}

/* CSV: quotes, commas and newlines inside quotes, and a header row. */
function parseCsv(text){
  var rows = [], row = [], f = "", q = false, i, c;
  text = String(text || "").replace(/^﻿/, "");
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === "\t") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim() !== ""; }); });
}
var HEAD = { "lead id": "lead_ref", "lead_ref": "lead_ref", "id": "lead_ref", "store name": "store_name", "store": "store_name", "business": "store_name", "name": "store_name",
  "contact person": "contact_name", "contact": "contact_name", "owner": "contact_name", "phone": "phone", "mobile": "phone", "number": "phone", "whatsapp": "phone",
  "city": "city", "category": "category", "sells": "category", "where found": "source", "source": "source", "store link": "store_link", "link": "store_link", "url": "store_link",
  "orders per month": "est_orders", "orders": "est_orders", "assign to": "assign_to", "rep": "assign_to", "rep code": "assign_to" };
function csvToRows(text){
  var t = parseCsv(text); if (t.length < 2) throw new Error("Add a header row and at least one lead.");
  var keys = t[0].map(function(h){ return HEAD[String(h).trim().toLowerCase()] || null; });
  if (keys.indexOf("store_name") < 0 || keys.indexOf("phone") < 0) throw new Error("The first row needs a \"Store name\" and a \"Phone\" column.");
  return t.slice(1).map(function(r){ var o = {}; keys.forEach(function(k, i){ if (k && r[i] != null && String(r[i]).trim() !== "") o[k] = String(r[i]).trim(); }); return o; });
}

          (a.alt_rep_id ? '<button class="btn btn-plain btn-sm" type="button" data-decide="Approved" data-client="' + esc(a.client_id) + '" data-rep="' + esc(a.alt_rep_id) + '">Credit ' + esc(a.alt_rep_code) + "</button>" : "") +
          '<button class="btn btn-danger btn-sm" type="button" data-decide="Rejected" data-client="' + esc(a.client_id) + '">Credit nobody</button></div></div>';
      }).join("") + "</div>" : '<div class="empty">Nothing waiting.</div>') + "</section>" +
      '<section class="sec"><h2>Recently credited</h2>' + (done.length ? '<table class="tbl"><thead><tr><th>Store</th><th>Rep</th><th>How</th><th>Status</th><th>Signed up</th></tr></thead><tbody>' +
        done.slice(0, 100).map(function(a){ return '<tr><td data-l="Store">' + esc(a.store_name) + '</td><td data-l="Rep">' + esc(a.rep_code) + '</td><td data-l="How">' + esc(M[a.method] || a.method) +
          '</td><td data-l="Status">' + chip(a.status === "Approved" ? "Signed up" : a.status) + '</td><td data-l="Signed up">' + esc(pkt(a.signed_up_at)) + "</td></tr>"; }).join("") + "</tbody></table>" : '<div class="empty">None yet.</div>') + "</section>";
  });
};
ADMIN.rewards = function(){
  var st = S.admin.rewardFilter || "Earned";
  return rpc("sales_admin_rewards", { p_status: st === "All" ? null : st }).then(function(rows){
    rows = rows || []; S.admin.rewardRows = rows;
    var sum = rows.reduce(function(s, w){ return s + Number(w.amount || 0); }, 0);
    if (S.tab !== "rewards") return; $("main").innerHTML = '<h1 class="page">Rewards</h1><p class="sub">Approve what reps earned, then mark it paid with the bank reference. Reps see every step.</p>' +
      '<div class="filters">' + ["Earned", "Approved", "Waiting", "Paid", "Rejected", "All"].map(function(s){ return '<button type="button" data-rfilter="' + s + '" aria-pressed="' + (st === s) + '">' + s + "</button>"; }).join("") + "</div>" +
      (rows.length ? '<div class="card" style="margin-bottom:10px"><label style="display:flex;align-items:center;gap:10px;font-weight:700"><input type="checkbox" class="check" id="selAll"> Select all ' + rows.length + " (" + rs(sum) + ")</label>" +
        '<div class="steps" style="margin-top:10px">' + (st === "Earned" ? '<button class="btn btn-primary btn-sm" type="button" data-bulk="Approved">Approve selected</button>' : "") +
        (st === "Earned" || st === "Approved" ? '<button class="btn btn-dark btn-sm" type="button" data-bulk="Paid">Mark selected paid…</button>' : "") +
        (st !== "Paid" && st !== "Rejected" ? '<button class="btn btn-danger btn-sm" type="button" data-bulk="Rejected">Reject selected…</button>' : "") +
        '<button class="btn btn-plain btn-sm" type="button" id="csvOut">Download CSV</button></div><div class="msg" id="rwMsg" role="alert"></div></div>' +
        '<table class="tbl"><thead><tr><th></th><th>Rep</th><th>Store</th><th>For</th><th class="num">Amount</th><th>Status</th><th>When</th></tr></thead><tbody>' + rows.map(function(w){
          return '<tr><td data-l="Pick"><input type="checkbox" class="check" data-rw="' + esc(w.id) + '" aria-label="Select ' + esc(w.store_name) + '"></td><td data-l="Rep"><b>' + esc(w.rep_code) + "</b> " + esc(w.rep_name) +
            '</td><td data-l="Store">' + esc(w.store_name) + '</td><td data-l="For">' + (w.kind === "account_opened" ? "Account opened" : "First pickup") + '</td><td class="num" data-l="Amount">' + rs(w.amount) +
            '</td><td data-l="Status">' + esc(w.status) + (w.paid_ref ? '<br><span class="hint">' + esc(w.paid_ref) + "</span>" : "") + (w.note ? '<br><span class="hint">' + esc(w.note) + "</span>" : "") +
            '</td><td data-l="When">' + esc(pkt(w.paid_at || w.approved_at || w.earned_at)) + "</td></tr>"; }).join("") + "</tbody></table>"
      : '<div class="empty">No rewards here.</div>');
  });
};
function bulkRewards(status){
  var ids = [].map.call(document.querySelectorAll("[data-rw]:checked"), function(c){ return c.getAttribute("data-rw"); }), msg = $("rwMsg");
  if (!ids.length) return showMsg(msg, "Tick the rewards first.");
  var ref = null, note = null;
  if (status === "Paid") { ref = prompt("Bank or transfer reference for these " + ids.length + " payments:"); if (ref === null) return; if (ref.trim().length < 3) return showMsg(msg, "Enter the bank or transfer reference."); }
  if (status === "Rejected") { note = prompt("Why? The rep will see this:"); if (note === null) return; if (note.trim().length < 3) return showMsg(msg, "Say why, so the rep understands."); }
  rpc("sales_admin_set_rewards", { p_ids: ids, p_status: status, p_ref: ref, p_note: note }).then(function(n){ toast(n + " updated"); ADMIN.rewards(); })
    .catch(function(e){ showMsg(msg, e.message); });
}
function rewardsCsv(){
  var rows = S.admin.rewardRows || [], q = function(v){ v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var csv = [["Rep code", "Rep", "Store", "For", "Amount", "Status", "Earned", "Paid", "Reference", "Note"]].concat(rows.map(function(w){
    return [w.rep_code, w.rep_name, w.store_name, w.kind === "account_opened" ? "Account opened" : "First pickup", w.amount, w.status, pkt(w.earned_at), pkt(w.paid_at), w.paid_ref, w.note]; }))
    .map(function(r){ return r.map(q).join(","); }).join("\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = "novax-sales-rewards-" + todayPk(0) + ".csv"; a.click();
}
ADMIN.sheet = function(){
  return rpc("sales_admin_sheet_status").then(function(st){
    if (S.tab !== "sheet") return;
    $("main").innerHTML = '<h1 class="page">Google Sheet</h1><p class="sub">Add leads to your Google Sheet. NovaX reads it every 15 minutes and adds new rows here as leads. Nothing is written back to the sheet; calls, statuses and signups live in this portal.</p>' +
      '<section class="sec"><h2>Your sheet</h2><form id="fSheet" class="card" novalidate>' +
        '<div class="fld"><label for="shUrl">Google Sheet link</label><input id="shUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://docs.google.com/spreadsheets/d/…" value="' + esc(st.sheet_url || "") + '"></div>' +
        '<div class="row-btns" style="margin-top:0"><button class="btn btn-primary" id="shSave" type="submit">' + (st.sheet_id ? "Save link and import" : "Link sheet and import") + "</button>" +
        (st.sheet_id ? '<button class="btn btn-dark" type="button" id="shPull">Import now</button><a class="btn btn-plain" target="_blank" rel="noopener" href="' + esc(st.sheet_url) + '">Open sheet</a>' : "") + "</div>" +
        '<div class="msg" id="shMsg" role="alert"></div></form></section>' +
      '<section class="sec"><h2>Last import</h2><div id="shLast">' + sheetLast(st.last) + "</div></section>" +
      '<section class="sec"><h2>How the sheet must look</h2><div class="card"><ul style="margin:0;padding-left:20px">' +
        "<li>A tab named <b>Leads</b> (otherwise NovaX reads the first tab).</li>" +
        "<li>Headings in row 1. NovaX reads these columns by name, in any order:</li></ul><div class=\"tpl\">" + esc(SHEET_HEADERS.join(" | ")) + "</div>" +
        '<button class="btn btn-plain btn-sm" type="button" data-copy="' + esc(SHEET_HEADERS.join("\t")) + '">Copy headings (paste into A1)</button>' +
        '<ul style="margin:12px 0 0;padding-left:20px"><li><b>Store name</b> and <b>Phone</b> (a Pakistani mobile) are required; rows without them are listed below with the reason.</li>' +
        "<li>Leave <b>Lead ID</b> empty if you like; NovaX matches a lead by its Lead ID or phone, so re-reading the sheet never makes duplicates.</li>" +
        "<li><b>Assign to</b> = a rep code. It only places a lead that has no rep yet; moves you make here are never undone by the sheet.</li>" +
        "<li>Sharing: <b>Share → General access → Anyone with the link → Viewer</b>. NovaX cannot read a private sheet.</li>" +
        "<li>Deleting a row in the sheet does not delete the lead here.</li></ul></div></section>";
  });
};
function sheetLast(l){
  if (!l) return '<div class="empty">No import yet.</div>';
  if (!l.ok) return '<div class="msg err" style="display:block">' + esc(l.error || "The import failed.") + (l.at ? " (" + esc(pkt(l.at, true)) + ")" : "") + "</div>";
  var sk = l.skipped || [], nt = l.notes || [];
  return '<div class="card"><p><b>' + esc(pkt(l.at, true)) + "</b> · " + (l.rows || 0) + " rows read · " + (l.inserted || 0) + " new · " + (l.updated || 0) + " already here" + (sk.length ? " · " + sk.length + " skipped" : "") + "</p>" +
    (sk.length || nt.length ? '<ul style="margin:10px 0 0;padding-left:20px;font-size:14px">' + sk.concat(nt).map(function(x){ return "<li>Row " + esc(x.row) + (x.lead_ref ? " (" + esc(x.lead_ref) + ")" : "") + ": " + esc(x.reason) + "</li>"; }).join("") + "</ul>" : "") + "</div>";
}
var SHEET_HEADERS = ["Lead ID", "Store name", "Contact person", "Phone", "City", "Category", "Where found", "Store link", "Orders per month", "Assign to"];
function sheetDone(r, btn){
  busy(btn, false);
  if (r && r.ok) toast("Imported: " + (r.inserted || 0) + " new, " + (r.updated || 0) + " already here" + ((r.skipped || []).length ? ", " + r.skipped.length + " skipped" : ""));
  return ADMIN.sheet();
}
function doSheet(e){
  e.preventDefault();
  var btn = $("shSave"), url = $("shUrl").value.trim();
  if (!/\/spreadsheets\/d\/[A-Za-z0-9_-]{20,}/.test(url)) return showMsg($("shMsg"), "Paste the full Google Sheet link (it starts with https://docs.google.com/spreadsheets/d/).");
  busy(btn, true, "Reading the sheet…");
  rpc("sales_admin_set_sheet", { p_url: url }).then(function(r){ return sheetDone(r, btn); }).catch(function(err){ busy(btn, false); showMsg($("shMsg"), err.message); });
}

/* ═════ events ═════ */
var sheetReturn = null;
function openSheet(html, labelId){
  sheetReturn = document.activeElement;
  $("sheetRoot").innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + labelId + '" id="sheet">' + html + "</div>";
  document.body.style.overflow = "hidden";
  [].forEach.call(document.querySelectorAll("main,.top,.bnav"), function(el){ el.setAttribute("inert", ""); });
  setTimeout(function(){ var x = document.querySelector("#sheet .x"); if (x) x.focus(); }, 30);
}
function closeSheet(){
  $("sheetRoot").innerHTML = ""; document.body.style.overflow = "";
  [].forEach.call(document.querySelectorAll("[inert]"), function(el){ el.removeAttribute("inert"); });
  if (sheetReturn && sheetReturn.focus) try { sheetReturn.focus(); } catch (e) {}
}
document.addEventListener("click", function(e){
  var t = e.target, el;
  if ((el = t.closest("[data-tab]"))) return go(el.getAttribute("data-tab"));
  if ((el = t.closest("[data-auth]"))) return renderAuth(el.getAttribute("data-auth"));
  if ((el = t.closest("[data-lead]"))) return openLead(el.getAttribute("data-lead"));
  if ((el = t.closest("[data-filter]"))) { S.filter = el.getAttribute("data-filter"); [].forEach.call(document.querySelectorAll("[data-filter]"), function(b){ b.setAttribute("aria-pressed", b === el ? "true" : "false"); }); return drawLeadList(); }
  if ((el = t.closest("[data-outcome]"))) {
    [].forEach.call(document.querySelectorAll("[data-outcome]"), function(b){ b.setAttribute("aria-pressed", b === el ? "true" : "false"); });
    var o = el.getAttribute("data-outcome"), need = o === "Call back" || o === "Demo booked";
    $("fuReq").textContent = need ? "(needed)" : "(optional)";
    if (o === "Not interested" || o === "Wrong number") $("fu").value = "";
    else if (!$("fu").value && (o === "No answer" || o === "Busy")) $("fu").value = todayPk(1);
    return;
  }
  if ((el = t.closest("[data-fu]"))) { var n = el.getAttribute("data-fu"); $("fu").value = n === "" ? "" : todayPk(parseInt(n, 10)); return; }
  if ((el = t.closest("[data-copy]"))) return copy(el.getAttribute("data-copy"));
  if ((el = t.closest("[data-rfilter]"))) { S.admin.rewardFilter = el.getAttribute("data-rfilter"); return ADMIN.rewards(); }
  if ((el = t.closest("[data-bulk]"))) return bulkRewards(el.getAttribute("data-bulk"));
  if ((el = t.closest("[data-decide]"))) {
    var st = el.getAttribute("data-decide");
    if (st === "Rejected" && !confirm("Credit nobody for this store? Any unpaid rewards for it are cancelled.")) return;
    el.disabled = true;
    return rpc("sales_admin_decide", { p_client: el.getAttribute("data-client"), p_status: st, p_rep: el.getAttribute("data-rep") || null })
      .then(function(){ toast(st === "Approved" ? "Credited" : "Nobody credited"); ADMIN.approvals(); }).catch(function(err){ el.disabled = false; toast(err.message); });
  }
  if ((el = t.closest("[data-rep-status]"))) {
    var to = el.getAttribute("data-rep-status");
    if (to === "Removed" && !confirm("Remove " + el.getAttribute("data-name") + "? They lose access now and their open leads go back to the pool. Earned rewards stay.")) return;
    el.disabled = true;
    return rpc("sales_admin_set_rep_status", { p_rep: el.getAttribute("data-rep"), p_status: to }).then(function(){ toast(to === "Removed" ? "Removed" : "Restored"); ADMIN.reps(); })
      .catch(function(err){ el.disabled = false; toast(err.message); });
  }
  if (t.closest("#refreshNow")) { var b = t.closest("#refreshNow"); busy(b, true, "Updating…"); return rpc("sales_refresh").then(function(r){ toast("Updated: " + (r.credited || 0) + " new stores credited, " + (r.rewards_earned || 0) + " rewards earned"); ADMIN.overview(); }).catch(function(err){ busy(b, false); toast(err.message); }); }
  if (t.closest("#csvOut")) return rewardsCsv();
  if (t.closest("#shPull")) { var pb = t.closest("#shPull"); busy(pb, true, "Importing…");
    return rpc("sales_admin_pull_sheet").then(function(r){ return sheetDone(r, pb); }).catch(function(err){ busy(pb, false); toast(err.message); }); }
  if (t.closest("#forgot")) return doForgot();
  if ((el = t.closest("[data-doc]"))) {
    var w = el.getAttribute("data-doc");
    [].forEach.call(document.querySelectorAll("[data-doc]"), function(b){ b.setAttribute("aria-selected", b === el ? "true" : "false"); });
    [].forEach.call(document.querySelectorAll("[data-pane]"), function(p){ p.hidden = p.getAttribute("data-pane") !== w; });
    return;
  }
  if ((el = t.closest("[data-print]"))) return printDocs(el.getAttribute("data-print").split(",").map(function(k){ return S.join.D[k]; }).join(""));
  if (t.closest("#openSales")) return startApp("rep");
  if (t.closest("#docsBack")) return S.join && S.join.back && S.join.back();
  if (t.closest("#myDocs")) { var md = t.closest("#myDocs"); busy(md, true, "Opening…");
    return rpc("sales_my_documents").then(function(sig){ busy(md, false); if (S.tab === "link") renderDocsView(S.me.rep, sig, function(){ go("link"); }, "Back"); })
      .catch(function(err){ busy(md, false); toast(err.message); }); }
  if ((el = t.closest("[data-file]"))) return openAdminFile(el.getAttribute("data-file"));
  if (t.closest("#signOut")) { return Promise.resolve(sb.auth.signOut()).catch(function(){}).then(function(){ S = { me: null, mode: null, tab: null, leads: [], stores: [], earnings: null, filter: "todo", q: "", admin: {} }; location.hash = ""; renderAuth(); }); }
  if ((el = t.closest("[data-act]"))) {
    var a = el.getAttribute("data-act");
    if (a === "close") return closeSheet();
    if (a === "goleads") { S.filter = "Not called"; return go("leads"); }
    if (a === "reload") return location.reload();
    if (a === "retab") return go(S.tab);
  }
});
document.addEventListener("submit", function(e){
  var id = e.target.id;
  if (id === "fIn") return doSignIn(e);
  if (id === "fJoin") return doJoin(e);
  if (id === "fCode") return doCode(e);
  if (id === "fProfile") return doProfile(e);
  if (id === "fSign") return doSign(e);
  if (id === "fCall") return saveCall(e);
  if (id === "fClaim") return doClaim(e);
  if (id === "fInvite") return doInvite(e);
  if (id === "fAssign") return doAssign(e);
  if (id === "fImport") return doImport(e);
  if (id === "fSheet") return doSheet(e);
});
document.addEventListener("input", function(e){
  if (e.target.id === "q") { S.q = e.target.value; drawLeadList(); }
  if (e.target.id === "lfQ") { clearTimeout(leadsT); leadsT = setTimeout(loadAdminLeads, 350); }
  if (e.target.id === "pCnic") { var cv = e.target.value, f = fmtCnic(cv); if (f !== cv) e.target.value = f; }
  if (e.target.id === "jCode" || e.target.id === "cCode" || e.target.id === "rCode") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});
document.addEventListener("change", function(e){
  if (e.target.id === "lfRep" || e.target.id === "lfStatus") return loadAdminLeads();
  if (e.target.id === "selAll") { [].forEach.call(document.querySelectorAll("[data-rw]"), function(c){ c.checked = e.target.checked; }); return; }
  var r = e.target.getAttribute && e.target.getAttribute("data-reassign");
  if (r) { var sel = e.target; sel.disabled = true;
    rpc("sales_admin_reassign", { p_prospect: r, p_rep: sel.value || null }).then(function(){ sel.disabled = false; toast(sel.value ? "Lead moved" : "Back in the pool"); })
      .catch(function(err){ sel.disabled = false; toast(err.message); loadAdminLeads(); }); }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && $("sheet")) closeSheet();
  if (e.key === "Tab" && $("sheet")) {
    var f = [].filter.call($("sheet").querySelectorAll("a[href],button:not([disabled]),input,textarea,select"), function(x){ return x.offsetWidth || x.offsetHeight; });
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
if (sb) sb.auth.onAuthStateChange(function(ev){ if (ev === "SIGNED_OUT" && S.mode) { S.mode = null; renderAuth(); } });
boot();
})();
</script>
