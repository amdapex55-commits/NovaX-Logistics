:root{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.top{background:var(--navy);color:var(--navy-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-height:44px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font:800 16px/1 var(--display)}
.brand i{font-style:normal;font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);background:var(--lime);padding:5px 7px;border-radius:4px;white-space:nowrap}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top a.tl,.top button.tl{color:var(--navy-muted);text-decoration:none;font-size:14px;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;background:none;border:0}
.sw{display:flex;align-items:center;gap:9px;min-height:44px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--navy-line);background:none;color:var(--navy-ink);font-weight:700;font-size:14px;white-space:nowrap}
.sw i{width:38px;height:24px;border-radius:999px;background:var(--navy-line);position:relative;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw[aria-checked="true"]{border-color:var(--navy-green)}
.sw[aria-checked="true"] i{background:var(--green)}
.sw[aria-checked="true"] i::after{transform:translateX(14px)}

main{padding:16px 0 60px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}

.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

.note{padding:11px 13px;border-radius:12px;font-size:14px;line-height:1.45;margin-bottom:14px}
.note.warn{background:var(--amber);color:var(--amber-ink)}
.note.info{background:var(--blue);color:var(--blue-ink)}
.cols{display:grid;gap:14px}

.col h2{font:800 14px/1.2 var(--display);margin:0 0 8px;display:flex;align-items:center;gap:8px}

.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line-2);border-radius:12px;text-align:center}
.jt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

.legs small{display:block;color:var(--muted);font-size:12.5px}
/* Phone numbers sit inside a line of text: a larger invisible hit area, so the line keeps its height. */
.legs small a,td a[href^="tel:"]{display:inline-block;padding:13px 6px;margin:-13px -6px;color:var(--green-2);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font-size:12.5px;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;color:var(--ink-2);background:#fff;white-space:nowrap}
.chip.good{background:var(--mint);border-color:var(--mint-line);color:var(--green-3)}
.chip.bad{background:var(--red-bg);border-color:#f1c9c4;color:var(--red-ink)}
.chip.warn{background:var(--amber);border-color:#ecd9a5;color:var(--amber-ink)}
.prob{margin-top:9px;padding:8px 10px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}

.btn-primary{background:var(--green);border-color:var(--green);color:#04170e}

.inline label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.inline .inp{width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
/* Phones: one line of header controls, and tables become stacked cards. */
@media (max-width:760px){
  .top .wrap{gap:4px 10px}
  .top-r{margin-left:0;width:100%;justify-content:space-between;flex-wrap:nowrap}
  .top a.tl{padding:0 4px;white-space:nowrap}

  td .row .btn{flex:1 1 auto}
}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line-2);margin-right:6px}
.dot.on{background:var(--green)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end}
.form label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.form .inp{width:100%}
h3{font:800 16px/1.2 var(--display);margin:0 0 10px}
.auth{max-width:420px;margin:30px auto}

:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
</style>

<script>
(function(){
  "use strict";
  var SB_URL="https://rhzunbzbdzicajqtohwp.supabase.co";
  var SB_KEY="sb_publishable_yH8i0Q43BAxXoExo95r0rQ_fCeRdHXA";

  var S={ b:null, tab:"live", open:null, timer:null, busy:false };   /* open = {job, kind} for the inline form */

  function rpc(name,args){

  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"'`]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;"}[c]; }); }
  function rs(n){ return "Rs "+Number(n||0).toLocaleString("en-PK"); }

  function ago(iso){ if(!iso) return "never"; var m=mins(iso); return m<1?"just now":m<60?m+" min ago":m<1440?Math.floor(m/60)+" h "+(m%60)+" min ago":Math.floor(m/1440)+" d ago"; }

    }).catch(function(e){
      if(/Admins only/i.test(e.message||"")){ stop(); $("main").innerHTML='<div class="auth"><h1>Admins only</h1><p style="color:var(--muted)">This login is not a NovaX admin. <button class="btn btn-plain" type="button" id="signOut">Sign out</button></p></div>'; return; }
      if(first) $("main").innerHTML='<div class="empty">'+esc(e.message||"Could not load.")+' <button class="btn btn-plain" type="button" data-act="reload">Try again</button></div>';

  function stop(){ if(S.timer){ clearInterval(S.timer); S.timer=null; } }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&S.timer&&!S.busy&&!S.open&&!typing()) load(false); });

  /* ───── painting ───── */
  function paint(){
    var b=S.b, c=b.config||{}, t=b.today||{}, live=b.live||[], riders=b.riders||[], closed=b.closed||[];
    $("openSw").hidden=false; $("bookLink").hidden=false;

  }
  function jobCard(j,free){
    var age=mins(j.created_at), late=(j.status==="Booked"&&age>=10)||(j.status==="Rider assigned"&&mins(j.assigned_at)>=30);

      (j.problem_note?'<div class="prob"><b>Rider says:</b> '+esc(j.problem_note)+' <span class="age">'+esc(ago(j.problem_at))+'</span></div>':'');
    h+='<div class="row">';
    if(j.status!=="Picked up"){
      h+='<select class="inp" data-pick="'+esc(j.id)+'" aria-label="Rider for '+esc(j.code)+'"><option value="">'+(free.length?"Choose a rider":"No free rider")+'</option>'+

         '<button class="btn btn-primary" type="button" data-do="assign" data-job="'+esc(j.id)+'">'+(j.status==="Booked"?"Assign":"Reassign")+'</button>';

  }
  function liveHtml(live,free){
    var cols=[["Booked","Needs a rider"],["Rider assigned","Rider on the way to pickup"],["Picked up","On the bike"]];
    return '<div class="cols">'+cols.map(function(c){
      var list=live.filter(function(j){ return j.status===c[0]; });
      return '<section class="col"><h2>'+c[1]+'<span>'+list.length+'</span></h2>'+(list.length?list.map(function(j){ return jobCard(j,free); }).join(""):'<div class="empty">Nothing here.</div>')+'</section>';
    }).join("")+'</div>';
  }
  function ridersHtml(riders){
    var h='<div class="card" style="margin-bottom:14px"><h3>Add a rider</h3><div class="form">'+
      '<div><label for="rName">Full name</label><input class="inp" id="rName" maxlength="80"></div>'+
      '<div><label for="rEmail">Email (their login)</label><input class="inp" id="rEmail" type="email" inputmode="email" maxlength="254"></div>'+
      '<div><label for="rPhone">Mobile</label><input class="inp" id="rPhone" type="tel" inputmode="tel" maxlength="20" placeholder="03XX XXXXXXX"></div>'+
      '<div><label for="rPlate">Bike number (optional)</label><input class="inp" id="rPlate" maxlength="20"></div>'+
      '<div><button class="btn btn-primary" type="button" data-do="invite" style="width:100%">Add rider</button></div></div>'+
      '<p class="age" style="margin:10px 0 0">Then send them <b>novaxlogistics.com/instant-rider.html</b>. They press First time, use this email and choose their own password. NovaX never sets a password for them.</p></div>';
    if(!riders.length) return h+'<div class="empty">No Instant riders yet.</div>';
    h+='<div class="tblwrap"><table><thead><tr><th>Rider</th><th>Status</th><th>Now</th><th>Done today</th><th>Cash with rider</th><th></th></tr></thead><tbody>'+riders.map(function(r){
      return '<tr><td><b>'+esc(r.full_name)+'</b><br><span class="age"><a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>'+(r.bike_plate?' &middot; '+esc(r.bike_plate):'')+'<br>'+esc(r.email)+'</span></td>'+
        '<td data-l="Status"><span class="chip '+(r.status==="Active"?"good":r.status==="Blocked"?"bad":"warn")+'">'+esc(r.status==="Invited"?"Invited, not joined":r.status)+'</span></td>'+
        '<td data-l="Now">'+(r.status==="Active"?'<span class="dot'+(r.online?' on':'')+'"></span>'+(r.online?"Online":"Offline")+(r.active_code?' &middot; on '+esc(r.active_code):'')+'<br><span class="age">seen '+esc(ago(r.last_seen))+'</span>':'<span class="age">&ndash;</span>')+'</td>'+
        '<td data-l="Done today">'+esc(r.done_today||0)+'</td><td data-l="Cash with rider"><b>'+esc(rs(r.cash_in_hand))+'</b></td>'+
        '<td><div class="row" style="margin:0">'+
          (Number(r.cash_in_hand)>0?'<button class="btn btn-primary" type="button" data-do="handover" data-rider="'+esc(r.id)+'" data-amt="'+esc(r.cash_in_hand)+'">Cash received</button>':'')+
          (r.status==="Blocked"?'<button class="btn btn-plain" type="button" data-do="setrider" data-rider="'+esc(r.id)+'" data-st="Active">Unblock</button>'
                               :'<button class="btn btn-plain" type="button" data-do="setrider" data-rider="'+esc(r.id)+'" data-st="Blocked">Block</button>')+
          '<button class="btn btn-danger" type="button" data-do="setrider" data-rider="'+esc(r.id)+'" data-st="Removed">Remove</button></div></td></tr>';
    }).join("")+'</tbody></table></div>';
    return h;
  }
  function closedHtml(closed){
    if(!closed.length) return '<div class="empty">No finished or cancelled jobs yet.</div>';
    return '<div class="tblwrap"><table><thead><tr><th>Job</th><th>Result</th><th>From &rarr; to</th><th>Fare</th><th>Rider</th></tr></thead><tbody>'+closed.map(function(j){
      var del=j.status==="Delivered";
      return '<tr><td><span class="code">'+esc(j.code)+'</span><br><span class="age">booked '+esc(when(j.created_at))+'</span></td>'+
        '<td data-l="Result"><span class="chip '+(del?"good":"bad")+'">'+esc(j.status)+'</span><br><span class="age">'+esc(when(del?j.delivered_at:j.cancelled_at))+(j.cancel_reason?'<br>'+esc(j.cancel_reason):'')+'</span></td>'+
        '<td data-l="From, to">'+esc(j.pickup_address)+'<br><span class="age">&rarr; '+esc(j.drop_address)+'</span></td>'+
        '<td data-l="Fare">'+esc(rs(j.fare))+'<br><span class="age">'+esc(j.km)+' km &middot; '+(j.payer==="sender"?"sender":"receiver")+' paid'+(j.cash_collected!=null?(j.handover_id?" &middot; cash handed in":" &middot; cash with rider"):"")+'</span></td>'+
        '<td data-l="Rider">'+esc(j.rider_name||"–")+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  }

  /* ───── actions ───── */
  var SAY={ not_found:"That job no longer exists.", too_late:"The parcel is already picked up, so the rider cannot be changed.", rider_inactive:"That rider is not active.",
    rider_busy:"That rider already has a job.", need_reason:"Write a reason first.", need_note:"Write a note first.", closed:"That job is already closed.",
    no_rider:"Assign a rider first.", wrong_step:"The job is not at that step any more.", nothing:"That rider holds no cash.",
    name:"Enter the rider's full name.", email:"Enter a valid email.", phone:"Enter a Pakistani mobile like 0300 1234567.", exists:"That email is already a rider.", status:"Unknown status." };
  function run(name,args,okText){
    if(S.busy) return;
    S.busy=true;
    return rpc(name,args).then(function(r){
      S.busy=false;
      if(r&&r.ok===false){ toast(SAY[r.reason]||"That did not work."); return load(false); }
      S.open=null; if(okText) toast(typeof okText==="function"?okText(r):okText);
      return load(false);
    }).catch(function(e){ S.busy=false; toast(e.message||"That did not work."); });
  }
  /* A second press within 5 s confirms; nothing destructive on one tap. */
  function twice(btn,label){
    if(btn.dataset.sure==="1") return true;
    btn.dataset.sure="1"; var was=btn.textContent; btn.textContent=label;
    setTimeout(function(){ if(btn.isConnected){ btn.dataset.sure="0"; btn.textContent=was; } },5000);
    return false;
  }
  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-tab],[data-do],[data-form],[data-act],#openSw,#signOut");
    if(!t) return;
    if(t.dataset.tab){ S.tab=t.dataset.tab; S.open=null; return paint(); }
    if(t.dataset.act==="reload") return boot();
    if(t.id==="signOut") return Promise.resolve(sb.auth.signOut()).catch(function(){}).then(function(){ renderAuth(); });
    if(t.id==="openSw"){
      var on=t.getAttribute("aria-checked")!=="true";
      if(!twice(t.querySelector("span"),on?"Press again: open to the public":"Press again: stop public booking")) return;
      return run("nvi_admin_set_open",{ p_open:on },on?"Public booking is on.":"Public booking is off.");
    }
    if(t.hasAttribute("data-form")){ S.open=t.dataset.form?{ job:t.dataset.job, kind:t.dataset.form }:null; paint(); var f=$("fNote"); if(f) f.focus(); return; }
    var d=t.dataset["do"], job=t.dataset.job;
    if(d==="assign"){
      var sel=document.querySelector('select[data-pick="'+job+'"]'), rid=sel&&sel.value;
      if(!rid){ toast("Choose a rider first."); if(sel) sel.focus(); return; }
      return run("nvi_admin_assign",{ p_job:job, p_rider:rid },"Rider assigned.");
    }
    if(d==="unassign"){ if(!twice(t,"Press again to unassign")) return; return run("nvi_admin_assign",{ p_job:job, p_rider:null },"Job is back in the open list."); }
    if(d==="cancel"||d==="picked"||d==="delivered"){
      var note=($("fNote")&&$("fNote").value||"").trim();
      if(note.length<3){ toast("Write a short reason first."); if($("fNote")) $("fNote").focus(); return; }
      if(d==="cancel") return run("nvi_admin_cancel",{ p_job:job, p_reason:note },"Job cancelled.");
      return run("nvi_admin_mark",{ p_job:job, p_status:d==="picked"?"Picked up":"Delivered", p_note:note },"Job updated.");
    }
    if(d==="invite"){
      return run("nvi_admin_invite_rider",{ p_name:$("rName").value, p_email:$("rEmail").value, p_phone:$("rPhone").value, p_plate:$("rPlate").value||null },"Rider added. Send them the rider link.");
    }
    if(d==="handover"){ if(!twice(t,"Press again: "+rs(t.dataset.amt)+" received")) return; return run("nvi_admin_handover",{ p_rider:t.dataset.rider },function(r){ return rs(r.amount)+" received from "+r.jobs+" job"+(r.jobs===1?"":"s")+"."; }); }
    if(d==="setrider"){
      var st=t.dataset.st;
      if(st!=="Active"&&!twice(t,st==="Removed"?"Press again to remove":"Press again to block")) return;
      return run("nvi_admin_set_rider",{ p_rider:t.dataset.rider, p_status:st },st==="Active"?"Rider unblocked.":st==="Blocked"?"Rider blocked.":"Rider removed.");
    }
  });
  document.addEventListener("submit",function(e){
    if(e.target.id!=="fIn") return;
    e.preventDefault();
    var email=$("inEmail").value.trim().toLowerCase(), pass=$("inPass").value, btn=$("inBtn");
    if(!/^\S+@\S+\.\S+$/.test(email)||!pass){ $("inMsg").textContent="Enter your email and password."; return; }
    btn.disabled=true;
    sb.auth.signInWithPassword({ email:email, password:pass }).then(function(r){
      btn.disabled=false;
      if(r.error){ $("inMsg").textContent=/Invalid login/i.test(r.error.message)?"Wrong email or password.":r.error.message; return; }
      load(true);
    }).catch(function(err){ btn.disabled=false; $("inMsg").textContent=(err&&err.message)||"Could not sign in."; });
  });

  boot();
})();
</script>
</body>
</html>
