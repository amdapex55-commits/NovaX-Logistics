  function run(name,args,okText){
    if(S.busy) return;
    S.busy=true;
    return rpc(name,args).then(function(r){
      S.busy=false;
      if(r&&r.ok===false){ toast(SAY[r.reason]||"That did not work."); return load(false); }
      S.open=null; if(okText) toast(typeof okText==="function"?okText(r):okText);
      return load(false).then(function(){ return r; });
    }).catch(function(e){ S.busy=false; toast(/fetch|network|Failed/i.test(e.message||"")?"No connection. Nothing changed that you can see: press again.":(e.message||"That did not work.")); });
  }
  /* A second press within 5 s confirms; nothing destructive on one tap. */

    if(btn.dataset.sure==="1") return true;

    setTimeout(function(){ if(btn.isConnected){ btn.dataset.sure="0"; btn.textContent=was; } },5000);
    return false;
  }

      return run("nvi_admin_assign",{ p_job:job, p_rider:rid },"Rider assigned.");
    }
    if(d==="unassign"){ if(!twice(t,"Press again to unassign")) return; return run("nvi_admin_assign",{ p_job:job, p_rider:null },"Job is back in the open list."); }
    if(d==="confirm"){ if(!twice(t,"Press again: I phoned the sender")) return; return run("nvi_admin_confirm",{ p_job:job },"Confirmed. Riders can see it now."); }
    var MARK={ picked:"Picked up", delivered:"Delivered", failed:"Failed delivery", retry:"Picked up", returning:"Returning", returned:"Returned" };
    if(d==="cancel"||MARK[d]||d==="transfer"||d==="pay-received"||d==="pay-writeoff"){
      var note=($("fNote")&&$("fNote").value||"").trim();
      if(note.length<3){ toast("Write a short reason first."); if($("fNote")) $("fNote").focus(); return; }
      var cashEl=$("fCash"), cash=cashEl?cashEl.value.replace(/\D/g,""):"";
      if(d==="cancel") return run("nvi_admin_cancel",{ p_job:job, p_reason:note },"Job cancelled.");
      if(d==="transfer"){
        var s2=document.querySelector('.inline select[data-pick="'+job+'"]'), r2=s2&&s2.value;
        if(!r2){ toast("Choose the new rider first."); if(s2) s2.focus(); return; }
        return run("nvi_admin_assign",{ p_job:job, p_rider:r2, p_note:note },"Parcel moved to the new rider.");
      }
      if(d==="pay-writeoff"){ if(!twice(t,"Press again to write it off")) return; return run("nvi_admin_pay",{ p_job:job, p_action:"writeoff", p_amount:null, p_note:note },"Shortfall written off."); }
      if(d==="pay-received"){
        if(cash===""){ toast("Type the total cash received for this job."); cashEl.focus(); return; }
        return run("nvi_admin_pay",{ p_job:job, p_action:"received", p_amount:Number(cash), p_note:note },"Payment settled.");
      }
      if(cashEl&&cash===""){ toast(SAY.cash_needed); cashEl.focus(); return; }
      return run("nvi_admin_mark",{ p_job:job, p_status:MARK[d], p_note:note, p_cash:cashEl?Number(cash):null, p_reason:d==="failed"?$("fReason").value:null },"Job updated.");
    }
    if(d==="invite"){
      return run("nvi_admin_invite_rider",{ p_name:$("rName").value, p_email:$("rEmail").value, p_phone:$("rPhone").value, p_plate:$("rPlate").value||null },"Rider added. Send them the rider link.");
    }
    if(d==="handover"){
      if(!twice(t,"Press again: "+rs(t.dataset.amt)+" received")) return;
      /* The same key goes with every retry of this handover, so a lost reply
         followed by a second press cannot record the cash twice. */
      var rider=t.dataset.rider; HKEY[rider]=HKEY[rider]||newKey();
      var p=run("nvi_admin_handover",{ p_rider:rider, p_key:HKEY[rider] },function(r){ return rs(r.amount)+" received from "+r.jobs+" job"+(r.jobs===1?"":"s")+"."; });
      if(p) p.then(function(r){ if(r) delete HKEY[rider]; });
      return p;
    }
    if(d==="docs") return run("nvi_admin_check_docs",{ p_rider:t.dataset.rider, p_ok:t.dataset.ok==="1" },t.dataset.ok==="1"?"Documents marked as checked.":"Check removed.");
    if(d==="setrider"){
      var st=t.dataset.st;
      if(st!=="Active"&&!twice(t,st==="Removed"?"Press again to remove":"Press again to block")) return;
      return run("nvi_admin_set_rider",{ p_rider:t.dataset.rider, p_status:st },st==="Active"?"Rider unblocked.":st==="Blocked"?"Rider blocked.":"Rider removed.");
    }
  });
  document.addEventListener("submit",function(e){
    if(e.target.id!=="fIn") return;
    e.preventDefault();
    var email=$("inEmail").value.trim().toLowerCase(), pass=$("inPass").value, btn=$("inBtn");
    if(!/^\S+@\S+\.\S+$/.test(email)||!pass){ $("inMsg").textContent="Enter your email and password."; return; }
    btn.disabled=true;
    sb.auth.signInWithPassword({ email:email, password:pass }).then(function(r){
      btn.disabled=false;
      if(r.error){ $("inMsg").textContent=/Invalid login/i.test(r.error.message)?"Wrong email or password.":r.error.message; return; }
      load(true);
    }).catch(function(err){ btn.disabled=false; $("inMsg").textContent=(err&&err.message)||"Could not sign in."; });
  });

  boot();
})();
</script>
</body>
</html>
