          (j.pay_state==="Disputed"?'<br>'+payChip(j)+'<div class="age">'+esc(j.pay_note||"")+'</div><div class="row">'+fbtn("pay",j,"Settle the cash","btn-dark")+'</div>'+(isOpen?formHtml(j,[]):''):j.pay_state==="Written off"?'<br>'+payChip(j):'')+'</td>'+
        '<td>'+esc(j.rider_name||"–")+'</td></tr>';
    }).join("")+'</tbody></table></div>';
  }

  /* ───── actions ───── */
  var SAY={ not_found:"That job no longer exists.", too_late:"The parcel is already picked up, so the rider cannot be changed.", rider_inactive:"That rider is not active.",
    rider_busy:"That rider already has a job.", need_reason:"Choose or write a reason first.", need_note:"Write a note first.", closed:"That job is already closed.",
    no_rider:"Assign a rider first.", no_docs:"That rider has not sent documents yet.", docs_unchecked:"Check that rider's documents first (Riders tab, Mark as checked).",
    done:"Someone already dealt with that one.", relay_step:"A relay can be planned only before the parcel is delivered.", same_rider:"Choose a different rider from the one who has it.",
    relay_busy:"That rider is already waiting for another relay.", no_login:"That NovaX rider has no active rider login yet.", no_email:"That rider login has no email address.", already_linked:"That NovaX rider is already linked.", wallet_open:"Settle this rider's Instant wallet and pending money requests before changing them to salary.", need_ref:"Type the transaction ID first.", wrong_step:"The job is not at that step any more.", nothing:"That rider holds no cash.",
    name:"Enter the rider's full name.", email:"Enter a valid email.", phone:"Enter a Pakistani mobile like 0300 1234567.", exists:"That email is already a rider.", status:"Unknown status.",
    has_parcel:"A rider holds this parcel, so it cannot be cancelled or left without a rider. Mark it not delivered and send it back instead.", cash_limit:"That rider would exceed the cash limit. Settle their wallet before assigning this COD job.",
    unconfirmed:"Confirm this booking by phone first.",
    rider_has_job:"That rider has a job. Change the rider on the job, or let it finish, first.",
    rider_has_cash:"That rider still holds cash from before wallets. Take it in with Old cash received first.",
    rider_owes:"That rider owes NovaX money. Settle their wallet (Wallets tab) before removing them.",
    no_rider_online:"No rider is online and free, so public booking stays off. Ask a rider to go online in their app first.",
    cash_needed:"Type the cash the rider received at this step (0 if none).", cash_mismatch:"That is more cash than was due.",
    short_note:"Say in the note why the cash is short.", not_disputed:"That payment is no longer in dispute.", amount:"Enter a sensible amount.",
    handed_over:"More than that was already handed to the office for this job. Check the amount.", key:"Press the button again." };
  function run(name,args,okText){
    if(S.busy) return;
    S.busy=true;
    return rpc(name,args).then(function(r){
      S.busy=false;
      if(r&&r.ok===false){ toast(SAY[r.reason]||"That did not work."); return load(false); }
      S.open=null; if(okText) toast(typeof okText==="function"?okText(r):okText);
      return load(false).then(function(){ return r; });
    }).catch(function(e){ S.busy=false; toast(/fetch|network|Failed/i.test(e.message||"")?"No connection. Nothing changed that you can see: press again.":(e.message||"That did not work.")); });
  }
  /* A second press within 5 s confirms; nothing destructive on one tap. */
  function twice(btn,label){
    if(btn.dataset.sure==="1") return true;
    btn.dataset.sure="1"; var was=btn.textContent; btn.textContent=label;
    setTimeout(function(){ if(btn.isConnected){ btn.dataset.sure="0"; btn.textContent=was; } },5000);
    return false;
  }
  function newKey(){
    try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
    return "xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g,function(){ return (Math.random()*16|0).toString(16); });
  }
  var HKEY={};   /* one handover key per rider, kept until the handover answers */
  /* A rider's document opens through a link that works for five minutes. The
     photos are private: there is no permanent address for them. */
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("[data-doc]"); if(!b) return;
    var w=window.open("about:blank","_blank");
    Promise.resolve(sb.storage.from("nvi-rider-docs").createSignedUrl(b.getAttribute("data-doc"),300)).then(function(r){
      var u=r&&r.data&&r.data.signedUrl;
      if(!u){ if(w) w.close(); toast("That photo could not be opened."); return; }
      if(w) w.location=u; else location.href=u;
    }).catch(function(){ if(w) w.close(); toast("That photo could not be opened."); });
  });
  document.addEventListener("click",function(e){
    unlockSound();
    var t=e.target.closest("[data-tab],[data-jump],[data-do],[data-form],[data-act],#openSw,#signOut");
    if(!t||t.disabled) return;
    if(t.dataset.tab){ S.tab=t.dataset.tab; S.open=null; return paint(); }
    if(t.dataset.jump){
      S.tab="live"; S.q=""; if($("srch")) $("srch").value=""; paint();
      var el=$("jc-"+t.dataset.jump); if(el){ el.scrollIntoView({ behavior:"smooth", block:"center" }); el.classList.remove("hl"); void el.offsetWidth; el.classList.add("hl"); }
      return;
    }
    if(t.dataset.act==="reload") return boot();
    if(t.id==="signOut") return Promise.resolve(sb.auth.signOut()).catch(function(){}).then(function(){ renderAuth(); });
    if(t.id==="openSw"){
      var on=t.getAttribute("aria-checked")!=="true";
      if(!twice(t.querySelector("span"),on?"Press again: open to the public":"Press again: stop public booking")) return;
      return run("nvi_admin_set_open",{ p_open:on },on?"Public booking is on.":"Public booking is off.");
    }
    if(t.hasAttribute("data-form")){ S.open=t.dataset.form?{ job:t.dataset.job, kind:t.dataset.form }:null; paint(); var f=$("fCash")||$("fNote"); if(f) f.focus(); return; }
    var d=t.dataset["do"], job=t.dataset.job;
    if(d==="assign"){
      var sel=document.querySelector('select[data-pick="'+job+'"]'), rid=sel&&sel.value;
      if(!rid){ toast("Choose a rider first."); if(sel) sel.focus(); return; }
      return run("nvi_admin_assign",{ p_job:job, p_rider:rid },"Rider assigned.");
    }
    if(d==="unassign"){ if(!twice(t,"Press again to unassign")) return; return run("nvi_admin_assign",{ p_job:job, p_rider:null },"Job is back in the open list."); }
    if(d==="confirm"){ if(!twice(t,"Press again: I phoned the sender")) return; return run("nvi_admin_confirm",{ p_job:job },"Confirmed. Riders can see it now."); }
    var MARK={ picked:"Picked up", delivered:"Delivered", failed:"Failed delivery", retry:"Picked up", returning:"Returning", returned:"Returned" };
    if(d==="cancel"||MARK[d]||d==="transfer"||d==="pay-received"||d==="pay-writeoff"){
      var note=($("fNote")&&$("fNote").value||"").trim();
      if(note.length<3){ toast("Write a short reason first."); if($("fNote")) $("fNote").focus(); return; }
      var cashEl=$("fCash"), cash=cashEl?cashEl.value.replace(/\D/g,""):"";
      if(d==="cancel") return run("nvi_admin_cancel",{ p_job:job, p_reason:note },"Job cancelled.");
      if(d==="transfer"){
        var s2=document.querySelector('.inline select[data-pick="'+job+'"]'), r2=s2&&s2.value;
        if(!r2){ toast("Choose the new rider first."); if(s2) s2.focus(); return; }
        return run("nvi_admin_assign",{ p_job:job, p_rider:r2, p_note:note },"Parcel moved to the new rider.");
      }
      if(d==="pay-writeoff"){ if(!twice(t,"Press again to write it off")) return; return run("nvi_admin_pay",{ p_job:job, p_action:"writeoff", p_amount:null, p_note:note },"Shortfall written off."); }
      if(d==="pay-received"){
        if(cash===""){ toast("Type the total cash received for this job."); cashEl.focus(); return; }
        return run("nvi_admin_pay",{ p_job:job, p_action:"received", p_amount:Number(cash), p_note:note },"Payment settled.");
      }
      if(cashEl&&cash===""){ toast(SAY.cash_needed); cashEl.focus(); return; }
      return run("nvi_admin_mark",{ p_job:job, p_status:MARK[d], p_note:note, p_cash:cashEl?Number(cash):null, p_reason:d==="failed"?$("fReason").value:null },"Job updated.");
    }
    if(d==="invite"){
      return run("nvi_admin_invite_rider",{ p_name:$("rName").value, p_email:$("rEmail").value, p_phone:$("rPhone").value, p_plate:$("rPlate").value||null },"Rider added. Send them the rider link.");
    }
    if(d==="handover"){
      if(!twice(t,"Press again: "+rs(t.dataset.amt)+" received")) return;
      /* The same key goes with every retry of this handover, so a lost reply
         followed by a second press cannot record the cash twice. */
      var rider=t.dataset.rider; HKEY[rider]=HKEY[rider]||newKey();
      var p=run("nvi_admin_handover",{ p_rider:rider, p_key:HKEY[rider] },function(r){ return rs(r.amount)+" received from "+r.jobs+" job"+(r.jobs===1?"":"s")+"."; });
      if(p) p.then(function(r){ if(r) delete HKEY[rider]; });
      return p;
    }
    if(d==="w-dep-all"){ if(!twice(t,"Press again: "+rs(t.dataset.amt)+" arrived")) return; return run("nvi_admin_deposit",{ p_id:Number(t.dataset.id), p_ok:true, p_amount:null, p_note:null },function(r){ return "Confirmed."+(r&&r.released?" "+r.released+" COD job"+(r.released===1?" is":"s are")+" now withdrawable for the client.":""); }); }
    if(d==="w-dep-ok"){ var da=Number(($("dAmt").value||"").replace(/\D/g,"")); if(!da){ toast("Type the amount that arrived."); return; }
      return run("nvi_admin_deposit",{ p_id:Number(t.dataset.id), p_ok:true, p_amount:da, p_note:($("fNote").value||"").trim()||null },"Confirmed."); }
    if(d==="w-dep-no"){ if(!twice(t,"Press again to reject")) return; return run("nvi_admin_deposit",{ p_id:Number(t.dataset.id), p_ok:false, p_amount:null, p_note:($("fNote").value||"").trim() },"Rejected."); }
    if(d==="w-pay-ok"){ var pr=($("pRef"+t.dataset.id).value||"").trim(); if(pr.length<4){ toast("Type the transaction ID first."); $("pRef"+t.dataset.id).focus(); return; }
      if(!twice(t,"Press again: I sent it")) return; return run("nvi_admin_payout",{ p_id:Number(t.dataset.id), p_ok:true, p_ref:pr, p_note:null },"Marked paid."); }
    if(d==="w-pay-no"){ if(!twice(t,"Press again to reject")) return; return run("nvi_admin_payout",{ p_id:Number(t.dataset.id), p_ok:false, p_ref:null, p_note:($("fNote").value||"").trim() },"Rejected. The money is back in their wallet."); }
    if(d==="w-hist"){
      var wid=t.dataset.wallet; S.open={ job:wid, kind:"w-hist" }; paint();
      return rpc("nvi_admin_ledger",{ p_wallet:wid }).then(function(list){ S.hist[wid]=list||[]; if(S.open&&S.open.job===wid) paint(); }).catch(function(e){ toast(e.message||"Could not load the history."); });
    }
    if(d==="relay"){ var rr=$("rlRider").value; if(!rr){ toast("Choose who takes the parcel over."); $("rlRider").focus(); return; }
      return run("nvi_admin_relay",{ p_job:job, p_rider:rr, p_note:($("rlNote").value||"").trim()||null },"Relay planned. Both riders can see it."); }
    if(d==="relay-off"){ if(!twice(t,"Press again to call it off")) return; return run("nvi_admin_relay",{ p_job:job, p_rider:null, p_note:null },"Relay called off."); }
    if(d==="link"){ var nx=$("lnRider")&&$("lnRider").value; if(!nx){ toast("Choose the NovaX rider."); return; }
      return run("nvi_admin_link_route_rider",{ p_novax_rider:nx },"Linked. They see an Instant tab in the NovaX rider app.").then(function(){ S.cands=null; }); }
    if(d==="link-load"){ return rpc("nvi_admin_route_candidates").then(function(c){ S.cands=c||[]; paint(); }).catch(function(e){ toast(e.message||"Could not load NovaX riders."); }); }
    if(d==="c-hold"){ var hn=($("fNote").value||"").trim(); if(hn.length<5){ toast("Write why, so the client and the office can see it."); $("fNote").focus(); return; }
      if(!twice(t,"Press again to hold")) return; return run("nvi_admin_set_client",{ p_client:t.dataset.client, p_block:true, p_reason:hn },"Account on hold."); }
    if(d==="c-release"){ if(!twice(t,"Press again to release")) return; return run("nvi_admin_set_client",{ p_client:t.dataset.client, p_block:false, p_reason:null },"Hold released."); }
    if(d==="w-adjust"){
      var am=Number(String($("aAmt").value||"").replace(/[^\d-]/g,"")), an=($("fNote").value||"").trim();
      if(!am){ toast("Type the amount, with a minus to take money off."); $("aAmt").focus(); return; }
      if(an.length<5){ toast("Write why, so it is clear in their history."); $("fNote").focus(); return; }
      if(!twice(t,"Press again: "+(am>0?"add ":"take ")+rs(Math.abs(am)))) return;
      S.adjKey=S.adjKey||newKey();
      var pa=run("nvi_admin_adjust",{ p_wallet:t.dataset.wallet, p_amount:am, p_note:an, p_key:S.adjKey },"Correction posted.");
      if(pa) pa.then(function(r){ if(r) S.adjKey=null; });
      return pa;
    }
    if(d==="docs") return run("nvi_admin_check_docs",{ p_rider:t.dataset.rider, p_ok:t.dataset.ok==="1" },t.dataset.ok==="1"?"Documents marked as checked.":"Check removed.");
    if(d==="setrider"){
      var st=t.dataset.st;
      if(st!=="Active"&&!twice(t,st==="Removed"?"Press again to remove":"Press again to block")) return;
      return run("nvi_admin_set_rider",{ p_rider:t.dataset.rider, p_status:st },st==="Active"?"Rider unblocked.":st==="Blocked"?"Rider blocked.":"Rider removed.");
    }
  });
  document.addEventListener("submit",function(e){
    if(e.target.id!=="fIn") return;
    e.preventDefault();
    var email=$("inEmail").value.trim().toLowerCase(), pass=$("inPass").value, btn=$("inBtn");
    if(!/^\S+@\S+\.\S+$/.test(email)||!pass){ $("inMsg").textContent="Enter your email and password."; return; }
    btn.disabled=true;
    sb.auth.signInWithPassword({ email:email, password:pass }).then(function(r){
      btn.disabled=false;
      if(r.error){ $("inMsg").textContent=/Invalid login/i.test(r.error.message)?"Wrong email or password.":r.error.message; return; }
      load(true);
    }).catch(function(err){ btn.disabled=false; $("inMsg").textContent=(err&&err.message)||"Could not sign in."; });
  });

  boot();
})();
</script>
</body>
</html>
